apiVersion: v1
kind: Secret
metadata:
  name: {{ include "provisioner.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provisioner.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "token is required (one-time token from manager Settings → Provisioners)" .Values.token }}
