# The Postgres connection Secret is created from `pg.url`. When an existing
# Secret is supplied via `pg.existingSecret`, nothing is rendered here and the
# Deployment reads from that Secret instead. If neither is set, rendering
# fails so the install does not succeed with a pod that cannot start.
{{- if not .Values.pg.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manager.fullname" . }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  LAELIA_PG_URL: {{ required "pg.url is required when pg.existingSecret is not set" .Values.pg.url | quote }}
{{- end }}
