{{- if .Values.ingress.enabled }}
# Optional Ingress for the manager: the deployment also starts with
# `--trust-proxy` unless the user forces `trustProxy: false`. Machine traffic
# needs an ingress controller that forwards HTTP/2 upstream — see
# docs/deploy.md §3b.
{{- $fullName := include "manager.fullname" . }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts must define at least one host when ingress.enabled is true" }}
{{- end }}
{{- range .Values.ingress.hosts }}
{{- if not .paths }}
{{- fail (printf "ingress.hosts: host %q must define at least one path" .host) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}