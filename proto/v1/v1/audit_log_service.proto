syntax = "proto3";

package laelia.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

// AuditLog is one audited API call: who did what, on which resource, with the
// structured change payload (e.g. IAM binding deltas) when the method records
// one. Audit logs are written by the audit interceptor for methods annotated
// with audit=true.
message AuditLog {
  // The audit log resource name, in the form "auditLogs/{id}".
  string name = 1;
  // The RPC method, e.g. "/laelia.v1.IamService/SetWorkspaceIamPolicy".
  string method = 2;
  // The caller type: "user", "agent", or "unknown".
  string actor_type = 3;
  // The caller identifier: user email or agent resource id.
  string actor_id = 4;
  // The caller's source IP.
  string source_ip = 5;
  // The outcome status: "ok" or a connect code string.
  string status = 6;
  // The error message when the call failed.
  string error = 7;
  // The target resource of the call, e.g. "agents/{rid}" or "workspaces/-".
  string resource = 8;
  // The structured change payload as JSON (e.g. IAM binding deltas), empty
  // when the method records none.
  string payload = 9;
  // When the call happened.
  google.protobuf.Timestamp create_time = 10;
}

message SearchAuditLogsRequest {
  // The maximum number of logs to return. The service may return fewer than
  // this value. If unspecified, at most 100 logs will be returned.
  int32 page_size = 1;
  // A page token, received from a previous SearchAuditLogs call.
  string page_token = 2;

  // Filter is used to filter audit logs. Supported fields (equality):
  // - method: the RPC method, e.g. "/laelia.v1.IamService/SetWorkspaceIamPolicy".
  // - actor: the caller identifier (email or agent resource id).
  // - resource: the target resource name.
  // - status: the outcome status ("ok" or a connect code string).
  // Example: method = "/laelia.v1.IamService/SetWorkspaceIamPolicy"
  string filter = 3;

  // Order by create_time; only "create_time desc" (default) and
  // "create_time asc" are supported.
  string order_by = 4;
}

message SearchAuditLogsResponse {
  repeated AuditLog audit_logs = 1;
  string next_page_token = 2;
}

message ExportAuditLogsRequest {
  // Same filter syntax as SearchAuditLogsRequest.filter.
  string filter = 1;
  // Order by create_time; only "create_time desc" (default) and
  // "create_time asc" are supported.
  string order_by = 2;
  // The maximum number of rows to export. Defaults to 10000, capped at 100000.
  int32 limit = 3;
}

message ExportAuditLogsResponse {
  // The audit logs as CSV: name, method, actor_type, actor_id, source_ip,
  // status, error, resource, payload, create_time.
  string content = 1;
}

// AuditLogService exposes the structured audit trail. Search and export are
// admin-tier (laelia.auditLogs.search / laelia.auditLogs.export).
service AuditLogService {
  // Search audit logs with filtering and pagination.
  rpc SearchAuditLogs(SearchAuditLogsRequest) returns (SearchAuditLogsResponse) {
    option (google.api.http) = {get: "/v1/auditLogs:search"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.auditLogs.search";
  }

  // Export audit logs as CSV.
  rpc ExportAuditLogs(ExportAuditLogsRequest) returns (ExportAuditLogsResponse) {
    option (google.api.http) = {get: "/v1/auditLogs:export"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.auditLogs.export";
  }
}
