syntax = "proto3";

package laelia.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";
import "v1/common.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

service AgentService {
  // ========== Management APIs (IAM auth, admin only) ==========

  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (google.api.http) = {
      post: "/v1/agents"
      body: "agent"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.create";
    option (laelia.v1.audit) = true;
  }

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.http) = {get: "/v1/agents"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.get";
  }

  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {get: "/v1/{name=agents/*}"};
    option (google.api.method_signature) = "name";
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.get";
  }

  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=agents/*}"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Token rotation: generate a new bootstrap token, old token invalid after grace period
  rpc RotateAgentToken(RotateAgentTokenRequest) returns (RotateAgentTokenResponse) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:rotateToken"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Token revocation: revoke all tokens for the agent
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (RevokeAgentTokenResponse) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:revokeToken"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Admin force disconnects an agent connection
  rpc ForceDisconnectAgent(ForceDisconnectAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:forceDisconnect"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // List agent sessions
  rpc ListAgentSessions(ListAgentSessionsRequest) returns (ListAgentSessionsResponse) {
    option (google.api.http) = {get: "/v1/{name=agents/*}/sessions"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.listSessions";
  }

  // Update agent ACP config YAML (admin only)
  rpc UpdateAgentACPConfig(UpdateAgentACPConfigRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/v1/{name=agents/*}:updateAcpConfig"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Ask the agent daemon to re-probe its host for installed LLM agent providers
  // and their models. Returns the freshly discovered provider list (also
  // persisted into agent.info.available_providers). Admin only.
  rpc RefreshAgentProviders(RefreshAgentProvidersRequest) returns (RefreshAgentProvidersResponse) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:refreshProviders"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // ========== Agent Connection APIs (CUSTOM auth, agent tokens) ==========

  // Agent initial connection using bootstrap token
  rpc ConnectAgent(ConnectAgentRequest) returns (ConnectAgentResponse) {
    option (google.api.http) = {
      post: "/v1/agents:connect"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
    option (laelia.v1.audit) = true;
  }

  // Agent heartbeat
  rpc AgentHeartbeat(AgentHeartbeatRequest) returns (AgentHeartbeatResponse) {
    option (google.api.http) = {
      post: "/v1/agents:heartbeat"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
  }

  // Agent graceful disconnect
  rpc AgentDisconnect(AgentDisconnectRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/agents:disconnect"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
    option (laelia.v1.audit) = true;
  }

  // Agent refreshes access token
  rpc RefreshAgentToken(RefreshAgentTokenRequest) returns (RefreshAgentTokenResponse) {
    option (google.api.http) = {
      post: "/v1/agents:refreshToken"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
    option (laelia.v1.audit) = true;
  }

  // Health check (no auth required)
  rpc Hello(HelloRequest) returns (HelloResponse) {
    option (google.api.http) = {
      post: "/v1/agent/hello"
      body: "*"
    };
    option (laelia.v1.allow_without_credential) = true;
    option (laelia.v1.audit) = false;
  }
}

// ========== Request/Response Messages ==========

// --- Create Agent ---

message CreateAgentRequest {
  Agent agent = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateAgentResponse {
  Agent agent = 1;
  string bootstrap_token = 2; // 7-day validity, reusable until rotated/revoked
}

// --- Token Management ---

message RotateAgentTokenRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  string reason = 2; // audit purpose
}

message RotateAgentTokenResponse {
  string bootstrap_token = 1; // new bootstrap token
}

message RevokeAgentTokenRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  string reason = 2;
}

message RevokeAgentTokenResponse {}

// --- Force Disconnect ---

message ForceDisconnectAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  string reason = 2;
}

// --- Session Management ---

message ListAgentSessionsRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  int32 page_size = 2;
  string page_token = 3;
  bool include_terminated = 4; // default: only active sessions
}

message ListAgentSessionsResponse {
  repeated AgentSession sessions = 1;
  string next_page_token = 2;
}

message AgentSession {
  string session_id = 1;
  string agent_name = 2;
  string source_ip = 3;
  string agent_version = 4;
  string fingerprint = 5;
  google.protobuf.Timestamp connected_at = 6;
  google.protobuf.Timestamp last_heartbeat_at = 7;
  google.protobuf.Timestamp disconnected_at = 8;
  string disconnect_reason = 9;
  AgentStatus.ConnectionState state = 10;
}

// --- Agent Connection ---

message ConnectAgentRequest {
  string bootstrap_token = 1; // first connection or after refresh failure
  AgentInfo info = 2;
  string fingerprint = 3; // client-generated connection fingerprint (hostname:os:arch)
}

message ConnectAgentResponse {
  string access_token = 1; // 15-minute validity
  string refresh_token = 2; // 24-hour validity, single-use rotation
  string session_id = 3; // session identifier
  string next_nonce = 4; // server-signed nonce for next heartbeat
  google.protobuf.Timestamp access_token_expires_at = 5;
  AgentStatus initial_status = 6;
  AgentACPConfig acp_config = 7; // server-provided structured ACP config
}

// --- Agent Heartbeat ---

message AgentHeartbeatRequest {
  string session_id = 1;
  string previous_nonce = 2; // nonce from previous response (replay protection)
  AgentMetrics metrics = 3; // optional agent metrics
}

message AgentHeartbeatResponse {
  string next_nonce = 1; // nonce for next request
  google.protobuf.Timestamp next_heartbeat_at = 2; // expected next heartbeat time
  string access_token = 3; // new access token (only if expiring soon)
  google.protobuf.Timestamp access_token_expires_at = 4;
  // Fallback channel: when bidi command stream is unavailable
  bool command_stream_required = 5;
  PendingCommandHint pending_command_hint = 6;
}

message PendingCommandHint {
  string command_id = 1;
  string command = 2;
  map<string, string> env = 3;
  string working_dir = 4;
  int32 timeout_seconds = 5;
}

// --- Agent Disconnect ---

message AgentDisconnectRequest {
  string session_id = 1;
  string reason = 2; // "shutdown", "upgrade" etc.
}

// --- Token Refresh ---

message RefreshAgentTokenRequest {
  string refresh_token = 1;
  string fingerprint = 2; // verify connection fingerprint
}

message RefreshAgentTokenResponse {
  string access_token = 1;
  string refresh_token = 2; // new refresh token (rotation)
  google.protobuf.Timestamp access_token_expires_at = 3;
}

// --- List/Query ---

message ListAgentsRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool show_deleted = 3;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
}

message GetAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
}

message DeleteAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
}

// --- Update ACP Config ---

message UpdateAgentACPConfigRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  AgentACPConfig acp_config = 2 [(google.api.field_behavior) = REQUIRED];
}

message RefreshAgentProvidersRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
}

message RefreshAgentProvidersResponse {
  repeated AgentProviderInfo providers = 1;
}

// --- Hello ---

message HelloRequest {}

message HelloResponse {
  int64 current_time = 1;
  string server_version = 2;
}

// --- Agent Definition ---

message Agent {
  option (google.api.resource) = {
    type: "laelia/Agent"
    pattern: "agents/{agent}"
  };

  string name = 1;
  State state = 2;
  string title = 3;
  // Token field removed: tokens are no longer returned in API responses.
  // Use RotateAgentToken to get a new bootstrap token.
  reserved 4;
  reserved "token";
  AgentInfo info = 5;
  AgentStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  map<string, string> labels = 8;
  google.protobuf.Timestamp last_token_rotated_at = 9;
  int32 token_version = 10;
  // Creator's user resource name (users/{id}); empty for legacy agents with no
  // recorded creator. Only the creator or a workspace admin may modify the agent.
  string created_by = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // can_edit reports whether the current caller may modify this agent
  // (laelia.agents.edit): true for the creator (via the agentEditor IAM binding)
  // and for workspace admins (via the all-permissions union), false otherwise.
  // Populated per caller by GetAgent/ListAgents; not set on agent-daemon paths.
  bool can_edit = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message AgentInfo {
  string agent_type = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string ip = 5;
  string version = 6;
  map<string, string> labels = 7;
  AgentCapability capability = 8;
  repeated AgentProviderInfo available_providers = 9; // LLM agent providers auto-discovered by the agent daemon (agent-owned, not overwritten by the server)
  AgentACPConfig acp_config = 10;
}

// AgentProviderInfo describes one LLM agent provider detected on the agent
// daemon's host. Reported via ConnectAgent and refreshed on demand. The server
// treats this as agent-owned: it preserves it across ConnectAgent/Update flows
// the same way it preserves acp_config.
message AgentProviderInfo {
  string provider_id = 1; // e.g. "opencode", "claude-code"
  string display_name = 2;
  string version = 3;
  string executable_path = 4;
  repeated AgentModelOption models = 5; // empty when the provider does not advertise a model config option
  bool supports_model_config_option = 6; // whether probing observed a category=="model" config option
  google.protobuf.Timestamp detected_at = 7;
}

// AgentModelOption is one model selectable via the ACP session config option
// round trip. Value is the valueId the client sends to SetSessionConfigOption.
message AgentModelOption {
  string value = 1;
  string name = 2;
  string description = 3;
}

// User-configurable ACP settings. Everything else (working dir, capabilities,
// permissions) is derived from a built-in template, not set by the admin.
message AgentACPConfig {
  string executable = 1; // command to run, e.g. "npx". Only used when provider is "custom" or empty.
  repeated string args = 2; // args passed to executable, e.g. ["-y", "@agentclientprotocol/claude-agent-acp@latest"]
  repeated string allow_env = 3; // env var names the child process may inherit
  string provider = 4; // selected LLM agent provider id, e.g. "opencode", "claude-code", "custom"
  string model = 5; // selected model valueId, matching an option advertised by the provider in NewSession ConfigOptions
  map<string, string> custom_env = 6; // user-defined key-value env vars overlaid (and overriding) the inherited allow_env set
  string persona_prompt = 7; // admin-authored self-awareness prompt: personality, chat style, focus area. Empty = not loaded.
}

message AgentCapability {
  bool supports_acp = 1;
  int32 max_timeout_seconds = 3;
  bool supports_diff = 4;
  bool supports_raw_events = 5;
  bool supports_tool_traces = 6;
  int32 max_event_count = 7;
  int64 max_output_bytes = 8;
  bool supports_autonomous_decision = 9;
}

message AgentStatus {
  enum ConnectionState {
    CONNECTION_STATE_UNSPECIFIED = 0;
    ONLINE = 1;
    OFFLINE = 2;
    ERROR = 3;
    KICKED = 4; // evicted by a new connection
  }
  ConnectionState state = 1;
  google.protobuf.Timestamp last_heartbeat_time = 2;
  google.protobuf.Timestamp connected_time = 3;
  string error_message = 4;
  string active_session_id = 5; // current active session ID
}

// --- Agent Metrics ---

message AgentMetrics {
  double cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint32 uptime_seconds = 6;
  uint32 goroutine_count = 7;
}
