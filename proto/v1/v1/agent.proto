syntax = "proto3";

package laelia.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";
import "v1/common.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

service AgentService {
  // ========== Management APIs (IAM auth, admin only) ==========

  // CreateAgent is handler-gated (no permission annotation): the machine's
  // creator, a workspace admin, or a principal bound to
  // roles/machineAgentCreator on the machine's IAM policy may create agents on
  // it. The machine-scoped check is enforced by the handler via
  // laelia.machines.createAgent against the machine's IAM policy.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (google.api.http) = {
      post: "/v1/agents"
      body: "agent"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.audit) = true;
  }

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.http) = {get: "/v1/agents"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.get";
  }

  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {get: "/v1/{name=agents/*}"};
    option (google.api.method_signature) = "name";
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.get";
  }

  // UpdateAgent patches a single mutable agent field. Only allow_add_to_channel
  // is supported initially (any other update_mask path is rejected). Authorized
  // in the handler for the agent's owner or a workspace admin; the IAM
  // interceptor's agents.edit is admin-only, so this RPC carries no permission
  // annotation and is handler-gated.
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      patch: "/v1/{agent.name=agents/*}"
      body: "agent"
    };
    option (google.api.method_signature) = "agent,update_mask";
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.audit) = true;
  }

  // TransferAgentOwnership reassigns the agent's owner to another user. The new
  // owner takes effect immediately and unilaterally (no acceptance required);
  // the previous owner loses owner authority at once. Authorized in the handler
  // for the agent's current owner or a workspace admin; like UpdateAgent this
  // RPC carries no permission annotation (agents.edit is admin-only) and is
  // handler-gated via canEditAgent.
  rpc TransferAgentOwnership(TransferAgentOwnershipRequest) returns (TransferAgentOwnershipResponse) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:transferOwnership"
      body: "*"
    };
    option (google.api.method_signature) = "name,new_owner";
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.audit) = true;
  }

  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=agents/*}"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Token rotation: generate a new bootstrap token, old token invalid after grace period
  rpc RotateAgentToken(RotateAgentTokenRequest) returns (RotateAgentTokenResponse) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:rotateToken"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Token revocation: revoke all tokens for the agent
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (RevokeAgentTokenResponse) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:revokeToken"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Admin force disconnects an agent connection
  rpc ForceDisconnectAgent(ForceDisconnectAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:forceDisconnect"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // List agent sessions
  rpc ListAgentSessions(ListAgentSessionsRequest) returns (ListAgentSessionsResponse) {
    option (google.api.http) = {get: "/v1/{name=agents/*}/sessions"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.listSessions";
  }

  // Update the agent's ACP config. Handler-gated (no permission annotation):
  // the agent's owner or a workspace admin may update it. Setting a legacy
  // inline api_provider/api_key additionally requires laelia.agents.edit (only
  // workspace admin today); owners without it must use a global provider.
  rpc UpdateAgentACPConfig(UpdateAgentACPConfigRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/v1/{name=agents/*}:updateAcpConfig"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.audit) = true;
  }

  // Ask the agent daemon to re-probe its host for installed LLM agent providers
  // and their models. Returns the freshly discovered provider list (also
  // persisted into agent.info.available_providers). Admin only.
  rpc RefreshAgentProviders(RefreshAgentProvidersRequest) returns (RefreshAgentProvidersResponse) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:refreshProviders"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // List the models a built-in pi agent's LLM API provider exposes. The manager
  // proxies the provider's model-listing HTTP API (DeepSeek `GET /models` with
  // the caller's api_key; OpenRouter `GET /models`, public) so the model list is
  // fetched dynamically rather than hardcoded. Not agent-scoped: the add-agent
  // form calls it before the agent exists. Admin (agents.edit) only.
  rpc ListPiModels(ListPiModelsRequest) returns (ListPiModelsResponse) {
    option (google.api.http) = {
      post: "/v1/pi:listModels"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // ========== Agent Connection APIs (CUSTOM auth, agent tokens) ==========

  // Agent initial connection using bootstrap token
  rpc ConnectAgent(ConnectAgentRequest) returns (ConnectAgentResponse) {
    option (google.api.http) = {
      post: "/v1/agents:connect"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
    option (laelia.v1.audit) = true;
  }

  // Agent heartbeat
  rpc AgentHeartbeat(AgentHeartbeatRequest) returns (AgentHeartbeatResponse) {
    option (google.api.http) = {
      post: "/v1/agents:heartbeat"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
  }

  // Agent graceful disconnect
  rpc AgentDisconnect(AgentDisconnectRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/agents:disconnect"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
    option (laelia.v1.audit) = true;
  }

  // Agent refreshes access token
  rpc RefreshAgentToken(RefreshAgentTokenRequest) returns (RefreshAgentTokenResponse) {
    option (google.api.http) = {
      post: "/v1/agents:refreshToken"
      body: "*"
    };
    option (laelia.v1.auth_method) = CUSTOM;
    option (laelia.v1.audit) = true;
  }

  // UploadAgentAvatar replaces an agent's avatar image. Requires
  // laelia.agents.edit on the agent; the caller must be the agent's creator or a
  // workspace admin. No google.api.http annotation: bytes travel over Connect-JSON.
  rpc UploadAgentAvatar(UploadAgentAvatarRequest) returns (Agent) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // DownloadAgentAvatar fetches an agent's avatar image bytes. Any authenticated
  // user may download any agent's avatar (workspace-internal profile image).
  rpc DownloadAgentAvatar(DownloadAgentAvatarRequest) returns (DownloadAgentAvatarResponse);

  // DeleteAgentAvatar clears an agent's avatar, reverting to the pixel default.
  // Requires laelia.agents.edit on the agent.
  rpc DeleteAgentAvatar(DeleteAgentAvatarRequest) returns (Agent) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.edit";
    option (laelia.v1.audit) = true;
  }

  // Health check (no auth required)
  rpc Hello(HelloRequest) returns (HelloResponse) {
    option (google.api.http) = {
      post: "/v1/agent/hello"
      body: "*"
    };
    option (laelia.v1.allow_without_credential) = true;
    option (laelia.v1.audit) = false;
  }
}

// ========== Request/Response Messages ==========

// --- Create Agent ---

message CreateAgentRequest {
  Agent agent = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateAgentResponse {
  Agent agent = 1;
  string bootstrap_token = 2; // 7-day validity, reusable until rotated/revoked
}

message UpdateAgentRequest {
  Agent agent = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2;
}

// --- Ownership Transfer ---

message TransferAgentOwnershipRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  // New owner's user resource name (users/{id}).
  string new_owner = 2 [(google.api.field_behavior) = REQUIRED];
  string reason = 3; // audit purpose
}

message TransferAgentOwnershipResponse {
  Agent agent = 1;
}

// --- Token Management ---

message RotateAgentTokenRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  string reason = 2; // audit purpose
}

message RotateAgentTokenResponse {
  string bootstrap_token = 1; // new bootstrap token
}

message RevokeAgentTokenRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  string reason = 2;
}

message RevokeAgentTokenResponse {}

// --- Force Disconnect ---

message ForceDisconnectAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  string reason = 2;
}

// --- Session Management ---

message ListAgentSessionsRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  int32 page_size = 2;
  string page_token = 3;
  bool include_terminated = 4; // default: only active sessions
}

message ListAgentSessionsResponse {
  repeated AgentSession sessions = 1;
  string next_page_token = 2;
}

message AgentSession {
  string session_id = 1;
  string agent_name = 2;
  string source_ip = 3;
  string agent_version = 4;
  string fingerprint = 5;
  google.protobuf.Timestamp connected_at = 6;
  google.protobuf.Timestamp last_heartbeat_at = 7;
  google.protobuf.Timestamp disconnected_at = 8;
  string disconnect_reason = 9;
  AgentStatus.ConnectionState state = 10;
}

// --- Agent Connection ---

message ConnectAgentRequest {
  string bootstrap_token = 1; // first connection or after refresh failure
  AgentInfo info = 2;
  string fingerprint = 3; // client-generated connection fingerprint (hostname:os:arch)
}

message ConnectAgentResponse {
  string access_token = 1; // 15-minute validity
  string refresh_token = 2; // 24-hour validity, single-use rotation
  string session_id = 3; // session identifier
  string next_nonce = 4; // server-signed nonce for next heartbeat
  google.protobuf.Timestamp access_token_expires_at = 5;
  AgentStatus initial_status = 6;
  AgentACPConfig acp_config = 7; // server-provided structured ACP config
}

// --- Agent Heartbeat ---

message AgentHeartbeatRequest {
  string session_id = 1;
  string previous_nonce = 2; // nonce from previous response (replay protection)
  AgentMetrics metrics = 3; // optional agent metrics
}

message AgentHeartbeatResponse {
  string next_nonce = 1; // nonce for next request
  google.protobuf.Timestamp next_heartbeat_at = 2; // expected next heartbeat time
  string access_token = 3; // new access token (only if expiring soon)
  google.protobuf.Timestamp access_token_expires_at = 4;
  // Fallback channel: when bidi command stream is unavailable
  bool command_stream_required = 5;
  PendingCommandHint pending_command_hint = 6;
}

message PendingCommandHint {
  string command_id = 1;
  string command = 2;
  map<string, string> env = 3;
  string working_dir = 4;
  int32 timeout_seconds = 5;
}

// --- Agent Disconnect ---

message AgentDisconnectRequest {
  string session_id = 1;
  string reason = 2; // "shutdown", "upgrade" etc.
}

// --- Token Refresh ---

message RefreshAgentTokenRequest {
  string refresh_token = 1;
  string fingerprint = 2; // verify connection fingerprint
}

message RefreshAgentTokenResponse {
  string access_token = 1;
  string refresh_token = 2; // new refresh token (rotation)
  google.protobuf.Timestamp access_token_expires_at = 3;
}

// --- List/Query ---

message ListAgentsRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool show_deleted = 3;
  // parent, when set to a machine resource name (machines/{machine}), filters
  // the list to agents bound to that machine. Empty lists all agents.
  string parent = 4;
}

message ListAgentsResponse {
  repeated AgentSummary agents = 1;
  string next_page_token = 2;
}

message GetAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
}

message DeleteAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
}

// --- Update ACP Config ---

message UpdateAgentACPConfigRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  AgentACPConfig acp_config = 2 [(google.api.field_behavior) = REQUIRED];
}

message RefreshAgentProvidersRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
}

message RefreshAgentProvidersResponse {
  repeated AgentProviderInfo providers = 1;
}

message ListPiModelsRequest {
  // LLM API provider id ("deepseek" | "openrouter"). See AgentACPConfig.api_provider.
  string api_provider = 1 [(google.api.field_behavior) = REQUIRED];
  // Plaintext LLM API key. Required for deepseek; ignored (public endpoint) for openrouter.
  string api_key = 2;
}

message ListPiModelsResponse {
  repeated PiModel models = 1;
}

// PiModel is one model id returned by the LLM API provider's model-listing API.
message PiModel {
  string id = 1; // model id, the value passed to pi --model
  string name = 2; // optional display name (deepseek echoes id; openrouter has a human-readable name)
}

// --- Avatar ---

message UploadAgentAvatarRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Agent"
  ];
  bytes data = 2 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 3;
}

message DownloadAgentAvatarRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Agent"
  ];
}

message DownloadAgentAvatarResponse {
  bytes data = 1;
  string mime_type = 2;
  string etag = 3;
}

message DeleteAgentAvatarRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Agent"
  ];
}

// --- Hello ---

message HelloRequest {}

message HelloResponse {
  int64 current_time = 1;
  string server_version = 2;
}

// --- Agent Definition ---

message Agent {
  option (google.api.resource) = {
    type: "laelia/Agent"
    pattern: "agents/{agent}"
  };

  string name = 1;
  State state = 2;
  string title = 3;
  // Token field removed: tokens are no longer returned in API responses.
  // Use RotateAgentToken to get a new bootstrap token.
  reserved 4;
  reserved "token";
  AgentInfo info = 5;
  AgentStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  map<string, string> labels = 8;
  google.protobuf.Timestamp last_token_rotated_at = 9;
  int32 token_version = 10;
  // Creator's user resource name (users/{id}); empty for legacy agents with no
  // recorded creator. Display-only: it never authorizes anything (the agent's
  // owner does). Immutable after creation.
  string created_by = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // can_edit reports whether the current caller may modify this agent: true for
  // the agent's owner and for workspace admins, false otherwise. Populated per
  // caller by GetAgent/ListAgents; not set on agent-daemon paths.
  bool can_edit = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // avatar is the resource name of the agent's uploaded avatar image, or empty
  // when the agent has not uploaded one (frontend renders a deterministic pixel
  // identicon seeded by the agent id). Format: agents/{agent}/avatar.
  string avatar = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // machine is the resource name of the machine this agent is bound to
  // (machines/{machine}). Required on CreateAgent (the parent machine the agent
  // runs on) and immutable thereafter; an agent runs on exactly one machine,
  // and the machine app picks it up via the MachineChannel control stream.
  string machine = 14 [(google.api.field_behavior) = REQUIRED];

  // allow_add_to_channel controls whether other users may add this agent to a
  // channel. Default false: only the agent's owner or a workspace admin may add
  // it. When true, the normal channel-side rule (conversations.manage = channel
  // owner/admin) applies.
  bool allow_add_to_channel = 15;

  // Owner's user resource name (users/{id}); empty for legacy agents with no
  // recorded owner. The owner is the human responsible for the agent: only the
  // owner or a workspace admin may modify it, the owner may transfer ownership
  // to another user (TransferAgentOwnership), and non-owners' high-risk
  // requests to the agent require the owner's approval (see the agent prompt's
  // Ownership & Safety section). Defaults to the creator on CreateAgent and is
  // backfilled from created_by for existing agents.
  string owner = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Owner's display name — the name the agent writes `dm:@<owner_name>` to when
  // requesting approval for a high-risk operation. Empty for legacy agents.
  string owner_name = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AgentSummary is the lightweight list-view projection of an Agent returned by
// ListAgents. It carries only the fields list/header views need: identity,
// lifecycle state, connection status, and the provider/executable signal that
// agentLifecycle() reads to classify an agent as ready/pending/offline. The
// full Agent (available_providers, the rest of acp_config, capability, host
// info, token fields, created_by, can_edit) is returned only by GetAgent, so
// the two RPCs don't overlap. can_edit is intentionally omitted: resolving it
// per row would N+1 the IAM policy lookup for non-admin callers, and the list
// view does not gate affordances on it (delete is enforced server-side).
message AgentSummary {
  string name = 1;
  State state = 2;
  string title = 3;
  AgentStatus status = 4;
  // provider/executable mirror acp_config.provider/executable on the full
  // Agent, surfaced top-level so list consumers don't pull in AgentInfo.
  string provider = 5;
  string executable = 6;
  // machine is the resource name of the machine this agent is bound to
  // (machines/{machine}).
  string machine = 7;
  // created_by is the creator's user resource name (users/{id}); empty for
  // legacy agents with no recorded creator. Display-only — grouping and
  // authorization use owner. Surfaced on the summary so list consumers can
  // show the creator without an N+1 of GetAgent.
  string created_by = 8;
  // allow_add_to_channel mirrors Agent.allow_add_to_channel so list consumers
  // (e.g. the channel member picker) can hide agents the current caller may
  // not add.
  bool allow_add_to_channel = 9;
  // owner is the owner's user resource name (users/{id}); empty for legacy
  // agents with no recorded owner. Surfaced on the summary so list consumers
  // (e.g. the Members page's per-user "Owned Agents" view and the channel
  // member picker) can group agents by owner without an N+1 of GetAgent.
  string owner = 10;
}

message AgentInfo {
  string agent_type = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string ip = 5;
  string version = 6;
  map<string, string> labels = 7;
  AgentCapability capability = 8;
  repeated AgentProviderInfo available_providers = 9; // LLM agent providers auto-discovered by the agent daemon (agent-owned, not overwritten by the server)
  AgentACPConfig acp_config = 10;
}

// AgentProviderInfo describes one LLM agent provider detected on the agent
// daemon's host. Reported via ConnectAgent and refreshed on demand. The server
// treats this as agent-owned: it preserves it across ConnectAgent/Update flows
// the same way it preserves acp_config.
message AgentProviderInfo {
  string provider_id = 1; // e.g. "opencode", "claude-code"
  string display_name = 2;
  string version = 3;
  string executable_path = 4;
  repeated AgentModelOption models = 5; // empty when the provider does not advertise a model config option
  bool supports_model_config_option = 6; // whether probing observed a category=="model" config option
  google.protobuf.Timestamp detected_at = 7;
}

// AgentModelOption is one model selectable via the ACP session config option
// round trip. Value is the valueId the client sends to SetSessionConfigOption.
message AgentModelOption {
  string value = 1;
  string name = 2;
  string description = 3;
}

// User-configurable ACP settings. Everything else (working dir, capabilities,
// permissions) is derived from a built-in template, not set by the admin.
message AgentACPConfig {
  string executable = 1; // command to run, e.g. "npx". Only used when provider is "custom" or empty.
  repeated string args = 2; // args passed to executable, e.g. ["-y", "@agentclientprotocol/claude-agent-acp@latest"]
  repeated string allow_env = 3; // env var names the child process may inherit
  string provider = 4; // selected LLM agent provider id, e.g. "opencode", "claude-code", "custom", "builtin-pi"
  string model = 5; // selected model valueId, matching an option advertised by the provider in NewSession ConfigOptions
  map<string, string> custom_env = 6; // user-defined key-value env vars overlaid (and overriding) the inherited allow_env set
  string persona_prompt = 7; // admin-authored self-awareness prompt: personality, chat style, focus area. Empty = not loaded.
  // api_provider is the LLM API provider for the built-in pi runtime ("deepseek" or "openrouter"
  // in phase 1). Only meaningful when provider == "builtin-pi"; ignored by ACP runtimes.
  string api_provider = 8;
  // api_key is the plaintext LLM API key for the api_provider. Only meaningful when
  // provider == "builtin-pi"; ignored by ACP runtimes. Stored in the agent info JSONB with the
  // same plaintext-at-rest posture as custom_env. When global_provider is set, api_key is
  // ignored: the key is resolved server-side from the global provider's entry and never stored
  // in (nor returned with) the agent.
  string api_key = 9;
  // global_provider is the resource name of the global API provider this builtin-pi agent uses
  // ("apiProviders/{id}"). Only meaningful when provider == "builtin-pi". When set, the stored
  // config carries the provider/entry references instead of an inline api_provider/api_key; the
  // server resolves the concrete api_provider/api_key/model at the daemon boundary.
  string global_provider = 10;
  // global_provider_entry is the resource name of the (key, model) entry within the global
  // provider, in the form "apiProviders/{id}/entries/{entry}". Only meaningful when
  // provider == "builtin-pi" and global_provider is set.
  string global_provider_entry = 11;
}

message AgentCapability {
  bool supports_acp = 1;
  int32 max_timeout_seconds = 3;
  bool supports_diff = 4;
  bool supports_raw_events = 5;
  bool supports_tool_traces = 6;
  int32 max_event_count = 7;
  int64 max_output_bytes = 8;
  bool supports_autonomous_decision = 9;
  // supports_pi is true for agents backed by the built-in non-ACP pi runtime. The dispatcher's
  // BeginSession gate accepts either supports_acp or supports_pi so a pi agent can run drain
  // sessions without an ACP executor.
  bool supports_pi = 10;
}

message AgentStatus {
  enum ConnectionState {
    CONNECTION_STATE_UNSPECIFIED = 0;
    ONLINE = 1;
    OFFLINE = 2;
    ERROR = 3;
    KICKED = 4; // evicted by a new connection
  }
  ConnectionState state = 1;
  google.protobuf.Timestamp last_heartbeat_time = 2;
  google.protobuf.Timestamp connected_time = 3;
  string error_message = 4;
  string active_session_id = 5; // current active session ID
}

// --- Agent Metrics ---

message AgentMetrics {
  double cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint32 uptime_seconds = 6;
  uint32 goroutine_count = 7;
}
