syntax = "proto3";

package laelia.v1;

import "google/api/field_behavior.proto";
import "store/setting.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

message GetS3ConfigRequest {}

message GetS3ConfigResponse {
  laelia.store.S3ConfigSetting config = 1;
}

message UpdateS3ConfigRequest {
  laelia.store.S3ConfigSetting config = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateS3ConfigResponse {
  laelia.store.S3ConfigSetting config = 1;
}

message GetLlmAgentConfigRequest {}

message GetLlmAgentConfigResponse {
  laelia.store.LlmAgentConfigSetting config = 1;
}

message UpdateLlmAgentConfigRequest {
  laelia.store.LlmAgentConfigSetting config = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateLlmAgentConfigResponse {
  laelia.store.LlmAgentConfigSetting config = 1;
}

message GetUserMcpConfigRequest {}

message GetUserMcpConfigResponse {
  laelia.store.UserMcpConfigSetting config = 1;
}

message UpdateUserMcpConfigRequest {
  laelia.store.UserMcpConfigSetting config = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateUserMcpConfigResponse {
  laelia.store.UserMcpConfigSetting config = 1;
}

message GetSetupStatusRequest {}

// SetupItem describes one required-config item the admin onboarding overlay
// surfaces. The backend is the source of truth for `configured`; the frontend
// owns presentation (title/description/route) keyed by `id`.
message SetupItem {
  string id = 1;
  bool configured = 2;
}

message GetSetupStatusResponse {
  repeated SetupItem items = 1;
}

message GetDebugConfigRequest {}

message GetDebugConfigResponse {
  bool enabled = 1;
}

message UpdateDebugConfigRequest {
  bool enabled = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateDebugConfigResponse {
  bool enabled = 1;
}

// SettingService exposes workspace-level configuration. It is admin-only; the
// handlers enforce workspace admin membership and return
// connect.CodePermissionDenied otherwise. The S3 secret_key is masked on read;
// an update carrying a masked secret preserves the stored value.
service SettingService {
  rpc GetS3Config(GetS3ConfigRequest) returns (GetS3ConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.get";
  }

  rpc UpdateS3Config(UpdateS3ConfigRequest) returns (UpdateS3ConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.update";
    option (laelia.v1.audit) = true;
  }

  // GetLlmAgentConfig reads the workspace LLM agent configuration. It is
  // handler-gated (no permission annotation) so the agent create/edit forms —
  // which members use — can read the toggle without a settings permission.
  rpc GetLlmAgentConfig(GetLlmAgentConfigRequest) returns (GetLlmAgentConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
  }

  // UpdateLlmAgentConfig updates the workspace LLM agent configuration.
  // Admin (laelia.settings.update) only.
  rpc UpdateLlmAgentConfig(UpdateLlmAgentConfigRequest) returns (UpdateLlmAgentConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.update";
    option (laelia.v1.audit) = true;
  }

  // GetUserMcpConfig reads whether users may configure personal MCP servers.
  // It is handler-gated (no permission annotation) so any authenticated user
  // can render the personal MCP settings page.
  rpc GetUserMcpConfig(GetUserMcpConfigRequest) returns (GetUserMcpConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
  }

  // UpdateUserMcpConfig updates whether users may configure personal MCP
  // servers. Admin (laelia.settings.update) only.
  rpc UpdateUserMcpConfig(UpdateUserMcpConfigRequest) returns (UpdateUserMcpConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.update";
    option (laelia.v1.audit) = true;
  }

  // GetSetupStatus reports which required-config items are not yet configured,
  // so the frontend can guide an admin to finish setting up the workspace.
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.get";
  }

  rpc GetDebugConfig(GetDebugConfigRequest) returns (GetDebugConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.get";
  }

  rpc UpdateDebugConfig(UpdateDebugConfigRequest) returns (UpdateDebugConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.update";
    option (laelia.v1.audit) = true;
  }

  // GetWorkspaceGeneralSetting reads the workspace general setting (signup
  // policy, email suffix restriction, ...). Admin (laelia.settings.get) only.
  rpc GetWorkspaceGeneralSetting(GetWorkspaceGeneralSettingRequest) returns (GetWorkspaceGeneralSettingResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.get";
  }

  // UpdateWorkspaceGeneralSetting updates the workspace general setting.
  // Admin (laelia.settings.update) only.
  rpc UpdateWorkspaceGeneralSetting(UpdateWorkspaceGeneralSettingRequest) returns (UpdateWorkspaceGeneralSettingResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.settings.update";
    option (laelia.v1.audit) = true;
  }

  // GetWorkspaceInfo returns the workspace signup policy for the
  // unauthenticated sign-in/sign-up pages. No auth required.
  rpc GetWorkspaceInfo(GetWorkspaceInfoRequest) returns (GetWorkspaceInfoResponse) {
    option (laelia.v1.allow_without_credential) = true;
  }
}

message GetWorkspaceGeneralSettingRequest {}

message GetWorkspaceGeneralSettingResponse {
  laelia.store.WorkspaceProfileSetting setting = 1;
}

message UpdateWorkspaceGeneralSettingRequest {
  laelia.store.WorkspaceProfileSetting setting = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateWorkspaceGeneralSettingResponse {
  laelia.store.WorkspaceProfileSetting setting = 1;
}

// GetWorkspaceInfoRequest is empty.
message GetWorkspaceInfoRequest {}

// GetWorkspaceInfoResponse carries the workspace signup policy that the
// unauthenticated sign-in/sign-up pages need to render: whether self-service
// signup is offered and which email suffixes are accepted.
message GetWorkspaceInfoResponse {
  // Whether self-service signup is disallowed. When true, users can only be
  // created by workspace admins.
  bool disallow_signup = 1;

  // Whether the email suffix restriction is enforced for signup.
  bool enforce_identity_domain = 2;

  // The allowed email suffixes (e.g. "example.com") when
  // enforce_identity_domain is set.
  repeated string domains = 3;
}
