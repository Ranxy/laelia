    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
}

// ListThreadParticipantsRequest lists the distinct senders (users and agents) that
// have posted in a thread (the root message and its replies). Participants are derived
// from message senders, not from a membership table, so this reflects who actually
// took part in the thread. The caller must be a member of the conversation.
message ListThreadParticipantsRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  // thread_root is the resource name of the thread's root message
  // ("conversations/{c}/messages/{m}").
  string thread_root = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListThreadParticipantsResponse {
  // members is the distinct senders in the thread. member_role is not meaningful for
  // thread participation and is left 0.
  repeated ChannelMember members = 1;
}

message SendMessageRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
  // content is the message text. It may be empty when at least one attachment
  // is provided, allowing users to send a file-only message.
  string content = 2;
  repeated Mention mentions = 3;
  repeated Attachment attachments = 4;
  // thread_root, when set, makes this message a reply in the thread rooted at
  // the given message name ("conversations/{c}/messages/{m}"). Empty posts a
  // normal channel message.
  string thread_root = 5;
  // as_task, when true, creates this message as a task: a task row is inserted
  // in the same transaction with a per-conversation task number and status
  // TODO. Only valid for top-level messages (thread_root must be empty).
  bool as_task = 6;
}

message GetCommandContextRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Command"}
  ];
}

message GetCommandContextResponse {
  Command command = 1;
  repeated CommandOutput outputs = 2;
  repeated CommandEvent events = 3;
}

message PostMessageRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
  // content is the message text. It may be empty when at least one attachment
  // is provided.
  string content = 2;
  int64 base_version = 3 [(google.api.field_behavior) = REQUIRED];
  string command_id = 4;
  repeated Attachment attachments = 5;
  // thread_root, when set, makes this agent reply a message in the thread
  // rooted at the given message name. Empty posts a normal channel message.
  string thread_root = 6;
}

message PostMessageResponse {
  bool committed = 1;
  ChatMessage message = 2;
  int64 current_version = 3;
  repeated ChatMessage new_messages = 4;
  string conflict_description = 5;
}

// === Tasks ===
// A task is a top-level channel/DM message with task metadata (a
// per-conversation number, a status, and an optional assignee). The chat
// message is the source of truth for content; the task row carries the task
// state. The thread rooted at the task message is the task's discussion /
// approval channel. These RPCs cover the four creation/mutation paths:
// convert an existing message, list a channel's tasks, claim / unclaim, and
// update status. SendMessage.as_task and agent CreateTask cover send-time and
// agent-subtask creation respectively; the conversions/claims here are the
// shared mutation surface.

message ConvertMessageToTaskRequest {
  // message is the resource name of the top-level message to convert
  // ("conversations/{c}/messages/{m}"). Must be a root message in the
  // conversation (thread_root empty) and not already a task.
  string message = 1 [(google.api.field_behavior) = REQUIRED];
}
message ConvertMessageToTaskResponse {
  // message is the converted message, with task populated. A separate system
  // notification row is also inserted into the conversation flow.
  ChatMessage message = 1;
}

message ListTasksRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  // status_filter, when non-empty, restricts the result to the given statuses.
  // Empty returns tasks in every status.
  repeated TaskStatus status_filter = 2;
  // page_size is the maximum number of tasks to return in one page. The server
  // clamps it to a sane range and applies a default when zero.
  int32 page_size = 3;
  // page_token is the opaque cursor returned in the previous response's
  // next_page_token; empty starts at the newest task.
  string page_token = 4;
}
message ListTasksResponse {
  // tasks are one page of the channel's task root messages, each with task
  // populated, ordered by task_number descending (newest first).
  repeated ChatMessage tasks = 1;
  // next_page_token is the cursor for the next (older) page; empty when this
  // page is the last.
  string next_page_token = 2;
}

// ListTaskCountsRequest asks for per-status task totals for a conversation, so
// the task board summary stays accurate regardless of how many tasks are loaded
// into the paginated list view.
message ListTaskCountsRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
}
message ListTaskCountsResponse {
  int32 todo_count = 1;
  int32 in_progress_count = 2;
  int32 in_review_count = 3;
  int32 done_count = 4;
}

message ClaimTaskRequest {
  // message is the resource name of the task's root message
  // ("conversations/{c}/messages/{m}").
  string message = 1 [(google.api.field_behavior) = REQUIRED];
}
message ClaimTaskResponse {
  // message is the task message after the claim, with task populated (status
  // now IN_PROGRESS, assignee set to the caller). When the claim failed because
  // another agent already owns the task or it is not in TODO, the RPC returns
  // FAILED_PRECONDITION instead and this response is not sent.
  ChatMessage message = 1;
}

message UnclaimTaskRequest {
  string message = 1 [(google.api.field_behavior) = REQUIRED];
}
message UnclaimTaskResponse {
  ChatMessage message = 1;
}

message UpdateTaskStatusRequest {
  string message = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  // status is the target status. Any channel member may move a task between
  // any of the four statuses (TODO / IN_PROGRESS / IN_REVIEW / DONE). Setting
  // DONE closes the task (sets completed_at); moving out of DONE clears it.
  TaskStatus status = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateTaskStatusResponse {
  ChatMessage message = 1;
}

message AssignTaskRequest {
  // message is the resource name of the task's root message
  // ("conversations/{c}/messages/{m}").
  string message = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  // member_type is the target assignee kind: 1=user, 2=agent (reuses the
  // MemberType semantics). A user assignee is a display-only "owner" and does
  // not participate in claim/process flows; an agent assignee is the working
  // owner.
  int32 member_type = 2 [(google.api.field_behavior) = REQUIRED];
  // member_id is the target member's stable id within the conversation: the
  // agent's resource id (handle) for agents, the user's handle for users.
  string member_id = 3 [(google.api.field_behavior) = REQUIRED];
}
message AssignTaskResponse {
  ChatMessage message = 1;
}

message CloseTaskRequest {
  // message is the resource name of the task's root message
  // ("conversations/{c}/messages/{m}").
  string message = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
}
message CloseTaskResponse {
  // message is the task message after the close, with task populated (status
  // now DONE, completed_at set). Closing an already-DONE task is idempotent:
  // the current state is returned as-is.
  ChatMessage message = 1;
}

message CreateTaskRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  string content = 2 [(google.api.field_behavior) = REQUIRED];
  repeated Mention mentions = 3;
  repeated Attachment attachments = 4;
}
message CreateTaskResponse {
  // message is the newly posted task message, with task populated. The task is
  // created unassigned (status TODO); the posting agent does NOT auto-claim it
  // — call ClaimTask afterwards to own it.
  ChatMessage message = 1;
}

// === Reminders ===
// A reminder is a scheduled/recurring task owned by an agent. Like a task, a
// reminder IS its root chat_message (PK = message_id); the thread rooted at that
// message is the discussion channel where the user and agent negotiate the
// schedule, and where completion/miss reports are posted as system messages.
// The agent that recognizes the scheduling intent claims the reminder at
// creation (assignee = calling agent). The manager-side scheduler fires the
// reminder at fire_at (one-shot) or per cron_expr (recurring, interpreted in
// tz), wakes the agent, and the agent runs the work and calls
// CompleteReminder/FailReminder; the backend atomically flips the status and
// posts a single system thread message (never duplicated).

// ReminderStatus is the lifecycle state of a reminder. Values prefixed to
// satisfy protobuf's C++ scoping rules (sibling enums cannot share value
// names), matching TaskStatus/SenderType.
enum ReminderStatus {
  REMINDER_STATUS_UNSPECIFIED = 0;
  REMINDER_STATUS_PENDING = 1;
  REMINDER_STATUS_DUE = 2;
  REMINDER_STATUS_COMPLETED = 3;
  REMINDER_STATUS_CANCELLED = 4;
  REMINDER_STATUS_MISSED = 5;
  REMINDER_STATUS_FAILED = 6;
}

// Reminder is the scheduled-task metadata attached to a root chat_message. The
// chat_message (root) remains the source of truth for the trigger content; this
// row carries the schedule, assignee, and lifecycle state. The resource name is
// "reminders/{message_id}" — the reminder's identity is its trigger message.
message Reminder {
  string name = 1;
  // conversation is the conversation the trigger message belongs to
  // ("conversations/{id}").
  string conversation = 2 [(google.api.resource_reference).type = "laelia/Conversation"];
  // message is the trigger message ("conversations/{c}/messages/{m}"); it is
  // also the thread root for the reminder's discussion.
  string message = 3;
  // assignee_agent is the owning agent ("agents/{id}"); the agent that claimed
  // the reminder at creation.
  string assignee_agent = 4 [(google.api.resource_reference).type = "laelia/Agent"];
  string assignee_name = 5;
  // task_content is the agent's structured summary of the work to perform on
  // each fire.
  string task_content = 6;
  // fire_at is the next fire time. For one-shot reminders (cron_expr empty) it
  // is the single trigger time; for recurring reminders it is the next cron
  // fire, recomputed after each completion/miss.
  google.protobuf.Timestamp fire_at = 7;
  // cron_expr, when non-empty, makes the reminder recurring. A standard
  // 5-field cron (min hour dom month dow) interpreted in tz. Empty = one-shot.
  string cron_expr = 8;
  // tz is the IANA timezone name used to interpret cron_expr (e.g.
  // "Asia/Shanghai"). "UTC" by default.
  string tz = 9;
  ReminderStatus status = 10;
  // retry_count is the number of delivery attempts since the last fire for an
  // offline agent (0 when the agent was reached on the first try).
  int32 retry_count = 11;
  google.protobuf.Timestamp next_retry_at = 12;
  google.protobuf.Timestamp last_attempt_at = 13;
  google.protobuf.Timestamp last_fired_at = 14;
  google.protobuf.Timestamp last_completed_at = 15;
  // result is the agent's completion/failure report from the most recent fire.
  string result = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message ConvertMessageToReminderRequest {
  // message is the resource name of the trigger message
  // ("conversations/{c}/messages/{m}"). Must be a root message in the
  // conversation (thread_root empty) and not already a reminder. The calling
  // agent claims the reminder at creation (assignee = caller).
  string message = 1 [(google.api.field_behavior) = REQUIRED];
  // task_content is the agent's structured summary of the scheduled work.
  string task_content = 2 [(google.api.field_behavior) = REQUIRED];
  // fire_at is the first fire time. Required.
  google.protobuf.Timestamp fire_at = 3 [(google.api.field_behavior) = REQUIRED];
  // cron_expr, when non-empty, makes the reminder recurring (5-field cron in
  // tz). Empty = one-shot.
  string cron_expr = 4;
  // tz is the IANA timezone for cron_expr. Defaults to "UTC" when empty.
  string tz = 5;
}
message ConvertMessageToReminderResponse {
  Reminder reminder = 1;
}

message ListRemindersRequest {
  // agent, when set, restricts the result to reminders owned by the given agent
  // ("agents/{id}"). The agent-page Reminders tab filters by the viewed agent.
  string agent = 1 [(google.api.resource_reference).type = "laelia/Agent"];
  // conversation, when set, restricts the result to reminders in that
  // conversation.
  string conversation = 2 [(google.api.resource_reference).type = "laelia/Conversation"];
  // status_filter, when non-empty, restricts the result to the given statuses.
  repeated ReminderStatus status_filter = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message ListRemindersResponse {
  repeated Reminder reminders = 1;
  string next_page_token = 2;
}

message GetReminderRequest {
  // name is the reminder resource name ("reminders/{message_id}").
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Reminder"
  ];
}
message GetReminderResponse {
  Reminder reminder = 1;
}

message UpdateReminderRequest {
  // name is the reminder resource name ("reminders/{message_id}").
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Reminder"
  ];
  // fire_at, cron_expr, tz, task_content are the editable fields. At least one
  // must be set. Editing a DUE or MISSED reminder resets it to PENDING with the
  // new schedule. COMPLETED/CANCELLED/FAILED reminders cannot be edited.
  google.protobuf.Timestamp fire_at = 2;
  string cron_expr = 3;
  string tz = 4;
  string task_content = 5;
}
message UpdateReminderResponse {
  Reminder reminder = 1;
}

message CancelReminderRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Reminder"
  ];
}
message CancelReminderResponse {
  Reminder reminder = 1;
}

message CompleteReminderRequest {
  // name is the reminder resource name ("reminders/{message_id}"). Only the
  // owning agent may call this, and only when the reminder is DUE.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Reminder"
  ];
  // result is the agent's completion report, posted as a single system message
  // in the reminder's thread. The backend posts it atomically with the status
  // update so it never appears twice.
  string result = 2 [(google.api.field_behavior) = REQUIRED];
}
message CompleteReminderResponse {
  Reminder reminder = 1;
}

message FailReminderRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Reminder"
  ];
  // error is the failure reason, posted as a system message in the thread.
  string error = 2 [(google.api.field_behavior) = REQUIRED];
}
message FailReminderResponse {
  Reminder reminder = 1;
}

message ListDueRemindersRequest {}

message ListDueRemindersResponse {
  // reminders are the DUE reminders owned by the calling agent, ordered by
  // fire_at ascending. The agent drain loop calls this each session to pick up
  // fired reminders and process them.
  repeated Reminder reminders = 1;
}

// ListChannelUpdates returns, for the authenticated agent, every conversation
// it is a member of whose current room_version is greater than the agent's
// stored per-channel cursor — i.e. the channels that have unread messages. It
// is the agent's "what is worth my context" discovery and drives the autonomous
// drain loop. The agent identity is resolved from the auth context.
message ListChannelUpdatesRequest {}

// ChannelUpdate describes one conversation that has unread messages for the
// agent. new_message_count is the number of chat_message rows with
// room_version greater than the agent's processed_version for that channel.
message ChannelUpdate {
  string conversation = 1 [(google.api.resource_reference).type = "laelia/Conversation"];
  int64 current_version = 2;
  int64 processed_version = 3;
  int32 new_message_count = 4;
}

message ListChannelUpdatesResponse {
  repeated ChannelUpdate updates = 1;
}

// ListAccessibleChannels returns, for the authenticated agent, every
// conversation it can read: its own memberships plus — when the agent's
// follow_owner_permissions is enabled — every conversation its owner can read
// (channels and DMs). This is the on-demand discovery surface ("what channels
// can I access"); it is separate from ListChannelUpdates (the drain-loop
// inbox), which stays limited to conversations the agent has joined so the
// agent is not woken for every message in its owner's channels.
message ListAccessibleChannelsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// AccessibleChannel wraps a conversation the agent can read, with is_member
// reporting whether the agent has actually joined it (only joined conversations
// accept posts and appear in the agent's ListChannelUpdates inbox).
message AccessibleChannel {
  Conversation channel = 1;
  bool is_member = 2;
}

message ListAccessibleChannelsResponse {
  repeated AccessibleChannel channels = 1;
  string next_page_token = 2;
}

// JoinChannel makes the calling agent a real member of a channel it can read
// (via its own membership or owner-follow). Joining seeds the agent's
// per-channel cursor to the current version, so the channel starts appearing in
// ListChannelUpdates from that point on and the agent may post to it. Idempotent
// for members. The gate is laelia.conversations.read (the agent may only join a
// channel it can already read); a mutation gated by a read permission is
// deliberate — "join" is exactly "subscribe to a conversation I can see".
message JoinChannelRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
}

message JoinChannelResponse {
  Conversation conversation = 1;
}

// AckProcessedVersion advances the agent's durable per-channel cursor to
// processed_version, marking the channel as processed up to that room_version so
// that subsequent ListChannelUpdates no longer report it. command_id, when
// supplied, links the current session's command to this conversation so the
// frontend can associate execution events with the channel.
message AckProcessedVersionRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
  int64 processed_version = 2 [(google.api.field_behavior) = REQUIRED];
  string command_id = 3;
}

message AckProcessedVersionResponse {
  int64 processed_version = 1;
}

// MarkConversationRead advances the requesting user's per-conversation read
// cursor to the conversation's current room_version, clearing the user-facing
// unread badge for that conversation. read_version in the response is the
// resulting cursor value, so the frontend can set its local state to the exact
// server value.
message MarkConversationReadRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
}

message MarkConversationReadResponse {
  int64 read_version = 1;
}

// SetConversationPinned sets or clears the requesting user's per-conversation
// pin. Pinning a channel or DM keeps it at the top of the user's left-rail
// list independent of last message time. Per-user state
// (conversation_member.pinned/pinned_at); only the caller's own pin is
// affected.
message SetConversationPinnedRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
  bool pinned = 2;
}

message SetConversationPinnedResponse {}

// SetConversationClosed sets or clears the requesting user's per-conversation
// close state. Closing hides a channel or DM from the user's left-rail list
// without deleting the conversation or its messages; the conversation
// reappears automatically when a new main-channel message arrives (thread
// replies excluded), at which point the flag is cleared server-side. Per-user
// state (conversation_member_meta.closed/closed_at); only the caller's own
// close state is affected.
message SetConversationClosedRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
  bool closed = 2;
}

message SetConversationClosedResponse {}

// ActivityCategory flags which kind of conversation event an Activity item
// represents. A single Activity row may carry several categories OR-ed together
// (a task-thread reply that @mentions a user is both TASK and MENTION). The
// ListActivities filter selects items that have ANY of the requested categories
// set. Values are bit flags so they compose in a single int column; the
// ACTIVITY_CATEGORY prefix satisfies protobuf C++ scoping rules (sibling enums
// cannot share value names), matching SenderType/TaskStatus.
enum ActivityCategory {
  ACTIVITY_CATEGORY_UNSPECIFIED = 0;
  ACTIVITY_CATEGORY_MENTION = 1;
  ACTIVITY_CATEGORY_TASK = 2;
  ACTIVITY_CATEGORY_REMINDER = 4;
  ACTIVITY_CATEGORY_THREAD = 8;
  // DIRECT marks a 1:1 DM message (user<->user or agent->user) addressed to the
  // user but carrying no other category (no @mention, not a task/reminder, not a
  // thread reply). It gives DMs a notifiable signal where they would otherwise
  // produce no Activity row.
  ACTIVITY_CATEGORY_DIRECT = 16;
}

// ActivityState is the user-facing lifecycle of an Activity item. UNREAD -> READ
// happens when the user's per-channel read cursor advances past the message's
// room_version (via MarkConversationRead); READ items stay visible under the All
// filter. DONE is an explicit "Mark as Done" action that hides the item from All
// and Unread. The ACTIVITY_STATE prefix satisfies protobuf C++ scoping rules.
enum ActivityState {
  ACTIVITY_STATE_UNSPECIFIED = 0;
  ACTIVITY_STATE_UNREAD = 1;
  ACTIVITY_STATE_READ = 2;
  ACTIVITY_STATE_DONE = 3;
}

// Activity is one item in a user's per-user activity feed. Each item corresponds
// to a single chat_message relevant to the user, tagged with the category(ies)
// that made it relevant. The message itself is the source of truth for
// content/sender; this row carries the per-user read/done state and category
// flags. The resource name is "users/{user}/activities/{message}".
message Activity {
  string name = 1;
  // conversation is the conversation the message belongs to.
  string conversation = 2 [(google.api.resource_reference).type = "laelia/Conversation"];
  // message is the chat message ("conversations/{c}/messages/{m}").
  string message = 3;
  // thread_root, when non-empty, is the root message of the thread the message
  // belongs to. Empty for a top-level message.
  string thread_root = 4;
  // categories is the OR-ed set of ActivityCategory flags that made this message
  // relevant to the user.
  int32 categories = 5;
  // state is the user-facing lifecycle (UNREAD/READ/DONE). Read is derived from
  // the user_channel_cursor; DONE is an explicit action.
  ActivityState state = 6;
  // room_version is the message's room_version (for ordering and read-cursor
  // comparison).
  int64 room_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp read_at = 9;
  google.protobuf.Timestamp done_at = 10;
  // summary is a short preview of the message content for the left-list.
  string summary = 11;
  // sender_name is the display name of the message sender.
  string sender_name = 12;
  // sender_type is the SenderType of the message (USER/AGENT/SYSTEM).
  SenderType sender_type = 13;
}

// ListActivities returns the authenticated user's activity feed: chat messages
// relevant to them, tagged with category flags. The caller's own id is the
// implicit filter (no cross-user listing). filter selects items by category
// (empty = all categories; set = items whose categories intersect the requested
// set, ANY flag). read_state_filter scopes by lifecycle and defaults to UNREAD
// when UNSPECIFIED.
message ListActivitiesRequest {
  repeated ActivityCategory filter = 1;
  ActivityState read_state_filter = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListActivitiesResponse {
  repeated Activity activities = 1;
  string next_page_token = 2;
}

// MarkActivityDone marks a single activity item DONE for the authenticated user,
// hiding it from All and Unread. The caller's own id must own the row; the name
// is "users/{user}/activities/{message}".
message MarkActivityDoneRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message MarkActivityDoneResponse {
  Activity activity = 1;
}

service CommandService {
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.commands.get";
  }

  rpc GetCommand(GetCommandRequest) returns (Command) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.commands.get";
  }

  rpc CancelCommand(CancelCommandRequest) returns (Command) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.commands.cancel";
    option (laelia.v1.audit) = true;
  }

  // SteerCommand injects a follow-up message into a running command's
  // in-flight turn. Only executors that support mid-turn steering (the ACP v2
  // thread protocol's turn/steer) honor it; others ignore it.
  rpc SteerCommand(SteerCommandRequest) returns (Command) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.commands.cancel";
    option (laelia.v1.audit) = true;
  }

  rpc WatchCommand(WatchCommandRequest) returns (stream CommandOutput) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.commands.watch";
  }

  rpc WatchCommandEvents(WatchCommandEventsRequest) returns (stream CommandEvent) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.commands.watch";
  }

  rpc SearchChatHistory(SearchChatHistoryRequest) returns (SearchChatHistoryResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc GetCommandContext(GetCommandContextRequest) returns (GetCommandContextResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.commands.watch";
  }

  rpc GetOrCreateConversation(GetOrCreateConversationRequest) returns (GetOrCreateConversationResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.create";
  }

  // GetOrCreateUserUserDM opens (or reuses) the type-4 user-to-user DM between
  // the calling user and a peer user. User-only. The peer is resolved by user
  // resource name ("users/<id>"); self-address is rejected; the pair is
  // canonicalized by the store. User-user twin of GetOrCreateConversation.
  rpc GetOrCreateUserUserDM(GetOrCreateUserUserDMRequest) returns (GetOrCreateUserUserDMResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.create";
  }

  // ResolveChannelByTitle looks up the unique channel (type 2) with the given
  // title, returning NOT_FOUND when absent (it never creates one). Agent-
  // callable: no auth_method annotation, identity from GetAgentFromContext.
  // Powers the "#<title>" address resolver.
  rpc ResolveChannelByTitle(ResolveChannelByTitleRequest) returns (ResolveChannelByTitleResponse) {}

  // GetOrCreateUserDM opens (or reuses) the type-1 DM between the calling agent
  // and a named end user. Agent-callable. The peer is resolved by the user's
  // readable handle ("ran-user-1"); unknown handles fail. Agent-callable twin
  // of the user-only GetOrCreateConversation. Powers the "dm:@<user>" address
  // resolver.
  rpc GetOrCreateUserDM(GetOrCreateUserDMRequest) returns (GetOrCreateUserDMResponse) {}

  // GetOrCreateAgentDM opens (or reuses) the type-3 agent-to-agent DM between
  // the calling agent and a peer agent. Agent-callable. Self-address is rejected.
  // The peer is resolved by agent resource name ("agents/<id>"); the pair is
  // canonicalized by the store. Powers the "dm:@<agent>" address resolver.
  rpc GetOrCreateAgentDM(GetOrCreateAgentDMRequest) returns (GetOrCreateAgentDMResponse) {}

  // ListPeerAgents returns every other agent (the caller excluded) with the
  // display name, persona, and connection state an agent needs to decide whom
  // to address. Agent-callable. Powers the "agent list" discovery tool.
  rpc ListPeerAgents(ListPeerAgentsRequest) returns (ListPeerAgentsResponse) {}

  rpc ListConversationMessages(ListConversationMessagesRequest) returns (ListConversationMessagesResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc ListThreadMessages(ListThreadMessagesRequest) returns (ListThreadMessagesResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc ListChannelThreads(ListChannelThreadsRequest) returns (ListChannelThreadsResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc CreateChannel(CreateChannelRequest) returns (Conversation) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.create";
    option (laelia.v1.audit) = true;
  }

  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.list";
  }

  // ListChannelsForAgent returns every conversation the given agent is a member
  // of (both direct DMs with users and multi-user channels), used by the agent
  // detail page's "Chat" tab. Admin-scoped: gated by laelia.agents.get.
  rpc ListChannelsForAgent(ListChannelsForAgentRequest) returns (ListChannelsForAgentResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.agents.get";
  }

  rpc GetChannel(GetChannelRequest) returns (Conversation) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc UpdateChannel(UpdateChannelRequest) returns (Conversation) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.manage";
    option (laelia.v1.audit) = true;
  }

  rpc DeleteChannel(DeleteChannelRequest) returns (google.protobuf.Empty) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.manage";
    option (laelia.v1.audit) = true;
  }

  rpc AddChannelMember(AddChannelMemberRequest) returns (AddChannelMemberResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.manageMembers";
    option (laelia.v1.audit) = true;
  }

  rpc RemoveChannelMember(RemoveChannelMemberRequest) returns (google.protobuf.Empty) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.manageMembers";
    option (laelia.v1.audit) = true;
  }

  // TransferChannelOwnership hands channel ownership from the calling owner to
  // another member: the target is promoted to Owner and the caller demoted to
  // Member, atomically. The interceptor gates the call with conversations.manage
  // (Admin+Owner); the handler additionally enforces that the caller is the
  // current Owner. Only channels (type 2) support ownership transfer.
  rpc TransferChannelOwnership(TransferChannelOwnershipRequest) returns (TransferChannelOwnershipResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.manage";
    option (laelia.v1.audit) = true;
  }

  // UpdateChannelMemberRole grants or revokes channel admin: the target member's
  // role is set to the requested role (Member or Admin). The interceptor gates
  // with conversations.manage (Admin+Owner); the handler enforces that the
  // caller is the Owner and the target role is Member or Admin (never Owner —
  // ownership only moves via TransferChannelOwnership).
  rpc UpdateChannelMemberRole(UpdateChannelMemberRoleRequest) returns (ChannelMember) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.manage";
    option (laelia.v1.audit) = true;
  }

  // LeaveChannel removes the calling member from a channel. The interceptor
  // gates with conversations.read (any member); the handler rejects the current
  // Owner — an owner must transfer ownership or delete the channel first to
  // avoid orphaning it. Only channels (type 2) support leaving.
  rpc LeaveChannel(LeaveChannelRequest) returns (google.protobuf.Empty) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
    option (laelia.v1.audit) = true;
  }

  rpc ListChannelMembers(ListChannelMembersRequest) returns (ListChannelMembersResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  // ListThreadParticipants lists the distinct senders (users and agents) that posted
  // in a thread. Intended for the agent daemon. The caller must be a member of the
  // conversation.
  rpc ListThreadParticipants(ListThreadParticipantsRequest) returns (ListThreadParticipantsResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc SendMessage(SendMessageRequest) returns (ChatMessage) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
    option (laelia.v1.audit) = true;
  }

  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
  }

  // AddReaction places the caller's emoji reaction on a message (idempotent:
  // re-adding your own emoji is a no-op). A reaction is lightweight feedback —
  // it never bumps the conversation's room version, wakes agents, counts as
  // unread, or generates activity. Caller must be a member of the message's
  // conversation.
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
    option (laelia.v1.audit) = true;
  }

  // RemoveReaction removes the caller's own emoji reaction from a message
  // (idempotent: removing an emoji the caller did not place is a no-op).
  // Removing an emoji that exists but was placed by someone else is
  // PERMISSION_DENIED — only the reactor removes its own reaction.
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
    option (laelia.v1.audit) = true;
  }

  // ConvertMessageToTask turns an existing top-level message into a task by
  // attaching task metadata (number, status=TODO, no assignee). Any channel
  // member (user or agent) may convert. Emits a system notification row.
  rpc ConvertMessageToTask(ConvertMessageToTaskRequest) returns (ConvertMessageToTaskResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
    option (laelia.v1.audit) = true;
  }

  // ListTasks returns one page of the task board for a conversation: the
  // channel's tasks (root messages with task metadata), newest first, optionally
  // filtered by status. Use page_size / page_token for pagination.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  // ListTaskCounts returns per-status task totals for a conversation, so the
  // task board summary stays accurate independent of list pagination.
  rpc ListTaskCounts(ListTaskCountsRequest) returns (ListTaskCountsResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  // CreateTask posts a new top-level task message in a channel (used by agents
  // to break work into subtasks for others to claim). The new task is created
  // unassigned (status TODO); the posting agent does NOT auto-claim it. Emits a
  // system notification row and wakes other agent members.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {}

  // ClaimTask atomically transitions a TODO task to IN_PROGRESS and assigns it
  // to the calling agent, subscribing the agent to the task's thread so approval
  // replies wake it. Returns FAILED_PRECONDITION if the task is already
  // claimed or not in TODO. Emits a system notification row.
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse) {}

  // UnclaimTask releases the calling agent's claim on a task it owns, setting
  // it back to TODO so another agent may claim it. Not allowed on DONE
  // (terminal). Emits a system notification row.
  rpc UnclaimTask(UnclaimTaskRequest) returns (UnclaimTaskResponse) {}

  // UpdateTaskStatus moves a task between any of the four statuses. Any channel
  // member (user or agent) may call it; DONE closes the task (sets
  // completed_at), and moving out of DONE clears it. Emits a system
  // notification row.
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
    option (laelia.v1.audit) = true;
  }

  // AssignTask assigns a task to a channel member (user or agent). A user
  // assignee is a display-only "owner" and does not participate in the
  // claim/process flow; an agent assignee is the working owner. Any channel
  // member may assign. Emits a system notification row.
  rpc AssignTask(AssignTaskRequest) returns (AssignTaskResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
    option (laelia.v1.audit) = true;
  }

  // CloseTask lets a channel member (user or agent) close a task from the UI:
  // any non-DONE task transitions to DONE (terminal), setting completed_at.
  // Unlike UpdateTaskStatus it does not require assignee ownership and accepts
  // every open status (TODO / IN_PROGRESS / IN_REVIEW), so the user can close
  // a task without going through the agent. Closing an already-DONE task is
  // idempotent. Emits a system notification row.
  rpc CloseTask(CloseTaskRequest) returns (CloseTaskResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.send";
    option (laelia.v1.audit) = true;
  }

  // ConvertMessageToReminder turns an existing top-level message into a
  // scheduled reminder owned by the calling agent (atomic create+claim). The
  // message must be a root in the conversation and not already a reminder. The
  // agent is subscribed to the reminder's thread so discussion replies wake it.
  rpc ConvertMessageToReminder(ConvertMessageToReminderRequest) returns (ConvertMessageToReminderResponse) {}

  // ListReminders returns reminders, optionally filtered by owning agent,
  // conversation, and status. Used by the agent-page Reminders tab (user) and
  // the agent CLI (self-list).
  rpc ListReminders(ListRemindersRequest) returns (ListRemindersResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.reminders.list";
  }

  // GetReminder returns a single reminder by its resource name.
  rpc GetReminder(GetReminderRequest) returns (GetReminderResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.reminders.get";
  }

  // UpdateReminder edits the schedule (fire_at/cron_expr/tz) or task_content of
  // a reminder. The caller is the owning agent or a workspace admin. Editing a
  // DUE or MISSED reminder resets it to PENDING with the new schedule.
  rpc UpdateReminder(UpdateReminderRequest) returns (UpdateReminderResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.reminders.update";
    option (laelia.v1.audit) = true;
  }

  // CancelReminder cancels a reminder. The caller is the owning agent or a
  // workspace admin. A cancelled reminder is terminal.
  rpc CancelReminder(CancelReminderRequest) returns (CancelReminderResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.reminders.cancel";
    option (laelia.v1.audit) = true;
  }

  // CompleteReminder marks a DUE reminder completed and atomically posts the
  // result as a single system message in the reminder's thread. Only the owning
  // agent may call this. Recurring reminders reschedule to the next cron fire.
  rpc CompleteReminder(CompleteReminderRequest) returns (CompleteReminderResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.reminders.update";
  }

  // FailReminder marks a DUE reminder failed with the given error and posts it
  // as a system thread message. Recurring reminders reschedule. Only the owning
  // agent may call this.
  rpc FailReminder(FailReminderRequest) returns (FailReminderResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.reminders.update";
  }

  // ListDueReminders returns the DUE reminders owned by the calling agent, for
  // the autonomous drain loop to pick up fired work. Agent identity is resolved
  // from the auth context.
  rpc ListDueReminders(ListDueRemindersRequest) returns (ListDueRemindersResponse) {}

  rpc ListChannelUpdates(ListChannelUpdatesRequest) returns (ListChannelUpdatesResponse) {}

  rpc ListAccessibleChannels(ListAccessibleChannelsRequest) returns (ListAccessibleChannelsResponse) {}

  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
    option (laelia.v1.audit) = true;
  }

  rpc ListThreadUpdates(ListThreadUpdatesRequest) returns (ListThreadUpdatesResponse) {}

  rpc AckProcessedVersion(AckProcessedVersionRequest) returns (AckProcessedVersionResponse) {}

  rpc FetchConversationActivity(FetchConversationActivityRequest) returns (FetchConversationActivityResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc MarkConversationRead(MarkConversationReadRequest) returns (MarkConversationReadResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc SetConversationPinned(SetConversationPinnedRequest) returns (SetConversationPinnedResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  rpc SetConversationClosed(SetConversationClosedRequest) returns (SetConversationClosedResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.conversations.read";
  }

  // UploadFile stores data in S3 and persists a file row. Intended for the
  // agent daemon (browser uploads go through the Echo multipart route); bytes
  // travel over Connect-JSON, and avoiding a /v1/files/{id} REST entry keeps it
  // from colliding with the browser download route.
  rpc UploadFile(UploadFileRequest) returns (File) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.files.upload";
  }

  // DownloadFile fetches a file's bytes from S3. The caller must be a member of
  // the file's conversation. Used by the agent daemon; browser downloads go
  // through the Echo route.
  rpc DownloadFile(DownloadFileRequest) returns (DownloadFileResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.files.download";
  }

  // ListFiles returns the files attached to a conversation. The caller must be
  // a member.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.files.list";
  }

  // ListActivities returns the authenticated user's activity feed: chat messages
  // relevant to them, tagged with category flags (mention/task/reminder/thread).
  // The caller's own id is the implicit filter; default read_state_filter is
  // UNREAD.
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.activities.list";
  }

  // MarkActivityDone marks a single activity item DONE for the authenticated
  // user, hiding it from All and Unread. The caller's own id must own the row.
  rpc MarkActivityDone(MarkActivityDoneRequest) returns (MarkActivityDoneResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.activities.markDone";
    option (laelia.v1.audit) = true;
  }
}

service AgentStreamService {
  rpc AgentChannel(stream AgentStreamMessage) returns (stream ManagerStreamMessage);
}

message AgentStreamMessage {
  oneof message {
    AgentReady agent_ready = 1;
    BeginSession begin_session = 2;
    CommandProgress progress = 5;
    CommandResult result = 6;
    CommandEvent event = 7;
    Ping ping = 8;
    ProvidersDiscovered providers_discovered = 9; // response to ManagerStreamMessage.discover_providers
    WorkspaceListResponse workspace_list_response = 10; // response to ManagerStreamMessage.workspace_list_request
    WorkspaceReadResponse workspace_read_response = 11; // response to ManagerStreamMessage.workspace_read_request
  }
}

message ManagerStreamMessage {
  oneof message {
    NewMessagesAvailable new_messages = 4;
    BeginSessionResponse begin_session_response = 8;
    CancelMessage cancel = 5;
    Pong pong = 6;
    // 7 was permission_decision; permissions are now auto-granted.
    DiscoverProviders discover_providers = 9; // ask the agent daemon to re-probe installed LLM agent providers
    WorkspaceListRequest workspace_list_request = 10; // ask the agent daemon to list one level of its workspace
    WorkspaceReadRequest workspace_read_request = 11; // ask the agent daemon to read a workspace file
    SteerMessage steer = 12; // inject a follow-up message into the in-flight turn
  }
}

message AgentReady {
  string session_id = 1;
  string last_command_id = 2;
  int32 last_ack_seq = 3;
  int32 last_event_seq = 4;
  // agent_name declares which agent (agents/{agent}) this AgentChannel runs. The
  // manager validates the authenticated machine owns this agent. Set by the
  // machine app's per-agent runner; required on the first message.
  string agent_name = 5;
}

// DiscoverProviders asks the agent daemon to re-probe its host for installed
// LLM agent providers and their models. The daemon replies with
// AgentStreamMessage.providers_discovered.
message DiscoverProviders {
  string request_id = 1; // correlation id for the pending unary RefreshAgentProviders call
}

// ProvidersDiscovered carries the freshly discovered provider list back to the
// manager, which persists it into agent.info.available_providers and hands it
// to the pending RefreshAgentProviders caller.
message ProvidersDiscovered {
  string request_id = 1;
  repeated AgentProviderInfo providers = 2;
}

// WorkspaceListRequest asks the agent daemon to list one directory level of an
// agent's workspace (~/.laelia/<machineID>/<agentID>/ on the machine). Paths
// are relative to the workspace root; an empty dir_path lists the root. The
// daemon replies with AgentStreamMessage.workspace_list_response.
message WorkspaceListRequest {
  string request_id = 1; // correlation id for the pending unary ListAgentWorkspace call
  string dir_path = 2; // relative to the workspace root; empty = root
  bool include_hidden = 3; // show dotfiles (still filtered by the never-visible policy)
}

// WorkspaceListResponse carries one directory level back to the manager.
// Entries are sorted directories-first, then by name. WorkspaceEntry is shared
// with the unary ListAgentWorkspace RPC (defined in v1/agent.proto).
message WorkspaceListResponse {
  string request_id = 1;
  repeated WorkspaceEntry entries = 2;
}

// WorkspaceReadRequest asks the agent daemon to read a workspace file for
// preview. Text and image content is returned inline (see
// WorkspaceReadResponse); other binaries return metadata only. Sensitive files
// (secret/credential/token patterns) are always rejected by the daemon.
message WorkspaceReadRequest {
  string request_id = 1; // correlation id for the pending unary ReadAgentWorkspaceFile call
  string path = 2; // relative to the workspace root
}

message CommandRequest {
  string command_id = 1;
  string instruction = 2;
  string profile = 3;
  map<string, string> env = 4;
  string working_dir = 5;
  int32 timeout_seconds = 6;
  bool allow_diff = 7;
  string principal_id = 8;
  string conversation_id = 9;
  string reply_to_message_id = 10;
  string agent_display_name = 11;
}

message CommandProgress {
  string command_id = 1;
  CommandOutput.StreamType type = 2;
  string content = 3;
  int32 seq_no = 4;
  // timestamp is the agent-side wall-clock time when this output chunk was
  // produced (before any manager-side buffering/arrival delay).
  google.protobuf.Timestamp timestamp = 5;
}

message CommandResult {
  string command_id = 1;
  int32 exit_code = 2;
  int64 duration_ms = 3;
  string error_message = 4;
  int32 last_seq_no = 5;
  string final_summary = 6;
  google.protobuf.Struct result = 7;
}

message CancelMessage {
  string command_id = 1;
}

// SteerMessage injects a follow-up message into the in-flight turn of a
// running command. It is best-effort: an executor that does not support
// mid-turn steering ignores it.
message SteerMessage {
  string command_id = 1;
  string text = 2;
}

message Ping {
  int64 seq = 1;
  int64 sent_at = 2;
}

message Pong {
  int64 seq = 1;
  int64 server_time = 2;
}

message ListCommandsRequest {
  string agent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Agent"
  ];
  int32 page_size = 2;
  string page_token = 3;
  CommandStatus status = 4;
}

message ListCommandsResponse {
  repeated Command commands = 1;
  string next_page_token = 2;
}

message GetCommandRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Command"
  ];
}

message CancelCommandRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Command"
  ];
  string reason = 2;
}

message SteerCommandRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Command"
  ];
  string text = 2;
}

message WatchCommandRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Command"
  ];
  int32 after_seq_no = 2;
}

message WatchCommandEventsRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Command"
  ];
  int32 after_seq_no = 2;
}

// NewMessagesAvailable is a best-effort wake signal pushed from the Manager to
// an agent over the bidi stream whenever a conversation the agent is a member
// of produces a new message (from any sender: user, agent, or system). It is
// NOT the source of truth: the agent's durable per-channel cursor is. If a wake
// is missed (agent offline), the agent rediscovers pending work on reconnect by
// calling ListChannelUpdates, which compares conversation.version to the cursor.
message NewMessagesAvailable {
  repeated string conversation_ids = 1;
  repeated int64 versions = 2;
  // thread_root_message_id, when non-empty, indicates the wake is for a new
  // reply in a thread the agent is subscribed to (the value is the thread's
  // root message resource name). It is a hint so the agent can go straight to
  // thread check/read; the agent still relies on ListThreadUpdates as the
  // source of truth. Empty means a normal channel-message wake.
  string thread_root_message_id = 3;
}

// BeginSession is sent by an agent to ask the Manager to start a new
// autonomous processing session. The Manager checks the agent's per-channel
// cursors: if no conversation has room_version greater than the agent's cursor,
// it replies BeginSessionResponse{idle=true} and the agent stays idle;
// otherwise it creates a RUNNING command and replies with its command_id, which
// the agent uses to anchor its execution events and link any posted replies.
message BeginSession {}

message BeginSessionResponse {
  string command_id = 1;
  bool idle = 2;
  // agent_display_name is the posting agent's human-readable name, sourced from
  // the manager (the source of truth for agent identity). The agent client injects
  // it into its system prompt so it knows who it is and can recognize its own
  // messages and @mentions of itself.
  string agent_display_name = 3;
  // owner_display_name is the agent's owner's display name, sourced from the
  // manager (the source of truth for ownership). The agent client injects it into
  // its system prompt (the Ownership & Safety section) so the agent knows whom to
  // DM for approval of high-risk requests from non-owners. Empty for legacy
  // agents with no recorded owner.
  string owner_display_name = 4;
}

// FetchConversationActivity returns the execution status of each agent member
// in a conversation. It is polled by the frontend to show real-time agent
// status in the channel header.
message FetchConversationActivityRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
}

message FetchConversationActivityResponse {
  repeated AgentActivity activities = 1;
}

message AgentActivity {
  string agent_id = 1;
  string display_name = 2;
  string status = 3;
  string tool_name = 4;
}
