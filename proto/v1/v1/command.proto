syntax = "proto3";

package laelia.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "v1/agent.proto";
import "v1/annotation.proto";
import "v1/user_service.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
  CANCELLED = 5;
  TIMEOUT = 6;
}

// SenderType distinguishes who authored a chat message. It replaces the
// deprecated CommandSource enum and covers programmatic (SYSTEM) senders that
// CommandSource could not express inside chat conversations. Values are
// prefixed because UserType already occupies the unprefixed USER/SYSTEM_BOT
// names (protobuf C++ scoping rules forbid sibling enums from sharing value
// names).
enum SenderType {
  SENDER_TYPE_UNSPECIFIED = 0;
  SENDER_TYPE_USER = 1;
  SENDER_TYPE_AGENT = 2;
  SENDER_TYPE_SYSTEM = 3;
}

// TaskStatus is the lifecycle state of a task message. A task is a top-level
// channel/DM message with task metadata; its thread is the discussion/approval
// channel. Values prefixed to satisfy protobuf's C++ scoping rules (sibling
// enums cannot share value names), matching SenderType/CommandStatus.
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_TODO = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_IN_REVIEW = 3;
  TASK_STATUS_DONE = 4;
}

// TaskInfo is the task metadata attached to a ChatMessage that is a task. It is
// a read-only join output populated by ListConversationMessages /
// ListThreadMessages for root messages; absent on non-task messages and on
// thread replies. The chat_message itself remains the source of truth for
// content/sender/room_version.
message TaskInfo {
  // task_number is the per-conversation sequence number shown as "[task #N]".
  int32 task_number = 1;
  TaskStatus status = 2;
  // assignee_name is the assigned member's display name, empty when unassigned.
  string assignee_name = 3;
  // assignee_resource_id is the assigned member's resource id (the agent's
  // handle for agents, the user's handle for users), empty when unassigned.
  string assignee_resource_id = 4;
  // assignee_type distinguishes the assignee kind: 1=user, 2=agent (reuses the
  // MemberType semantics). 0 when unassigned.
  int32 assignee_type = 5;
}

enum CommandEventType {
  COMMAND_EVENT_TYPE_UNSPECIFIED = 0;
  LIFECYCLE = 1;
  TEXT_DELTA = 2;
  TOOL_CALL_STARTED = 3;
  TOOL_CALL_FINISHED = 4;
  DIFF_EMITTED = 5;
  WARNING = 6;
  RAW_ACP = 7;
  FINAL_SUMMARY = 8;
  PERMISSION_REQUESTED = 9;
  PERMISSION_TIMED_OUT = 10;
  PERMISSION_DECIDED = 11;
  CONTEXT_COMPACTION_STARTED = 12;
  CONTEXT_COMPACTION_FINISHED = 13;
  CONTEXT_USAGE_UPDATE = 14;
  TOKEN_USAGE = 15;
}

message Command {
  option (google.api.resource) = {
    type: "laelia/Command"
    pattern: "agents/{agent}/commands/{command}"
    singular: "command"
    plural: "commands"
  };

  string name = 1;
  string agent = 2;
  string principal_id = 3;
  string principal_name = 4;
  string command = 5;
  CommandStatus status = 6;
  int32 exit_code = 7;
  int64 duration_ms = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  string error_message = 12;
  map<string, string> env = 13;
  string working_dir = 14;
  string instruction = 16;
  string profile = 17;
  string final_summary = 18;
  google.protobuf.Struct result = 19;
  bool allow_diff = 20;
  string conversation_id = 22;

  reserved 15, 21;
  reserved "executor_kind", "source";
}

message CommandOutput {
  enum StreamType {
    STREAM_TYPE_UNSPECIFIED = 0;
    STDOUT = 1;
    STDERR = 2;
    SYSTEM = 3;
    // Agent assistant output (thinking/reasoning and agent-generated text that
    // is not a raw stdout/stderr/system message).
    ASSISTANT = 4;
  }
  string command_id = 1;
  StreamType type = 2;
  string content = 3;
  int32 seq_no = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message CommandEvent {
  string command_id = 1;
  int32 seq_no = 2;
  CommandEventType type = 3;
  string summary = 4;
  // reserved "payload" for backwards-compat; old field 5 is gone.
  reserved 5;
  reserved "payload";
  google.protobuf.Timestamp timestamp = 6;

  oneof payload {
    LifecyclePayload lifecycle = 10;
    TextDeltaPayload text_delta = 11;
    ToolCallStartedPayload tool_call_started = 12;
    ToolCallFinishedPayload tool_call_finished = 13;
    DiffEmittedPayload diff_emitted = 14;
    WarningPayload warning = 15;
    RawAcpPayload raw_acp = 16;
    FinalSummaryPayload final_summary = 17;
    // 18-20 were permission_requested/timed_out/decided; permissions are now
    // auto-granted by the runtime, so the payloads are gone.
    ContextCompactionPayload context_compaction = 21;
    ContextUsagePayload context_usage = 22;
    TokenUsagePayload token_usage = 23;
  }
}

message LifecyclePayload {
  string executor_kind = 1;
  string profile = 2;
}

message TextDeltaPayload {
  string stream_type = 1;
  string content = 2;
}

message ToolCallStartedPayload {
  string title = 1;
  google.protobuf.Struct raw_input = 2;
}

message ToolCallFinishedPayload {
  string status = 1;
  google.protobuf.Struct raw_output = 2;
}

message DiffEmittedPayload {
  string path = 1;
  string old_text = 2;
  string new_text = 3;
}

message WarningPayload {
  string message = 1;
}

message RawAcpPayload {
  google.protobuf.Struct data = 1;
}

message FinalSummaryPayload {
  string stop_reason = 1;
  string session_id = 2;
}

// ContextCompactionPayload describes a context-window compaction observed on
// the agent runtime. inferred is true when the compaction was detected
// indirectly (e.g. a usage drop) rather than reported by the agent.
message ContextCompactionPayload {
  string reason = 1;
  bool inferred = 2;
}

// ContextUsagePayload is a point-in-time snapshot of the session context
// window. usage_ratio is used/size.
message ContextUsagePayload {
  int64 size = 1;
  int64 used = 2;
  double usage_ratio = 3;
}

// TokenUsagePayload is the token consumption of a single command execution
// (this turn only, not session-cumulative). Fields are absent/zero when the
// runtime did not report usage.
message TokenUsagePayload {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_tokens = 3;
  int64 cache_write_tokens = 4;
  int64 total_tokens = 5;
}

message SearchChatHistoryRequest {
  string agent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Agent"
  ];
  string query = 2;
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
  reserved 5; // removed: principal_id
  int32 limit = 6;
  string conversation = 7;
  string page_token = 8;
}

message SearchChatHistoryResponse {
  repeated ChatMessage entries = 1;
  string next_page_token = 2;
}

message ChatHistoryEntry {
  string message_id = 1;
  string command_id = 2;
  string role = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Mention {
  string type = 1;
  // id is the member's id: the agent resource id for agents, the user handle
  // for users. It is also the canonical @handle used to match mentions in
  // message content.
  string id = 2;
  // name is the display text shown in the badge. It is normally the member's
  // display name; when the same message mentions two different members who
  // share a display name it is the handle instead, so the UI can disambiguate.
  // The frontend matches both @id and @name forms from a single Mention.
  string name = 3;
}

// Attachment references a file stored in S3 that is attached to a chat message.
// The id is the file row uuid and doubles as the download key (/v1/files/{id}).
//
// The anchor fields below are set only when this attachment represents a
// comment anchoring a span of a file (e.g. a markdown section) rather than a
// whole-file upload. They are caller-supplied (the file row is not their
// source of truth) and left empty for ordinary whole-file attachments.
message Attachment {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
  // section_anchor is the human-readable anchor of the commented section,
  // e.g. "§ 2.1 Server (server/)".
  string section_anchor = 5;
  // section_id is the stable DOM id of the section heading within the file,
  // used to jump back to the section from a comment.
  string section_id = 6;
  // quoted_text is the exact text the commenter selected in the file.
  string quoted_text = 7;
}

// File is the persisted metadata for an S3-backed object.
message File {
  string id = 1;
  string conversation = 2 [(google.api.resource_reference).type = "laelia/Conversation"];
  string uploader_principal_id = 3;
  string original_name = 4;
  string mime_type = 5;
  int64 size_bytes = 6;
  string s3_key = 7;
  google.protobuf.Timestamp created_at = 8;
}

message UploadFileRequest {
  string conversation = 1 [(google.api.resource_reference).type = "laelia/Conversation"];
  string original_name = 2 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 3;
  bytes data = 4 [(google.api.field_behavior) = REQUIRED];
}

message DownloadFileRequest {
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/File"
  ];
}

message DownloadFileResponse {
  File file = 1;
  bytes data = 2;
}

message ListFilesRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
}

message ListFilesResponse {
  repeated File files = 1;
}

// Reaction is one emoji's aggregate on a message: the emoji, how many distinct
// reactors placed it, who they are (display names), and whether the caller
// itself placed it (caller-relative, mirroring ChatMessage.is_own). Populated
// by ListConversationMessages / ListThreadMessages and returned by
// AddReaction / RemoveReaction.
message Reaction {
  string emoji = 1;
  int32 count = 2;
  repeated string reactors = 3;
  bool reacted = 4;
}

// AddReactionRequest / RemoveReactionRequest add or remove the caller's emoji
// reaction on a message. Both are idempotent: adding an emoji the caller
// already placed, or removing one they did not place, succeeds as a no-op and
// returns the message's current aggregate. Removing an emoji that exists but
// was placed by someone else is PERMISSION_DENIED (only the reactor removes
// its own reaction). A reaction is lightweight feedback: it never bumps the
// conversation's room version, never wakes agents, never counts as unread, and
// never generates conversation activity.
message AddReactionRequest {
  // message is the resource name of the message to react to
  // ("conversations/{c}/messages/{m}"). Annotated as a Conversation resource
  // reference so the IAM interceptor resolves the parent conversation (the
  // resolver normalizes the child message path to its parent) and checks the
  // caller's conversations.send permission on it.
  string message = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  // emoji is a single emoji (no whitespace), validated server-side.
  string emoji = 2 [(google.api.field_behavior) = REQUIRED];
}
message AddReactionResponse {
  string message = 1;
  // reactions is the updated aggregate for the message after the add.
  repeated Reaction reactions = 2;
}

message RemoveReactionRequest {
  // message is the resource name of the message to unreact
  // ("conversations/{c}/messages/{m}"). Annotated as a Conversation resource
  // reference so the IAM interceptor checks conversations.send on the parent
  // conversation (see AddReactionRequest).
  string message = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  string emoji = 2 [(google.api.field_behavior) = REQUIRED];
}
message RemoveReactionResponse {
  string message = 1;
  // reactions is the updated aggregate for the message after the removal.
  repeated Reaction reactions = 2;
}

message ChatMessage {
  string name = 1;
  string conversation = 2;
  string principal_name = 3;
  int32 role = 4;
  string content = 5;
  string command_id = 6;
  google.protobuf.Timestamp created_at = 7;
  string sender_name = 8;
  SenderType sender_type = 9;
  // room_version is the conversation.version at the time this message was
  // created. Agents use it together with their per-channel cursor (managed via
  // the ListChannelUpdates / AckProcessedVersion RPCs) to track progress into
  // the conversation.
  int64 room_version = 10;
  repeated Mention mentions = 11;
  // is_own is true when this message was sent by the calling agent itself. It is
  // caller-relative (computed by the manager from the authenticated agent vs the
  // message's sender_agent_id) so an agent can recognize its own past messages as
  // context-only and avoid replying to itself.
  bool is_own = 12;
  repeated Attachment attachments = 13;
  // thread_root is the resource name of the root message of the thread this
  // message belongs to ("conversations/{c}/messages/{m}"). Empty for a normal
  // channel message (i.e. a root message itself, or a message outside any
  // thread). Replies in a thread carry the root message's name here.
  string thread_root = 14;
  // thread_reply_count is the number of replies in the thread rooted at this
  // message. Only meaningful for root messages (thread_root empty); the frontend
  // uses it to render the reply-count badge on the root message in the main
  // channel list. Always 0 for thread replies.
  int32 thread_reply_count = 15;
  // task is set when this message is a task (a row exists in the task table for
  // this message id). Populated by ListConversationMessages / ListThreadMessages
  // for root messages; absent for non-task messages and thread replies.
  TaskInfo task = 16;
  // agent_id is the agent resource ID ("agents/{id}") that owns the command
  // referenced by command_id. Populated when the sender is an agent so the
  // frontend can construct command-detail URLs.
  string agent_id = 17;
  // principal_id is the mention handle of the principal that authored this
  // message (principal.handle). For a user message it is the sending user's
  // handle (matching the {user} segment of the "users/{user}" resource name);
  // for an agent message it is the conversation owner's handle; for a system
  // message it is "system-bot". The frontend uses it to tell the current
  // user's own messages apart from other users' messages in shared channels
  // (sender_name alone is a display name and can collide across users).
  string principal_id = 18;
  // reactions is this message's current emoji reactions, aggregated per emoji
  // (emoji, count, reactors, and whether the caller reacted). Populated by
  // ListConversationMessages / ListThreadMessages; empty when the message has
  // no reactions. A reaction is lightweight feedback and never bumps the room
  // version.
  repeated Reaction reactions = 19;
}

message Conversation {
  option (google.api.resource) = {
    type: "laelia/Conversation"
    pattern: "conversations/{conversation}"
    singular: "conversation"
    plural: "conversations"
  };

  string name = 1;
  string title = 2;
  int32 type = 3;
  int32 member_count = 4;
  // owner_id is the owner's mention handle (e.g. "ran-user-1"), the same value
  // the frontend compares against the current user's handle to detect
  // ownership. owner_name is the owner's display name.
  string owner_id = 5;
  string owner_name = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // unread_count is the number of chat_message rows with room_version beyond
  // the requesting user's read cursor for this conversation. Populated by
  // ListChannels; 0 (or unset) when the user is caught up.
  int32 unread_count = 9;
  // address is the name-based display address for this conversation, the form
  // agents write and read: "#<title>" for a channel (type 2), "dm:@<peer>" for a
  // direct message (type 1 peer is the user, type 3 peer is the other agent,
  // type 4 peer is the other user).
  // Empty when the address is not applicable. Populated by the single builder
  // convertToV1Conversation so every emit site renders the same form.
  string address = 11;
  // read_version is the requesting user's per-conversation read cursor
  // (user_channel_cursor.read_version) — the room_version of the last message
  // the user has read. Populated by GetChannel for a user viewer so the
  // Activity detail embed can scroll to the first unread message (the user's
  // last-read position) instead of the latest message. 0 when the caller is not
  // a user or has no cursor row (treated as caught-up).
  int64 read_version = 12;
  // peer is the DM peer's resource name from the viewer's perspective
  // ("users/<id>" for a user peer, "agents/<id>" for an agent peer). Empty for
  // channels (type 2) and when no peer can be resolved. Lets list viewers fetch
  // the peer's avatar without an extra member lookup.
  string peer = 13;
  // pinned is the requesting user's per-conversation pin state
  // (conversation_member.pinned). Pinned channels/DMs stay at the top of the
  // left-rail list regardless of last message time. Per-user: each viewer has
  // their own pins. Populated by ListChannels and GetChannel for a user viewer.
  bool pinned = 14;
  // last_message is a single-line, truncated preview of the newest main-channel
  // message (thread replies excluded, mirroring the main message list and the
  // unread count). Populated by ListChannels; empty when the conversation has no
  // main-channel messages yet.
  string last_message = 15;
  // last_message_sender is the display name of the last_message author: the
  // principal name for USER/SYSTEM senders, the agent name for AGENT senders.
  // Empty when last_message is empty.
  string last_message_sender = 16;
  // last_message_principal_id is the mention handle of the last_message author
  // when the sender is a USER (so the frontend can render "You" without
  // mistaking an agent message, whose chat_message.principal_id is the
  // conversation owner's handle, for the viewer). Empty for AGENT/SYSTEM
  // senders and when last_message is empty.
  string last_message_principal_id = 17;
  // last_message_at is the send time of last_message. Unset when the
  // conversation has no main-channel messages yet.
  google.protobuf.Timestamp last_message_at = 18;
  // closed is the requesting user's per-conversation close state
  // (conversation_member_meta.closed). A closed conversation is hidden from the
  // user's left-rail list; the first new main-channel message (thread replies
  // excluded) clears the flag, so it reappears automatically. Per-user: each
  // viewer has their own close state. Populated by GetChannel for a user
  // viewer; ListChannels only returns closed conversations when the caller
  // asks with include_closed.
  bool closed = 19;
  // joined_at is the time the requesting user joined this conversation
  // (conversation_member_meta.joined_at). Populated by GetChannel for a user
  // viewer; unset for non-user callers. Lets the channel detail page show
  // "joined at" without an extra member lookup.
  google.protobuf.Timestamp joined_at = 20;
}

message ChannelMember {
  int32 member_type = 1;
  // member_id is the member's stable id within the conversation: the agent's
  // resource id (its handle, e.g. "rei-agent-1") for agents, and the user's
  // handle (e.g. "ran-user-1") for users. It is the value typed after "@" to
  // mention the member.
  string member_id = 2;
  string display_name = 3;
  // handle is the member's readable mention id ("ran-user-1" for users,
  // "rei-agent-1" for agents), identical to member_id. Duplicated as an
  // explicit field so consumers do not need to know member_type to render it.
  string handle = 9;
  int32 member_role = 4;
  google.protobuf.Timestamp joined_at = 5;
  // description is the member's public profile text: for users it is
  // User.description, for agents it is Agent.description (the public intro that
  // says what the agent is responsible for). The agent's private persona_prompt
  // is intentionally NOT exposed here — it defines the agent to itself and is
  // hidden from other users and agents. Surfaced inline in the roster so an
  // agent can perceive who is in a channel/thread and decide whom to address.
  string description = 6;
  // avatar is the member's avatar resource name (users/{user}/avatar or
  // agents/{agent}/avatar) when the member has uploaded one, empty otherwise
  // (in which case the frontend renders a deterministic pixel identicon). Surfaced
  // inline so the frontend can render roster avatars without a per-member lookup.
  string avatar = 7;
  // preferred_language is the member's preferred language when the member is a
  // user (from User.chat_preferences), UNSPECIFIED otherwise. Surfaced so an
  // agent can perceive whom it is talking to and converse in that language.
  PreferredLanguage preferred_language = 8;
}

message ListConversationMessagesRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  int32 page_size = 2;
  string page_token = 3;
  int64 after_version = 4;
  int64 before_version = 5;
  // wait_ms turns the read into a long poll: when no messages exist beyond
  // after_version, the server holds the request until a new message lands or
  // wait_ms elapses, then returns the delta (possibly empty) with the current
  // version so the client can advance its cursor and re-issue. Only valid
  // with after_version > 0; 0 (default) returns immediately. Capped
  // server-side at 30000.
  int32 wait_ms = 6;
}

message ListConversationMessagesResponse {
  repeated ChatMessage messages = 1;
  string next_page_token = 2;
  int64 current_version = 3;
}

// ListThreadMessagesRequest reads one thread: the root message followed by its
// replies, in room_version order. The root message is included as the first
// element so a reader has the thread context. The cursor model mirrors
// ListConversationMessages: after_version returns replies with room_version
// greater than it (chronological tail), before_version returns a page before a
// pivot, and the default returns the latest N replies.
message ListThreadMessagesRequest {
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
  // thread_root is the resource name of the root message
  // ("conversations/{c}/messages/{m}").
  string thread_root = 2 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 3;
  string page_token = 4;
  int64 after_version = 5;
  int64 before_version = 6;
  // wait_ms turns the read into a long poll, mirroring
  // ListConversationMessagesRequest.wait_ms: the server holds the request
  // until a new reply lands or wait_ms elapses. Only valid with after_version
  // > 0; 0 (default) returns immediately. Capped server-side at 30000.
  int32 wait_ms = 7;
}

message ListThreadMessagesResponse {
  // messages is [root, ...replies] in room_version order.
  repeated ChatMessage messages = 1;
  string next_page_token = 2;
  int64 current_version = 3;
}

// ListChannelThreadsRequest summarizes every active thread in a conversation:
// each thread's root message, total reply count, and the latest reply's
// room_version / created_at. The channel page polls this to keep the root
// messages' reply-count badges fresh (including replies that arrive while the
// thread panel is closed, e.g. an async agent reply) without fetching the whole
// message list — thread replies are excluded from ListConversationMessages, so
// the message watcher alone cannot observe a changed reply count.
message ListChannelThreadsRequest {
  // The conversation whose active threads to summarize: "conversations/{id}".
  string conversation = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Conversation"
  ];
}

// ChannelThread is a summary of one active thread (a root with ≥1 reply) in a
// conversation.
message ChannelThread {
  // root_message is the id (bare UUID) of the thread's root message; matches
  // ChatMessage.name so the client can map it back to a root row.
  string root_message = 1;
  // reply_count is the total number of replies in the thread (always ≥1).
  int32 reply_count = 2;
  // latest_reply_version is the maximum room_version among the thread's
  // replies.
  int64 latest_reply_version = 3;
  // latest_reply_at is the created_at of the most recent reply.
  google.protobuf.Timestamp latest_reply_at = 4;
}

message ListChannelThreadsResponse {
  repeated ChannelThread threads = 1;
}

// ListThreadUpdatesRequest returns, for the authenticated agent, every thread
// the agent is subscribed to (via @mention or having replied) that has replies
// with room_version beyond the agent's per-channel cursor for that
// conversation. It is the agent's thread inbox and is run after message check in
// the drain loop, before acking the conversation cursor.
message ListThreadUpdatesRequest {}

// ThreadUpdate describes one subscribed thread with unread replies.
message ThreadUpdate {
  string conversation = 1 [(google.api.resource_reference).type = "laelia/Conversation"];
  // thread_root is the resource name of the thread's root message.
  string thread_root = 2;
  // latest_version is the maximum room_version among the thread's replies
  // (the version the agent should read up to before acking).
  int64 latest_version = 3;
  // new_reply_count is the number of replies with room_version greater than
  // the agent's processed_version for this conversation.
  int32 new_reply_count = 4;
}

message ListThreadUpdatesResponse {
  repeated ThreadUpdate updates = 1;
}

message GetOrCreateConversationRequest {
  string agent = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetOrCreateConversationResponse {
  string name = 1;
}

// GetOrCreateUserUserDM opens (or reuses) the type-4 direct conversation
// between the calling user and a peer user. User-only (an agent token must not
// create a user-user DM). The peer is resolved by user resource name
// ("users/<id>"); self-address is rejected; the pair is canonicalized by the
// store. This is the user-user twin of the user-agent GetOrCreateConversation.
message GetOrCreateUserUserDMRequest {
  string peer_user = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/User"
  ];
}

message GetOrCreateUserUserDMResponse {
  string name = 1;
}

// ResolveChannelByTitle looks up the unique channel (type 2) with the given
// title. Agent-callable (no auth_method annotation; identity from
// GetAgentFromContext). Returns NOT_FOUND when no such channel exists; it never
// creates one. Powers the "#<title>" address resolver.
message ResolveChannelByTitleRequest {
  string title = 1 [(google.api.field_behavior) = REQUIRED];
}

message ResolveChannelByTitleResponse {
  Conversation conversation = 1;
}

// GetOrCreateUserDM opens (or reuses) the type-1 direct conversation between the
// calling agent and the named end user. Agent-callable. The peer is resolved by
// principal display name; an ambiguous (non-unique) or unknown name fails. This
// is the agent-callable twin of the user-only GetOrCreateConversation.
message GetOrCreateUserDMRequest {
  // peer_user_handle is the peer user's readable handle ("ran-user-1"), the
  // value typed after "dm:@" to address the user. Resolved by handle only;
  // display names are never used.
  string peer_user_handle = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetOrCreateUserDMResponse {
  Conversation conversation = 1;
}

// GetOrCreateAgentDM opens (or reuses) the type-3 agent-to-agent direct
// conversation between the calling agent and the named peer agent. Agent-
// callable. Self-address is rejected. The peer is resolved by agent resource
// name ("agents/<id>"); the pair is canonicalized by the store.
message GetOrCreateAgentDMRequest {
  string peer_agent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Agent"
  ];
}

message GetOrCreateAgentDMResponse {
  Conversation conversation = 1;
}

// PeerAgent is a roster entry for the calling agent: the name, display name,
// public description, and connection state of one peer agent. Returned by
// ListPeerAgents, which excludes the caller. The peer's private persona_prompt
// is never populated here.
message PeerAgent {
  string name = 1;
  // handle is the peer agent's readable id ("rei-agent-1"), the {agent} segment
  // of name ("agents/{handle}") and the value typed after "@" / "dm:@" to
  // address the peer.
  string handle = 5;
  string display_name = 2;
  // description is the peer agent's public intro (Agent.description): what it
  // is responsible for and its role, intended for other agents/humans to read.
  // It is NOT the peer's private self prompt.
  string description = 7;
  // persona_prompt is reserved for the agent's private self prompt and is
  // intentionally left empty for other agents; use description instead.
  string persona_prompt = 3;
  AgentStatus.ConnectionState connection_state = 4;
  // enabled reports whether the peer is running (false = stopped via
  // StopAgent). A stopped peer's connection_state is STOPPED regardless of
  // whether its machine is still connected.
  bool enabled = 6;
}

// ListPeerAgents returns every other agent (the caller excluded) with the
// fields an agent needs to decide whom to address: display name, public
// description, and connection state. Agent-callable. Powers the "agent list"
// discovery tool.
message ListPeerAgentsRequest {}

message ListPeerAgentsResponse {
  repeated PeerAgent agents = 1;
}

message CreateChannelRequest {
  string title = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListChannelsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // include_closed also returns the user's closed channels (conversations
  // hidden from the left rail) so the members page can surface an entry point
  // back into them. Closed state stays per-user; other viewers' channels are
  // never included.
  bool include_closed = 3;
}

message ListChannelsResponse {
  repeated Conversation channels = 1;
  string next_page_token = 2;
}

message ListChannelsForAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "laelia/Agent"
  ];
  int32 page_size = 2;
  string page_token = 3;
}

message ListChannelsForAgentResponse {
  repeated Conversation channels = 1;
  string next_page_token = 2;
}

message GetChannelRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
}

message UpdateChannelRequest {
  Conversation conversation = 1 [(google.api.resource_reference) = {type: "laelia/Conversation"}];
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteChannelRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Conversation"}
  ];
}

message AddChannelMemberInput {
  int32 member_type = 1;
  string member_id = 2 [(google.api.field_behavior) = REQUIRED];
  // expire_time, when set, makes this a temporary member: the conversation
  // policy binding carries a `request.time < timestamp("...")` condition and
  // the caller's access expires automatically at the given instant. Must be in
  // the future.
  google.protobuf.Timestamp expire_time = 3;
  // group, when set, adds every current member of the group to the channel as
  // real user members (a snapshot: later group membership changes do not
  // sync). Mutually exclusive with member_type/member_id. Group members
  // already in the channel are skipped, so re-adding a group is idempotent.
  string group = 4 [(google.api.resource_reference) = {type: "laelia/Group"}];
}

message AddChannelMemberRequest {
