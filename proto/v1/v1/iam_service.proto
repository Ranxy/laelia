syntax = "proto3";

package laelia.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/type/expr.proto";
import "store/policy.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

// IamPolicyView is an IAM policy together with its etag. The etag is returned
// by Get and must be supplied on Set for optimistic concurrency: a Set whose
// etag does not match the stored policy's etag is rejected with
// connect.CodeAborted so the caller can re-fetch and retry.
message IamPolicyView {
  laelia.store.IamPolicy policy = 1;
  string etag = 2;
}

// BindingDelta describes a single member-role-condition change between two
// IAM policies. It is computed on Set and recorded in the audit log so an
// operator can see who granted or removed what.
message BindingDelta {
  // Action is the type of change applied to a binding.
  enum Action {
    // Unspecified action.
    ACTION_UNSPECIFIED = 0;
    // The member was added to the role.
    ADD = 1;
    // The member was removed from the role.
    REMOVE = 2;
  }

  // The action that was performed on the binding.
  Action action = 1;
  // The affected member, e.g. "users/101", "groups/eng@example.com",
  // "agents/{rid}", or "allUsers".
  string member = 2;
  // The affected role, in the form "roles/{role}".
  string role = 3;
  // The condition associated with the changed binding, if any.
  google.type.Expr condition = 4;
}

// PolicyDelta describes the changes between two IAM policies.
message PolicyDelta {
  // The binding deltas between the previous and the new policy.
  repeated BindingDelta binding_deltas = 1;
}

// IamPolicyChange is the audit payload recorded for a successful SetIamPolicy
// call: the target resource and the binding deltas applied.
message IamPolicyChange {
  // The resource the policy was set on, e.g. "workspaces/-" for the workspace
  // policy or "agents/{agent}" for an agent policy.
  string resource = 1;
  // The binding changes applied by the Set.
  repeated BindingDelta binding_deltas = 2;
}

message GetWorkspaceIamPolicyRequest {}

message SetWorkspaceIamPolicyRequest {
  laelia.store.IamPolicy policy = 1 [(google.api.field_behavior) = REQUIRED];
  string etag = 2;
}

message GetAgentIamPolicyRequest {
  // The agent resource name, in the form `agents/{agent}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
}

message SetAgentIamPolicyRequest {
  // The agent resource name, in the form `agents/{agent}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Agent"}
  ];
  laelia.store.IamPolicy policy = 2 [(google.api.field_behavior) = REQUIRED];
  string etag = 3;
}

message GetMachineIamPolicyRequest {
  // The machine resource name, in the form `machines/{machine}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Machine"}
  ];
}

message SetMachineIamPolicyRequest {
  // The machine resource name, in the form `machines/{machine}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "laelia/Machine"}
  ];
  laelia.store.IamPolicy policy = 2 [(google.api.field_behavior) = REQUIRED];
  string etag = 3;
}

// IamService exposes the workspace, per-agent, and per-machine IAM policies for
// management. Get reads the full policy; Set replaces it whole, guarded by an
// etag. The workspace/agent RPCs are gated by the IAM interceptor with
// laelia.iam.getPolicy / setPolicy; the machine RPCs are handler-gated (the
// machine's creator or a workspace admin) because a machine-scoped permission
// cannot express the creator's implicit authority.
service IamService {
  // Get the workspace IAM policy.
  rpc GetWorkspaceIamPolicy(GetWorkspaceIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {get: "/v1/workspace:iamPolicy"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.iam.getPolicy";
  }

  // Set the workspace IAM policy (full replace, etag-guarded).
  rpc SetWorkspaceIamPolicy(SetWorkspaceIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {
      post: "/v1/workspace:iamPolicy"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.iam.setPolicy";
    option (laelia.v1.audit) = true;
  }

  // Get the IAM policy attached to an agent.
  rpc GetAgentIamPolicy(GetAgentIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {get: "/v1/{name=agents/*}:iamPolicy"};
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.iam.getPolicy";
  }

  // Set the IAM policy attached to an agent (full replace, etag-guarded).
  rpc SetAgentIamPolicy(SetAgentIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {
      post: "/v1/{name=agents/*}:iamPolicy"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.iam.setPolicy";
    option (laelia.v1.audit) = true;
  }

  // Get the IAM policy attached to a machine (who may create agents on it).
  rpc GetMachineIamPolicy(GetMachineIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {get: "/v1/{name=machines/*}:iamPolicy"};
    option (laelia.v1.auth_method) = IAM;
  }

  // Set the IAM policy attached to a machine (full replace, etag-guarded).
  rpc SetMachineIamPolicy(SetMachineIamPolicyRequest) returns (IamPolicyView) {
    option (google.api.http) = {
      post: "/v1/{name=machines/*}:iamPolicy"
      body: "*"
    };
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.audit) = true;
  }
}
