syntax = "proto3";

package laelia.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "v1/annotation.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

// NotificationService manages per-user browser Web Push subscriptions so the
// manager can deliver system notifications for directed messages (mentions,
// thread replies, task/reminder updates, and 1:1 DMs) even when the user's
// browser tab is closed. All RPCs are user-scoped: the caller's own principal
// id is the implicit owner, mirroring ListActivities. The VAPID keypair is
// auto-generated on first boot and stored in the setting table, so no env
// config is required; GetPushConfig reports enabled=false if the keypair is
// somehow absent. An optional outbound HTTP proxy (for networks that cannot
// reach browser push services directly) is admin-configurable via
// UpdatePushConfig.
service NotificationService {
  // GetPushConfig reports whether Web Push is enabled and, when it is, returns
  // the VAPID public key the browser needs to subscribe. The http_proxy field
  // is populated only for callers holding laelia.pushConfig.update (admins);
  // other callers receive it empty.
  rpc GetPushConfig(GetPushConfigRequest) returns (GetPushConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.pushConfig.get";
  }

  // UpdatePushConfig sets the optional outbound HTTP proxy used when the
  // manager posts notifications to browser push services. Admin-only. An empty
  // http_proxy disables the proxy (direct connection). The change takes effect
  // immediately on the running manager.
  rpc UpdatePushConfig(UpdatePushConfigRequest) returns (UpdatePushConfigResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.pushConfig.update";
  }

  // ListPushSubscriptions returns every push subscription registered for the
  // authenticated user, one per device/browser. The frontend uses it to render
  // whether the current browser is subscribed and to reconcile a browser-side
  // subscription that is missing server-side.
  rpc ListPushSubscriptions(ListPushSubscriptionsRequest) returns (ListPushSubscriptionsResponse) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.pushSubscriptions.list";
  }

  // CreatePushSubscription registers a browser push subscription for the
  // authenticated user. Idempotent on (user, endpoint): re-subscribing the
  // same browser refreshes its p256dh/auth keys. Returns FailedPrecondition
  // when Web Push is disabled.
  rpc CreatePushSubscription(CreatePushSubscriptionRequest) returns (PushSubscription) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.pushSubscriptions.create";
  }

  // DeletePushSubscription removes a push subscription for the authenticated
  // user. The name is "users/{user}/pushSubscriptions/{endpointKey}" where
  // endpointKey is the URL-safe base64 of the subscription endpoint; the name's
  // user must be the caller.
  rpc DeletePushSubscription(DeletePushSubscriptionRequest) returns (google.protobuf.Empty) {
    option (laelia.v1.auth_method) = IAM;
    option (laelia.v1.permission) = "laelia.pushSubscriptions.delete";
  }
}

message GetPushConfigRequest {}

message GetPushConfigResponse {
  // enabled is false when the manager has no VAPID keys configured; the
  // frontend must not offer to subscribe in that case.
  bool enabled = 1;
  // vapid_public_key is the base64url VAPID public key, only meaningful when
  // enabled is true.
  string vapid_public_key = 2;
  // http_proxy is the configured outbound HTTP proxy for push delivery, only
  // populated for admins (callers with laelia.pushConfig.update). Empty for
  // non-admins or when no proxy is configured.
  string http_proxy = 3;
}

message UpdatePushConfigRequest {
  // http_proxy is the outbound HTTP(S) proxy URL, or empty to disable the
  // proxy (direct connection). Only http:// and https:// schemes are accepted.
  string http_proxy = 1;
}

message UpdatePushConfigResponse {
  // http_proxy echoes the stored proxy value (empty when the proxy is off).
  string http_proxy = 1;
}

// PushSubscription is a registered browser push endpoint for a user. The
// resource name is "users/{user}/pushSubscriptions/{endpointKey}".
message PushSubscription {
  string name = 1;
  string endpoint = 2;
}

message ListPushSubscriptionsRequest {}

message ListPushSubscriptionsResponse {
  // push_subscriptions are the caller's registered browser push endpoints, one
  // per device/browser, ordered by creation time (oldest first).
  repeated PushSubscription push_subscriptions = 1;
}

message CreatePushSubscriptionRequest {
  // endpoint is the push service endpoint URL returned by PushSubscription.endpoint.
  string endpoint = 1 [(google.api.field_behavior) = REQUIRED];
  // p256dh is the base64url ECDH P-256 public key from the subscription's keys.
  string p256dh = 2 [(google.api.field_behavior) = REQUIRED];
  // auth is the base64url 16-byte auth secret from the subscription's keys.
  string auth = 3 [(google.api.field_behavior) = REQUIRED];
}

message DeletePushSubscriptionRequest {
  // name is "users/{user}/pushSubscriptions/{endpointKey}".
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
