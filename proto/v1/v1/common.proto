syntax = "proto3";

package laelia.v1;

option go_package = "github.com/Ranxy/laelia/backend/generated-go/v1";

enum State {
  STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  DELETED = 2;
}

// Position in a text expressed as zero-based line and zero-based column byte
// offset.
message Position {
  // Line position in a text (zero-based).
  int32 line = 1;
  // Column position in a text (zero-based), equivalent to byte offset.
  int32 column = 2;
}

message Range {
  int32 start = 1;
  int32 end = 2;
}

// PermissionDeniedDetail describes why an IAM-gated RPC was denied: the
// required permission and, when the request carries a recognizable resource,
// the resource that failed the check. It is attached to PermissionDenied
// errors by the IAM interceptor so clients can render what access is missing.
message PermissionDeniedDetail {
  // The RPC method that was denied, e.g. "/laelia.v1.IamService/SetWorkspaceIamPolicy".
  string method = 1;
  // The permission the caller lacked, e.g. "laelia.iam.setPolicy".
  repeated string required_permissions = 2;
  // The resources the permission was checked against (resource names such as
  // "agents/{agent}"). Empty for workspace-scoped checks.
  repeated string resources = 3;
}

// RiskLevel is the risk level.
enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  LOW = 1;
  MODERATE = 2;
  HIGH = 3;
}
