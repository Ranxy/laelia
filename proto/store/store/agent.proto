syntax = "proto3";

package laelia.store;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/store";

enum AgentTokenType {
  TOKEN_TYPE_UNSPECIFIED = 0;
  BOOTSTRAP = 1;
  ACCESS = 2;
  REFRESH = 3;
}

enum AgentTokenState {
  STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  CONSUMED = 2;
  REVOKED = 3;
}

message AgentInfo {
  string agent_type = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string ip = 5;
  string version = 6;
  map<string, string> labels = 7;
  AgentCapability capability = 8;
  repeated AgentProviderInfo available_providers = 9;
  AgentACPConfig acp_config = 10;
}

message AgentACPConfig {
  string executable = 1;
  repeated string args = 2;
  repeated string allow_env = 3;
  string provider = 4;
  string model = 5;
  map<string, string> custom_env = 6;
  string persona_prompt = 7;
  string api_provider = 8;
  string api_key = 9;
  string global_provider = 10;
  string global_provider_entry = 11;
  string protocol = 12;
}

message AgentProviderInfo {
  string provider_id = 1;
  string display_name = 2;
  string version = 3;
  string executable_path = 4;
  repeated AgentModelOption models = 5;
  bool supports_model_config_option = 6;
  google.protobuf.Timestamp detected_at = 7;
}

message AgentModelOption {
  string value = 1;
  string name = 2;
  string description = 3;
}

message AgentCapability {
  bool supports_acp = 1;
  int32 max_timeout_seconds = 3;
  bool supports_diff = 4;
  bool supports_raw_events = 5;
  bool supports_tool_traces = 6;
  int32 max_event_count = 7;
  int64 max_output_bytes = 8;
  bool supports_autonomous_decision = 9;
  bool supports_pi = 10;
}

message AgentStatus {
  enum ConnectionState {
    CONNECTION_STATE_UNSPECIFIED = 0;
    ONLINE = 1;
    OFFLINE = 2;
    ERROR = 3;
    KICKED = 4;
  }
  ConnectionState state = 1;
  int64 last_heartbeat_at = 2;
  int64 connected_at = 3;
  string error_message = 4;
  string active_session_id = 5;
}
