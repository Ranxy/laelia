syntax = "proto3";

package laelia.store;

import "google/protobuf/duration.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/store";

enum SettingName {
  SETTING_NAME_UNSPECIFIED = 0;
  AUTH_SECRET = 1;
  BRANDING_LOGO = 2;
  WORKSPACE_ID = 3;
  WORKSPACE_PROFILE = 4;
  WORKSPACE_APPROVAL = 5;
  WORKSPACE_EXTERNAL_APPROVAL = 6;
  PASSWORD_RESTRICTION = 7;
  ENVIRONMENT = 8;
  AGENT_SECURITY = 9;
  S3_CONFIG = 10;
  WEB_PUSH_CONFIG = 11;
  LLM_AGENT_CONFIG = 12;
}

message WorkspaceProfileSetting {
  // The external URL is used for sso authentication callback.
  string external_url = 1;

  // Disallow self-service signup, users can only be invited by the owner.
  bool disallow_signup = 2;

  // Require 2FA for all users.
  bool require_2fa = 3;

  // The duration for token.
  google.protobuf.Duration token_duration = 4;

  // The max duration for role expired.
  google.protobuf.Duration maximum_role_expiration = 5;

  // The workspace domain, e.g. example.com.
  repeated string domains = 6;

  // Only user and group from the domains can be created and login.
  bool enforce_identity_domain = 7;

  // Whether to disallow password signin. (Except workspace admins)
  bool disallow_password_signin = 8;

  // Whether to enable metric collection for the workspace.
  bool enable_metric_collection = 9;
}

message PasswordRestrictionSetting {
  // min_length is the minimum length for password, should no less than 8.
  int32 min_length = 1;
  // require_number requires the password must contains at least one number.
  bool require_number = 2;
  // require_letter requires the password must contains at least one letter, regardless of upper case or lower case
  bool require_letter = 3;
  // require_uppercase_letter requires the password must contains at least one upper case letter.
  bool require_uppercase_letter = 4;
  // require_uppercase_letter requires the password must contains at least one special character.
  bool require_special_character = 5;
  // require_reset_password_for_first_login requires users to reset their password after the 1st login.
  bool require_reset_password_for_first_login = 6;
  // password_rotation requires users to reset their password after the duration.
  google.protobuf.Duration password_rotation = 7;
}

message EnvironmentSetting {
  repeated Environment environments = 1;

  message Environment {
    string id = 1;
    string title = 2;
    map<string, string> tags = 3;
    string color = 4;
  }
}

// IP validation policy for agent connections.
enum IPValidationPolicy {
  IP_VALIDATION_POLICY_UNSPECIFIED = 0;
  IP_VALIDATION_OFF = 1;
  IP_VALIDATION_WARN = 2;
  IP_VALIDATION_STRICT = 3;
}

message AgentSecuritySetting {
  // Heartbeat interval in seconds.
  int32 heartbeat_interval_seconds = 1;
  // Offline threshold in seconds.
  int32 offline_threshold_seconds = 2;
  // Bootstrap token duration.
  google.protobuf.Duration bootstrap_token_duration = 3;
  // Access token duration.
  google.protobuf.Duration access_token_duration = 4;
  // Refresh token duration.
  google.protobuf.Duration refresh_token_duration = 5;
  // Max concurrent sessions per agent (default: 1).
  int32 max_concurrent_sessions = 6;
  // IP validation policy.
  IPValidationPolicy ip_validation_policy = 7;
  // Heartbeat rate limit per minute per agent.
  int32 heartbeat_rate_limit_per_minute = 8;
  // Connect rate limit per minute per IP.
  int32 connect_rate_limit_per_minute = 9;
}

// S3ConfigSetting holds the connection details for the object storage used to
// back file upload/download. When endpoint and bucket are both empty, S3 is
// considered unconfigured and upload/download endpoints reject with
// "s3 not configured".
message S3ConfigSetting {
  // S3-compatible endpoint URL, e.g. "https://s3.amazonaws.com" or a MinIO
  // endpoint. Empty for AWS defaults.
  string endpoint = 1;
  // AWS region, e.g. "us-east-1".
  string region = 2;
  // Bucket name.
  string bucket = 3;
  // Static access key id.
  string access_key = 4;
  // Static secret access key. Stored as plaintext in the setting row (same
  // mechanism as AUTH_SECRET); masked on read.
  string secret_key = 5;
  // Use path-style addressing (required for MinIO and many S3-compatible
  // stores; false for AWS virtual-host style).
  bool force_path_style = 6;
  // Whether the endpoint uses TLS. Only meaningful when endpoint is set.
  bool use_ssl = 7;
}

// WebPushSetting holds the VAPID keypair (RFC 8292) used to sign Web Push
// notifications. The keypair is auto-generated on first boot and stored here so
// a self-hosted SaaS deployment needs no env config; rotating the keys
// invalidates every existing push subscription, so the values must stay stable.
// Stored as plaintext (same mechanism as AUTH_SECRET); the private key is never
// returned by any RPC — GetPushConfig only exposes the public key.
message WebPushSetting {
  // base64url (no padding) VAPID public key, sent to browsers for subscription.
  string public_key = 1;
  // base64url (no padding) VAPID private key, used only server-side to sign.
  string private_key = 2;
  // VAPID subject: a mailto: or https: URL identifying the sender. Required by
  // some push services (notably APNs).
  string subject = 3;
  // http_proxy is an optional outbound HTTP(S) proxy used when the manager
  // posts notifications to browser push services. Empty (default) means direct
  // connection. Useful when the manager's network cannot reach the push
  // endpoints directly. Only http:// and https:// schemes are supported.
  string http_proxy = 4;
}

// LlmAgentConfigSetting is the workspace-level LLM agent configuration. The
// only knob today is whether users may self-provide an inline api_provider /
// api_key / model when creating or editing a builtin-pi agent, in addition to
// using the managed global API providers. Defaults to enabled when unset.
message LlmAgentConfigSetting {
  // allow_user_self_provided_keys gates the legacy inline api_provider/api_key
  // path on builtin-pi agents. When true, any user who may create/edit the
  // agent can fill in their own LLM API key; when false, only a caller holding
  // agents.edit (workspace admin) may, and everyone else must use a global
  // provider. Default true.
  bool allow_user_self_provided_keys = 1;
}
