syntax = "proto3";

package laelia.store;

import "google/type/expr.proto";

option go_package = "github.com/Ranxy/laelia/backend/generated-go/store";

message Policy {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    IAM = 1;
    TAG = 2;
  }

  enum Resource {
    RESOURCE_UNSPECIFIED = 0;
    WORKSPACE = 1;
    ENVIRONMENT = 2;
    PROJECT = 3;
    // CONVERSATION is a per-conversation IAM policy. Members/owners are
    // expressed as bindings (roles/conversationMember, roles/conversationOwner)
    // on conversations/{id}.
    CONVERSATION = 4;
    // AGENT is a per-agent IAM policy. The agent's creator is bound to
    // roles/agentEditor on agents/{resource_id}.
    AGENT = 5;
  }
}

message TagPolicy {
  // tags is the key - value map for resources.
  // for example, the environment resource can have the sql review config tag, like "ll.tag.review_config": "reviewConfigs/{review config resource id}"
  map<string, string> tags = 1;
}

message Binding {
  // The role that is assigned to the members.
  // Format: roles/{role}
  string role = 1;

  // Specifies the principals requesting access for a resource.
  // For users, the member should be: users/{userUID}
  // For groups, the member should be: groups/{email}
  repeated string members = 2;

  // The condition that is associated with this binding.
  // If the condition evaluates to true, then this binding applies to the current request.
  // If the condition evaluates to false, then this binding does not apply to the current request. However, a different role binding might grant the same role to one or more of the principals in this binding.
  google.type.Expr condition = 3;
}

message IamPolicy {
  // Collection of binding.
  // A binding binds one or more members or groups to a single role.
  repeated Binding bindings = 1;
}

// EnvironmentTierPolicy is the tier of an environment.
message EnvironmentTierPolicy {
  enum EnvironmentTier {
    ENVIRONMENT_TIER_UNSPECIFIED = 0;
    PROTECTED = 1;
    UNPROTECTED = 2;
  }

  EnvironmentTier environment_tier = 1;
  string color = 2;
}
