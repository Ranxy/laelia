    /v1/pushConfig:
        get:
            tags:
                - NotificationService
            description: |-
                GetPushConfig reports whether Web Push is enabled and, when it is, returns
                 the VAPID public key the browser needs to subscribe. The http_proxy field
                 is populated only for callers holding laelia.pushConfig.update (admins);
                 other callers receive it empty.
            operationId: NotificationService_GetPushConfig
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetPushConfigResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - NotificationService
            description: |-
                UpdatePushConfig sets the optional outbound HTTP proxy used when the
                 manager posts notifications to browser push services. Admin-only. An empty
                 http_proxy disables the proxy (direct connection). The change takes effect
                 immediately on the running manager.
            operationId: NotificationService_UpdatePushConfig
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePushConfigRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
