                        - TOOL_CALL_FINISHED
                        - DIFF_EMITTED
                        - WARNING
                        - RAW_ACP
                        - FINAL_SUMMARY
                        - PERMISSION_REQUESTED
                        - PERMISSION_TIMED_OUT
                        - PERMISSION_DECIDED
                    type: string
                    format: enum
                summary:
                    type: string
                timestamp:
                    type: string
                    format: date-time
                lifecycle:
                    $ref: '#/components/schemas/LifecyclePayload'
                textDelta:
                    $ref: '#/components/schemas/TextDeltaPayload'
                toolCallStarted:
                    $ref: '#/components/schemas/ToolCallStartedPayload'
                toolCallFinished:
                    $ref: '#/components/schemas/ToolCallFinishedPayload'
                diffEmitted:
                    $ref: '#/components/schemas/DiffEmittedPayload'
                warning:
                    $ref: '#/components/schemas/WarningPayload'
                rawAcp:
                    $ref: '#/components/schemas/RawAcpPayload'
                finalSummary:
                    $ref: '#/components/schemas/FinalSummaryPayload'
                permissionRequested:
