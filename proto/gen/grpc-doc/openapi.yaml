    /v1/conversations/{conversation}/tasks:
        get:
            tags:
                - CommandService
            description: |-
                ListTasks returns one page of the task board for a conversation: the
                 channel's tasks (root messages with task metadata), newest first, optionally
                 filtered by status. Use page_size / page_token for pagination.
            operationId: CommandService_ListTasks
            parameters:
                - name: conversation
                  in: path
                  description: The conversation id.
                  required: true
                  schema:
                    type: string
                - name: statusFilter
                  in: query
                  description: |-
                    status_filter, when non-empty, restricts the result to the given statuses.
                     Empty returns tasks in every status.
                  schema:
                    type: array
                    items:
                        enum:
                            - TASK_STATUS_UNSPECIFIED
                            - TASK_STATUS_TODO
                            - TASK_STATUS_IN_PROGRESS
                            - TASK_STATUS_IN_REVIEW
                            - TASK_STATUS_DONE
                        type: string
                        format: enum
                - name: pageSize
                  in: query
                  description: |-
                    page_size is the maximum number of tasks to return in one page. The server
                     clamps it to a sane range and applies a default when zero.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    page_token is the opaque cursor returned in the previous response's
                     next_page_token; empty starts at the newest task.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTasksResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/conversations/{conversation}/tasks:counts:
        get:
            tags:
