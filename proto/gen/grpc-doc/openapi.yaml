                commandId:
                    type: string
                type:
                    enum:
                        - STREAM_TYPE_UNSPECIFIED
                        - STDOUT
                        - STDERR
                        - SYSTEM
                    type: string
                    format: enum
                content:
                    type: string
                seqNo:
                    type: integer
                    format: int32
                timestamp:
                    type: string
                    format: date-time
        ConnectAgentRequest:
            type: object
