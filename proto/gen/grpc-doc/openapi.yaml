                    $ref: '#/components/schemas/S3ConfigSetting'
        UpdateTaskStatusRequest:
            required:
                - message
                - status
            type: object
            properties:
                message:
                    type: string
                status:
                    enum:
                        - TASK_STATUS_UNSPECIFIED
                        - TASK_STATUS_TODO
                        - TASK_STATUS_IN_PROGRESS
                        - TASK_STATUS_IN_REVIEW
                        - TASK_STATUS_DONE
                    type: string
                    description: |-
                        status is the target status. Allowed transitions (enforced server-side):
                         IN_PROGRESS -> IN_REVIEW (the assignee marks the task ready for human
                         review) and IN_REVIEW -> DONE (the assignee marks the task done after
                         detecting the human's approval in the task's thread). TODO -> IN_PROGRESS
                         is performed by ClaimTask, not this RPC.
                    format: enum
        UpdateTaskStatusResponse:
            type: object
            properties:
                message:
                    $ref: '#/components/schemas/ChatMessage'
        User:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The name of the user.
                         Format: users/{user}. {user} is a system-generated unique ID.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                email:
                    type: string
                title:
                    type: string
                userType:
                    enum:
                        - USER_TYPE_UNSPECIFIED
                        - USER
                        - SERVICE_ACCOUNT
                        - SYSTEM_BOT
                    type: string
                    format: enum
                password:
                    writeOnly: true
                    type: string
                serviceKey:
                    writeOnly: true
                    type: string
                recoveryCodes:
                    type: array
                    items:
                        type: string
                    description: The recovery_codes is the temporary recovery codes using in two phase verification.
                phone:
                    type: string
                    description: |-
                        Should be a valid E.164 compliant phone number.
                         Could be empty.
                profile:
                    $ref: '#/components/schemas/UserProfile'
                groups:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        The groups for the user.
                         Format: groups/{email}
                workspaceAdmin:
                    readOnly: true
                    type: boolean
                    description: |-
                        workspace_admin is true when the user holds the roles/workspaceAdmin role.
                         Only populated for the current caller (GetCurrentUser).
        UserProfile:
            type: object
            properties:
                lastLoginTime:
                    type: string
                    format: date-time
                lastChangePasswordTime:
                    type: string
                    format: date-time
                source:
                    type: string
                    description: source means where the user comes from. For now we support Entra ID SCIM sync, so the source could be Entra ID.
        WarningPayload:
            type: object
            properties:
                message:
                    type: string
tags:
    - name: AgentService
    - name: AuthService
    - name: CommandService
    - name: SettingService
      description: |-
        SettingService exposes workspace-level configuration. It is admin-only; the
         handlers enforce workspace admin membership and return
         connect.CodePermissionDenied otherwise. The S3 secret_key is masked on read;
         an update carrying a masked secret preserves the stored value.
    - name: UserService
