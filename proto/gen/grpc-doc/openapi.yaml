                  in: query
                  description: |-
                    The maximum number of users to return. The service may return fewer than
                     this value.
                     If unspecified, at most 10 users will be returned.
                     The maximum value is 1000; values above 1000 will be coerced to 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    A page token, received from a previous `ListUsers` call.
                     Provide this to retrieve the subsequent page.

                     When paginating, all other parameters provided to `ListUsers` must match
                     the call that provided the page token.
                  schema:
                    type: string
                - name: showDeleted
                  in: query
                  description: Show deleted users if specified.
                  schema:
                    type: boolean
                - name: filter
                  in: query
                  description: |-
                    Filter is used to filter users returned in the list.
                     The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

                     Supported filter:
                     - name: the user name, support "==" and ".matches()" operator.
                     - email: the user email, support "==" and ".matches()" operator.
                     - user_type: the type, check UserType enum for values, support "==", "in [xx]", "!(in [xx])" operator.
                     - state: check State enum for values, support "==" operator.
                     - project: the project full name in "projects/{id}" format, support "==" operator.

                     For example:
                     name == "ed"
                     name.matches("ed")
                     email == "ed@example.com"
                     email.matches("ed")
                     user_type == "SERVICE_ACCOUNT"
                     user_type in ["SERVICE_ACCOUNT", "USER"]
                     !(user_type in ["SERVICE_ACCOUNT", "USER"])
                     state == "DELETED"
                     project == "projects/sample-project"
                     You can combine filter conditions like:
                     name.matches("ed") && project == "projects/sample-project"
                     (name == "ed" || email == "ed@example.com") && project == "projects/sample-project"
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListUsersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - UserService
            description: Create a user.
            operationId: UserService_CreateUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/User'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/users/me:
        get:
            tags:
                - UserService
            description: |-
                Get the current authenticated user.
                 Permissions required: None
            operationId: UserService_GetCurrentUser
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/users/{user}:
        get:
            tags:
                - UserService
            description: |-
                Get the user.
                 Any authenticated user can get the user.
            operationId: UserService_GetUser
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - UserService
            description: |-
                Only the user with permission on the workspace can delete the user.
                 The last remaining workspace admin cannot be deleted.
            operationId: UserService_DeleteUser
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - UserService
            description: Only the user itself and the user with permission on the workspace can update the user.
            operationId: UserService_UpdateUser
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  description: The list of fields to update.
                  schema:
                    type: string
                    format: field-mask
                - name: allowMissing
                  in: query
                  description: |-
                    If set to true, and the user is not found, a new user will be created.
                     In this situation, `update_mask` is ignored.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/User'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/users/{user}/activities/{activity}:markDone:
        post:
            tags:
                - CommandService
            description: |-
                MarkActivityDone marks a single activity item DONE for the authenticated
                 user, hiding it from All and Unread. The caller's own id must own the row.
            operationId: CommandService_MarkActivityDone
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
                - name: activity
                  in: path
                  description: The activity id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MarkActivityDoneRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MarkActivityDoneResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/users/{user}/conversations:
        post:
            tags:
                - CommandService
            description: |-
                GetOrCreateUserUserDM opens (or reuses) the type-4 user-to-user DM between
                 the calling user and a peer user. User-only. The peer is resolved by user
                 resource name ("users/<id>"); self-address is rejected; the pair is
                 canonicalized by the store. User-user twin of GetOrCreateConversation.
            operationId: CommandService_GetOrCreateUserUserDM
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetOrCreateUserUserDMResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/users/{user}/pushSubscriptions/{pushSubscription}:
        delete:
            tags:
                - NotificationService
            description: |-
                DeletePushSubscription removes a push subscription for the authenticated
                 user. The name is "users/{user}/pushSubscriptions/{endpointKey}" where
                 endpointKey is the URL-safe base64 of the subscription endpoint; the name's
                 user must be the caller.
            operationId: NotificationService_DeletePushSubscription
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
                - name: pushSubscription
                  in: path
                  description: The pushSubscription id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/users/{user}:undelete:
        post:
            tags:
                - UserService
            description: Only the user with permission on the workspace can undelete the user.
            operationId: UserService_UndeleteUser
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UndeleteUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/users:batchGet:
        get:
            tags:
                - UserService
            description: |-
                Get the users in batch.
                 Any authenticated user can batch get users.
            operationId: UserService_BatchGetUsers
            parameters:
                - name: names
                  in: query
                  description: |-
                    The user names to retrieve.
                     Format: users/{user uid or user email}
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BatchGetUsersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspace:iamPolicy:
        get:
            tags:
                - IamService
            description: Get the workspace IAM policy.
            operationId: IamService_GetWorkspaceIamPolicy
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IamPolicyView'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - IamService
            description: Set the workspace IAM policy (full replace, etag-guarded).
            operationId: IamService_SetWorkspaceIamPolicy
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetWorkspaceIamPolicyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IamPolicyView'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        AccessibleChannel:
            type: object
            properties:
                channel:
                    $ref: '#/components/schemas/Conversation'
                isMember:
                    type: boolean
            description: |-
                AccessibleChannel wraps a conversation the agent can read, with is_member
                 reporting whether the agent has actually joined it (only joined conversations
                 accept posts and appear in the agent's ListChannelUpdates inbox).
        AckProcessedVersionRequest:
            required:
                - conversation
                - processedVersion
            type: object
            properties:
                conversation:
                    type: string
                processedVersion:
                    type: string
                commandId:
                    type: string
            description: |-
                AckProcessedVersion advances the agent's durable per-channel cursor to
                 processed_version, marking the channel as processed up to that room_version so
                 that subsequent ListChannelUpdates no longer report it. command_id, when
                 supplied, links the current session's command to this conversation so the
                 frontend can associate execution events with the channel.
        AckProcessedVersionResponse:
            type: object
            properties:
                processedVersion:
                    type: string
        Activity:
            type: object
            properties:
                name:
                    type: string
                conversation:
                    type: string
                    description: conversation is the conversation the message belongs to.
                message:
                    type: string
                    description: message is the chat message ("conversations/{c}/messages/{m}").
                threadRoot:
                    type: string
                    description: |-
                        thread_root, when non-empty, is the root message of the thread the message
                         belongs to. Empty for a top-level message.
                categories:
                    type: integer
                    description: |-
                        categories is the OR-ed set of ActivityCategory flags that made this message
                         relevant to the user.
                    format: int32
                state:
                    enum:
                        - ACTIVITY_STATE_UNSPECIFIED
                        - ACTIVITY_STATE_UNREAD
                        - ACTIVITY_STATE_READ
                        - ACTIVITY_STATE_DONE
                    type: string
                    description: |-
                        state is the user-facing lifecycle (UNREAD/READ/DONE). Read is derived from
                         the user_channel_cursor; DONE is an explicit action.
                    format: enum
                roomVersion:
                    type: string
                    description: |-
                        room_version is the message's room_version (for ordering and read-cursor
                         comparison).
                createdAt:
                    type: string
                    format: date-time
                readAt:
                    type: string
                    format: date-time
                doneAt:
                    type: string
                    format: date-time
                summary:
                    type: string
                    description: summary is a short preview of the message content for the left-list.
                senderName:
                    type: string
                    description: sender_name is the display name of the message sender.
                senderType:
                    enum:
                        - SENDER_TYPE_UNSPECIFIED
                        - SENDER_TYPE_USER
                        - SENDER_TYPE_AGENT
                        - SENDER_TYPE_SYSTEM
                    type: string
                    description: sender_type is the SenderType of the message (USER/AGENT/SYSTEM).
                    format: enum
            description: |-
                Activity is one item in a user's per-user activity feed. Each item corresponds
                 to a single chat_message relevant to the user, tagged with the category(ies)
                 that made it relevant. The message itself is the source of truth for
                 content/sender; this row carries the per-user read/done state and category
                 flags. The resource name is "users/{user}/activities/{message}".
        AddChannelMemberInput:
            required:
                - memberId
            type: object
            properties:
                memberType:
                    type: integer
                    format: int32
                memberId:
                    type: string
                expireTime:
                    type: string
                    description: |-
                        expire_time, when set, makes this a temporary member: the conversation
                         policy binding carries a `request.time < timestamp("...")` condition and
                         the caller's access expires automatically at the given instant. Must be in
                         the future.
                    format: date-time
                group:
                    type: string
                    description: |-
                        group, when set, adds every current member of the group to the channel as
                         real user members (a snapshot: later group membership changes do not
                         sync). Mutually exclusive with member_type/member_id. Group members
                         already in the channel are skipped, so re-adding a group is idempotent.
        AddChannelMemberRequest:
            required:
                - conversation
                - members
            type: object
            properties:
                conversation:
                    type: string
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/AddChannelMemberInput'
        AddChannelMemberResponse:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChannelMember'
        Agent:
            required:
                - machine
            type: object
            properties:
                name:
                    type: string
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                title:
                    type: string
                info:
                    $ref: '#/components/schemas/AgentInfo'
                status:
                    $ref: '#/components/schemas/AgentStatus'
                createdAt:
                    type: string
                    format: date-time
                labels:
                    type: object
                    additionalProperties:
                        type: string
                lastTokenRotatedAt:
                    type: string
                    format: date-time
                tokenVersion:
                    type: integer
                    format: int32
                createdBy:
                    readOnly: true
                    type: string
                    description: |-
                        Creator's user resource name (users/{id}); empty for legacy agents with no
                         recorded creator. Display-only: it never authorizes anything (the agent's
                         owner does). Immutable after creation.
                canEdit:
                    readOnly: true
                    type: boolean
                    description: |-
                        can_edit reports whether the current caller may modify this agent: true for
                         the agent's owner and for workspace admins, false otherwise. Populated per
                         caller by GetAgent/ListAgents; not set on agent-daemon paths.
                avatar:
                    readOnly: true
                    type: string
                    description: |-
                        avatar is the resource name of the agent's uploaded avatar image, or empty
                         when the agent has not uploaded one (frontend renders a deterministic pixel
                         identicon seeded by the agent id). Format: agents/{agent}/avatar.
                machine:
                    type: string
                    description: |-
                        machine is the resource name of the machine this agent is bound to
                         (machines/{machine}). Required on CreateAgent (the parent machine the agent
                         runs on) and immutable thereafter; an agent runs on exactly one machine,
                         and the machine app picks it up via the MachineChannel control stream.
                allowAddToChannel:
                    type: boolean
                    description: |-
                        allow_add_to_channel controls whether other users may add this agent to a
                         channel. Default false: only the agent's owner or a workspace admin may add
                         it. When true, the normal channel-side rule (conversations.manage = channel
                         owner/admin) applies.
                owner:
                    readOnly: true
                    type: string
                    description: |-
                        Owner's user resource name (users/{id}); empty for legacy agents with no
                         recorded owner. The owner is the human responsible for the agent: only the
                         owner or a workspace admin may modify it, the owner may transfer ownership
                         to another user (TransferAgentOwnership), and non-owners' high-risk
                         requests to the agent require the owner's approval (see the agent prompt's
                         Ownership & Safety section). Defaults to the creator on CreateAgent and is
                         backfilled from created_by for existing agents.
                ownerName:
                    readOnly: true
                    type: string
                    description: |-
                        Owner's display name — the name the agent writes `dm:@<owner_name>` to when
                         requesting approval for a high-risk operation. Empty for legacy agents.
                followOwnerPermissions:
                    type: boolean
                    description: |-
                        follow_owner_permissions grants this agent read access to every channel (and
                         DM) its owner can read, without requiring the agent to be added as a member.
                         The agent can read and proactively join such channels; posting still
                         requires explicit membership. Default true: the agent acts within its
                         owner's channel visibility.
                mcpServers:
                    type: array
                    items:
                        type: string
                    description: |-
                        mcp_servers is the set of MCP server resource names (mcpServers/{id})
                         enabled on this agent. The manager resolves them into a tool catalog when
                         the agent starts; the machine never receives transport configuration.
                canManageChannelMembers:
                    type: boolean
                    description: |-
                        can_manage_channel_members grants this agent the ability to add/remove
                         members in a channel where its owner is a channel Admin or Owner. This is
                         separate from follow_owner_permissions (which controls read visibility):
                         the agent acts on its owner's behalf for member management only — it never
                         inherits the owner's other manage powers (rename, delete, transfer, roles).
                         Default true.
        AgentACPConfig:
            type: object
            properties:
                executable:
                    type: string
                args:
                    type: array
                    items:
                        type: string
                allowEnv:
                    type: array
                    items:
                        type: string
                provider:
                    type: string
                model:
                    type: string
                customEnv:
                    type: object
                    additionalProperties:
                        type: string
                personaPrompt:
                    type: string
                apiProvider:
                    type: string
                    description: |-
                        api_provider is the LLM API provider for the built-in pi runtime ("deepseek" or "openrouter"
                         in phase 1). Only meaningful when provider == "builtin-pi"; ignored by ACP runtimes.
                apiKey:
                    type: string
                    description: |-
                        api_key is the plaintext LLM API key for the api_provider. Only meaningful when
                         provider == "builtin-pi"; ignored by ACP runtimes. Stored in the agent info JSONB with the
                         same plaintext-at-rest posture as custom_env. When global_provider is set, api_key is
                         ignored: the key is resolved server-side from the global provider's entry and never stored
                         in (nor returned with) the agent.
                globalProvider:
                    type: string
                    description: |-
                        global_provider is the resource name of the global API provider this builtin-pi agent uses
                         ("apiProviders/{id}"). Only meaningful when provider == "builtin-pi". When set, the stored
                         config carries the provider/entry references instead of an inline api_provider/api_key; the
                         server resolves the concrete api_provider/api_key/model at the daemon boundary.
                globalProviderEntry:
                    type: string
                    description: |-
                        global_provider_entry is the resource name of the (key, model) entry within the global
                         provider, in the form "apiProviders/{id}/entries/{entry}". Only meaningful when
                         provider == "builtin-pi" and global_provider is set.
            description: |-
                User-configurable ACP settings. Everything else (working dir, capabilities,
                 permissions) is derived from a built-in template, not set by the admin.
        AgentActivity:
            type: object
            properties:
                agentId:
                    type: string
                displayName:
                    type: string
                status:
                    type: string
                toolName:
                    type: string
        AgentAssignment:
            type: object
            properties:
                agentName:
                    type: string
                agentDisplayName:
                    type: string
                acpConfig:
                    $ref: '#/components/schemas/AgentACPConfig'
            description: |-
                AgentAssignment is the per-agent configuration the machine app needs to run an
                 agent's drain loop. Pushed over the MachineChannel on CreateAgent, and sent
                 in full in ConnectMachineResponse.assigned_agents on (re)connect.
        AgentCapability:
            type: object
            properties:
                supportsAcp:
                    type: boolean
                maxTimeoutSeconds:
                    type: integer
                    format: int32
                supportsDiff:
                    type: boolean
                supportsRawEvents:
                    type: boolean
                supportsToolTraces:
                    type: boolean
                maxEventCount:
                    type: integer
                    format: int32
                maxOutputBytes:
                    type: string
                supportsAutonomousDecision:
                    type: boolean
                supportsPi:
                    type: boolean
                    description: |-
                        supports_pi is true for agents backed by the built-in non-ACP pi runtime. The dispatcher's
                         BeginSession gate accepts either supports_acp or supports_pi so a pi agent can run drain
                         sessions without an ACP executor.
        AgentDisconnectRequest:
            type: object
            properties:
                sessionId:
                    type: string
                reason:
                    type: string
        AgentHeartbeatRequest:
            type: object
            properties:
                sessionId:
                    type: string
                previousNonce:
                    type: string
                metrics:
                    $ref: '#/components/schemas/AgentMetrics'
        AgentHeartbeatResponse:
            type: object
            properties:
                nextNonce:
                    type: string
                nextHeartbeatAt:
                    type: string
                    format: date-time
                accessToken:
                    type: string
                accessTokenExpiresAt:
                    type: string
                    format: date-time
                commandStreamRequired:
                    type: boolean
                    description: 'Fallback channel: when bidi command stream is unavailable'
                pendingCommandHint:
                    $ref: '#/components/schemas/PendingCommandHint'
        AgentInfo:
            type: object
            properties:
                agentType:
                    type: string
                hostname:
                    type: string
                os:
                    type: string
                arch:
                    type: string
                ip:
                    type: string
                version:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                capability:
                    $ref: '#/components/schemas/AgentCapability'
                availableProviders:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentProviderInfo'
                acpConfig:
                    $ref: '#/components/schemas/AgentACPConfig'
        AgentMetrics:
            type: object
            properties:
                cpuPercent:
                    type: number
                    format: double
                memoryUsedBytes:
                    type: string
                memoryTotalBytes:
                    type: string
                diskUsedBytes:
                    type: string
                diskTotalBytes:
                    type: string
                uptimeSeconds:
                    type: integer
                    format: uint32
                goroutineCount:
                    type: integer
                    format: uint32
        AgentModelOption:
            type: object
            properties:
                value:
                    type: string
                name:
                    type: string
                description:
                    type: string
            description: |-
                AgentModelOption is one model selectable via the ACP session config option
                 round trip. Value is the valueId the client sends to SetSessionConfigOption.
        AgentProviderInfo:
            type: object
            properties:
                providerId:
                    type: string
                displayName:
                    type: string
                version:
                    type: string
                executablePath:
                    type: string
                models:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentModelOption'
                supportsModelConfigOption:
                    type: boolean
                detectedAt:
                    type: string
                    format: date-time
            description: |-
                AgentProviderInfo describes one LLM agent provider detected on the agent
                 daemon's host. Reported via ConnectAgent and refreshed on demand. The server
                 treats this as agent-owned: it preserves it across ConnectAgent/Update flows
                 the same way it preserves acp_config.
        AgentSession:
            type: object
            properties:
                sessionId:
                    type: string
                agentName:
                    type: string
                sourceIp:
                    type: string
                agentVersion:
                    type: string
                fingerprint:
                    type: string
                connectedAt:
                    type: string
                    format: date-time
                lastHeartbeatAt:
                    type: string
                    format: date-time
                disconnectedAt:
                    type: string
                    format: date-time
                disconnectReason:
                    type: string
                state:
                    enum:
                        - CONNECTION_STATE_UNSPECIFIED
                        - ONLINE
                        - OFFLINE
                        - ERROR
                        - KICKED
                    type: string
                    format: enum
        AgentStatus:
            type: object
            properties:
                state:
                    enum:
                        - CONNECTION_STATE_UNSPECIFIED
                        - ONLINE
                        - OFFLINE
                        - ERROR
                        - KICKED
                    type: string
                    format: enum
                lastHeartbeatTime:
                    type: string
                    format: date-time
                connectedTime:
                    type: string
                    format: date-time
                errorMessage:
                    type: string
                activeSessionId:
                    type: string
        AgentSummary:
            type: object
            properties:
                name:
                    type: string
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                title:
                    type: string
                status:
                    $ref: '#/components/schemas/AgentStatus'
                provider:
                    type: string
                    description: |-
                        provider/executable mirror acp_config.provider/executable on the full
                         Agent, surfaced top-level so list consumers don't pull in AgentInfo.
                executable:
                    type: string
                machine:
                    type: string
                    description: |-
                        machine is the resource name of the machine this agent is bound to
                         (machines/{machine}).
                createdBy:
                    type: string
                    description: |-
                        created_by is the creator's user resource name (users/{id}); empty for
                         legacy agents with no recorded creator. Display-only — grouping and
                         authorization use owner. Surfaced on the summary so list consumers can
                         show the creator without an N+1 of GetAgent.
                allowAddToChannel:
                    type: boolean
                    description: |-
                        allow_add_to_channel mirrors Agent.allow_add_to_channel so list consumers
                         (e.g. the channel member picker) can hide agents the current caller may
                         not add.
                owner:
                    type: string
                    description: |-
                        owner is the owner's user resource name (users/{id}); empty for legacy
                         agents with no recorded owner. Surfaced on the summary so list consumers
                         (e.g. the Members page's per-user "Owned Agents" view and the channel
                         member picker) can group agents by owner without an N+1 of GetAgent.
                followOwnerPermissions:
                    type: boolean
                    description: |-
                        follow_owner_permissions mirrors Agent.follow_owner_permissions so list
                         consumers can show whether the agent follows its owner's channel access.
                canManageChannelMembers:
                    type: boolean
                    description: |-
                        can_manage_channel_members mirrors Agent.can_manage_channel_members so list
                         consumers can show whether the agent may manage members on its owner's
                         behalf.
            description: |-
                AgentSummary is the lightweight list-view projection of an Agent returned by
                 ListAgents. It carries only the fields list/header views need: identity,
                 lifecycle state, connection status, and the provider/executable signal that
                 agentLifecycle() reads to classify an agent as ready/pending/offline. The
                 full Agent (available_providers, the rest of acp_config, capability, host
                 info, token fields, created_by, can_edit) is returned only by GetAgent, so
                 the two RPCs don't overlap. can_edit is intentionally omitted: resolving it
                 per row would N+1 the IAM policy lookup for non-admin callers, and the list
                 view does not gate affordances on it (delete is enforced server-side).
        ApiProvider:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: The resource name of the provider, in the form `apiProviders/{id}`.
                providerType:
                    type: string
                    description: |-
                        The LLM API provider type, e.g. "deepseek" or "openrouter" (the phase-1 pi
                         runtime support set).
                title:
                    type: string
                    description: Human-readable title.
                baseUrl:
                    type: string
                    description: API base URL. Empty means the provider type's default.
                description:
                    type: string
                    description: Longer description of the provider.
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/ApiProviderEntry'
                    description: The (api_key, model) entries of this provider.
                members:
                    type: array
                    items:
                        type: string
                    description: |-
                        Users or groups allowed to use this provider, in IAM member format:
                         `users/{uid}`, `groups/{email}`, `groups/{id}`, or `allUsers`. Access is
                         checked when an agent references the provider (write-time snapshot).
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                createdBy:
                    readOnly: true
                    type: string
                    description: Creator's user resource name (users/{id}). Display-only.
            description: |-
                ApiProvider is a named global LLM API provider (e.g. "DeepSeek"). A provider
                 bundles a set of (api_key, model) entries plus the users/groups allowed to
                 use them. The API never returns the api keys: entries expose has_api_key and
                 a masked form ("****"+last4) so the key stays out of the renderer.
        ApiProviderEntry:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The entry's resource name, in the form
                         `apiProviders/{provider}/entries/{entry}`.
                label:
                    type: string
                    description: Optional display label to distinguish entries sharing a model.
                model:
                    type: string
                    description: The model name this entry exposes (passed to the pi runtime as --model).
                hasApiKey:
                    readOnly: true
                    type: boolean
                    description: Whether an api key is stored. Output only.
                maskedApiKey:
                    readOnly: true
                    type: string
                    description: Masked form of the stored key ("****"+last4), for display only. Output only.
                apiKey:
                    writeOnly: true
                    type: string
                    description: |-
                        Input only. On write: empty or a "****"-prefixed value means "keep the
                         existing key"; any other value replaces it. Never echoed on read.
            description: |-
                ApiProviderEntry is one (api_key, model) entry of an ApiProvider. The api key
                 is stored server-side and never returned; has_api_key/masked_api_key are the
                 only read surface.
        Attachment:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                mimeType:
                    type: string
                sizeBytes:
                    type: string
                sectionAnchor:
                    type: string
                    description: |-
                        section_anchor is the human-readable anchor of the commented section,
                         e.g. "§ 2.1 Server (server/)".
                sectionId:
                    type: string
                    description: |-
                        section_id is the stable DOM id of the section heading within the file,
                         used to jump back to the section from a comment.
                quotedText:
                    type: string
                    description: quoted_text is the exact text the commenter selected in the file.
            description: |-
                Attachment references a file stored in S3 that is attached to a chat message.
                 The id is the file row uuid and doubles as the download key (/v1/files/{id}).

                 The anchor fields below are set only when this attachment represents a
                 comment anchoring a span of a file (e.g. a markdown section) rather than a
                 whole-file upload. They are caller-supplied (the file row is not their
                 source of truth) and left empty for ordinary whole-file attachments.
        AuditLog:
            type: object
            properties:
                name:
                    type: string
                    description: The audit log resource name, in the form "auditLogs/{id}".
                method:
                    type: string
                    description: The RPC method, e.g. "/laelia.v1.IamService/SetWorkspaceIamPolicy".
                actorType:
                    type: string
                    description: 'The caller type: "user", "agent", or "unknown".'
                actorId:
                    type: string
                    description: 'The caller identifier: user email or agent resource id.'
                sourceIp:
                    type: string
                    description: The caller's source IP.
                status:
                    type: string
                    description: 'The outcome status: "ok" or a connect code string.'
                error:
                    type: string
                    description: The error message when the call failed.
                resource:
                    type: string
                    description: The target resource of the call, e.g. "agents/{rid}" or "workspaces/-".
                payload:
                    type: string
                    description: |-
                        The structured change payload as JSON (e.g. IAM binding deltas), empty
                         when the method records none.
                createTime:
                    type: string
                    description: When the call happened.
                    format: date-time
            description: |-
                AuditLog is one audited API call: who did what, on which resource, with the
                 structured change payload (e.g. IAM binding deltas) when the method records
                 one. Audit logs are written by the audit interceptor for methods annotated
                 with audit=true.
        BatchGetGroupsResponse:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/Group'
        BatchGetUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: The users from the specified request.
        Binding:
            type: object
            properties:
                role:
                    type: string
                    description: |-
                        The role that is assigned to the members.
                         Format: roles/{role}
                members:
                    type: array
                    items:
                        type: string
                    description: |-
                        Specifies the principals requesting access for a resource.
                         For users, the member should be: users/{userUID}
                         For groups, the member should be: groups/{email}
                condition:
                    allOf:
                        - $ref: '#/components/schemas/Expr'
                    description: |-
                        The condition that is associated with this binding.
                         If the condition evaluates to true, then this binding applies to the current request.
                         If the condition evaluates to false, then this binding does not apply to the current request. However, a different role binding might grant the same role to one or more of the principals in this binding.
        CancelCommandRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        CancelReminderRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
        CancelReminderResponse:
            type: object
            properties:
                reminder:
                    $ref: '#/components/schemas/Reminder'
        ChannelMember:
            type: object
            properties:
                memberType:
                    type: integer
                    format: int32
                memberId:
                    type: string
                displayName:
                    type: string
                memberRole:
                    type: integer
                    format: int32
                joinedAt:
                    type: string
                    format: date-time
                description:
                    type: string
                    description: |-
                        description is the member's self-description: for users it is User.description,
                         for agents it is the agent's full persona_prompt (from AgentACPConfig). Surfaced
                         inline in the roster so an agent can perceive who is in a channel/thread — and
                         each co-agent's persona — in a single lookup, and decide whom to address.
                avatar:
                    type: string
                    description: |-
                        avatar is the member's avatar resource name (users/{user}/avatar or
                         agents/{agent}/avatar) when the member has uploaded one, empty otherwise
                         (in which case the frontend renders a deterministic pixel identicon). Surfaced
                         inline so the frontend can render roster avatars without a per-member lookup.
                preferredLanguage:
                    enum:
                        - PREFERRED_LANGUAGE_UNSPECIFIED
                        - PREFERRED_LANGUAGE_ZH_CN
                        - PREFERRED_LANGUAGE_EN_US
                        - PREFERRED_LANGUAGE_JA_JP
                    type: string
                    description: |-
                        preferred_language is the member's preferred language when the member is a
                         user (from User.chat_preferences), UNSPECIFIED otherwise. Surfaced so an
                         agent can perceive whom it is talking to and converse in that language.
                    format: enum
        ChannelThread:
            type: object
            properties:
                rootMessage:
                    type: string
                    description: |-
                        root_message is the id (bare UUID) of the thread's root message; matches
                         ChatMessage.name so the client can map it back to a root row.
                replyCount:
                    type: integer
                    description: reply_count is the total number of replies in the thread (always ≥1).
                    format: int32
                latestReplyVersion:
                    type: string
                    description: |-
                        latest_reply_version is the maximum room_version among the thread's
                         replies.
                latestReplyAt:
                    type: string
                    description: latest_reply_at is the created_at of the most recent reply.
                    format: date-time
            description: |-
                ChannelThread is a summary of one active thread (a root with ≥1 reply) in a
                 conversation.
        ChannelUpdate:
            type: object
            properties:
                conversation:
                    type: string
                currentVersion:
                    type: string
                processedVersion:
                    type: string
                newMessageCount:
                    type: integer
                    format: int32
            description: |-
                ChannelUpdate describes one conversation that has unread messages for the
                 agent. new_message_count is the number of chat_message rows with
                 room_version greater than the agent's processed_version for that channel.
        ChatMessage:
            type: object
            properties:
                name:
                    type: string
                conversation:
                    type: string
                principalName:
                    type: string
                role:
                    type: integer
                    format: int32
                content:
                    type: string
                commandId:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                senderName:
                    type: string
                senderType:
                    enum:
                        - SENDER_TYPE_UNSPECIFIED
                        - SENDER_TYPE_USER
                        - SENDER_TYPE_AGENT
                        - SENDER_TYPE_SYSTEM
                    type: string
                    format: enum
                roomVersion:
                    type: string
                    description: |-
                        room_version is the conversation.version at the time this message was
                         created. Agents use it together with their per-channel cursor (managed via
                         the ListChannelUpdates / AckProcessedVersion RPCs) to track progress into
                         the conversation.
                mentions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mention'
                isOwn:
                    type: boolean
                    description: |-
                        is_own is true when this message was sent by the calling agent itself. It is
                         caller-relative (computed by the manager from the authenticated agent vs the
                         message's sender_agent_id) so an agent can recognize its own past messages as
                         context-only and avoid replying to itself.
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                threadRoot:
                    type: string
                    description: |-
                        thread_root is the resource name of the root message of the thread this
                         message belongs to ("conversations/{c}/messages/{m}"). Empty for a normal
                         channel message (i.e. a root message itself, or a message outside any
                         thread). Replies in a thread carry the root message's name here.
                threadReplyCount:
                    type: integer
                    description: |-
                        thread_reply_count is the number of replies in the thread rooted at this
                         message. Only meaningful for root messages (thread_root empty); the frontend
                         uses it to render the reply-count badge on the root message in the main
                         channel list. Always 0 for thread replies.
                    format: int32
                task:
                    allOf:
                        - $ref: '#/components/schemas/TaskInfo'
                    description: |-
                        task is set when this message is a task (a row exists in the task table for
                         this message id). Populated by ListConversationMessages / ListThreadMessages
                         for root messages; absent for non-task messages and thread replies.
                agentId:
                    type: string
                    description: |-
                        agent_id is the agent resource ID ("agents/{id}") that owns the command
                         referenced by command_id. Populated when the sender is an agent so the
                         frontend can construct command-detail URLs.
                principalId:
                    type: string
                    description: |-
                        principal_id is the decimal id of the principal that authored this message
                         (the chat_message.principal_id row). For a user message it is the sending
                         user's principal id (matching the {user} segment of the "users/{user}"
                         resource name); for an agent message it is the conversation owner's
                         principal id; for a system message it is the system bot's id. The frontend
                         uses it to tell the current user's own messages apart from other users'
                         messages in shared channels (sender_name alone is a display name and can
                         collide across users).
        ChatPreferences:
            type: object
            properties:
                enterToSend:
                    type: boolean
                    description: |-
                        enter_to_send is true when pressing Enter sends the message and Shift+Enter
                         inserts a newline (the historic default). When false the keybinding is
                         inverted: Enter inserts a newline and Shift+Enter sends.
                preferredLanguage:
                    enum:
                        - PREFERRED_LANGUAGE_UNSPECIFIED
                        - PREFERRED_LANGUAGE_ZH_CN
                        - PREFERRED_LANGUAGE_EN_US
                        - PREFERRED_LANGUAGE_JA_JP
                    type: string
                    description: |-
                        preferred_language is the user's preferred language for agent-initiated
                         conversation. Agents read it and reply in that language when chatting with
                         the user (e.g. in a DM or channel). UNSPECIFIED means the user has not set
                         one; the agent then chooses the most appropriate language.
                    format: enum
            description: |-
                ChatPreferences holds per-user chat preferences. Only the user themselves
                 sees the effect; stored per principal so it follows the account across
                 devices/browsers. Surfaced to agents (via ChannelMember.preferred_language)
                 so an agent can converse with the user in their preferred language.
        ClaimTaskRequest:
            required:
                - message
            type: object
            properties:
                message:
                    type: string
                    description: |-
                        message is the resource name of the task's root message
                         ("conversations/{c}/messages/{m}").
        ClaimTaskResponse:
            type: object
            properties:
                message:
                    allOf:
                        - $ref: '#/components/schemas/ChatMessage'
                    description: |-
                        message is the task message after the claim, with task populated (status
                         now IN_PROGRESS, assignee set to the caller). When the claim failed because
                         another agent already owns the task or it is not in TODO, the RPC returns
                         FAILED_PRECONDITION instead and this response is not sent.
        Command:
            type: object
            properties:
                name:
                    type: string
                agent:
                    type: string
                principalId:
                    type: string
                principalName:
                    type: string
                command:
                    type: string
                status:
                    enum:
                        - COMMAND_STATUS_UNSPECIFIED
                        - PENDING
                        - RUNNING
                        - COMPLETED
                        - FAILED
                        - CANCELLED
                        - TIMEOUT
                    type: string
                    format: enum
                exitCode:
                    type: integer
                    format: int32
                durationMs:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                startedAt:
                    type: string
                    format: date-time
                completedAt:
                    type: string
                    format: date-time
                errorMessage:
                    type: string
                env:
                    type: object
                    additionalProperties:
                        type: string
                workingDir:
                    type: string
                instruction:
                    type: string
                profile:
                    type: string
                finalSummary:
                    type: string
                result:
                    type: object
                allowDiff:
                    type: boolean
                conversationId:
                    type: string
        CommandEvent:
            type: object
            properties:
                commandId:
                    type: string
                seqNo:
                    type: integer
                    format: int32
                type:
                    enum:
                        - COMMAND_EVENT_TYPE_UNSPECIFIED
                        - LIFECYCLE
                        - TEXT_DELTA
                        - TOOL_CALL_STARTED
                        - TOOL_CALL_FINISHED
                        - DIFF_EMITTED
                        - WARNING
                        - RAW_ACP
                        - FINAL_SUMMARY
                        - PERMISSION_REQUESTED
                        - PERMISSION_TIMED_OUT
                        - PERMISSION_DECIDED
                        - CONTEXT_COMPACTION_STARTED
                        - CONTEXT_COMPACTION_FINISHED
                        - CONTEXT_USAGE_UPDATE
                    type: string
                    format: enum
                summary:
                    type: string
                timestamp:
                    type: string
                    format: date-time
                lifecycle:
                    $ref: '#/components/schemas/LifecyclePayload'
                textDelta:
                    $ref: '#/components/schemas/TextDeltaPayload'
                toolCallStarted:
                    $ref: '#/components/schemas/ToolCallStartedPayload'
                toolCallFinished:
                    $ref: '#/components/schemas/ToolCallFinishedPayload'
                diffEmitted:
                    $ref: '#/components/schemas/DiffEmittedPayload'
                warning:
                    $ref: '#/components/schemas/WarningPayload'
                rawAcp:
                    $ref: '#/components/schemas/RawAcpPayload'
                finalSummary:
                    $ref: '#/components/schemas/FinalSummaryPayload'
                permissionRequested:
                    $ref: '#/components/schemas/PermissionRequestedPayload'
                permissionTimedOut:
                    $ref: '#/components/schemas/PermissionTimedOutPayload'
                permissionDecided:
                    $ref: '#/components/schemas/PermissionDecidedPayload'
                contextCompaction:
                    $ref: '#/components/schemas/ContextCompactionPayload'
                contextUsage:
                    $ref: '#/components/schemas/ContextUsagePayload'
        CommandOutput:
            type: object
            properties:
                commandId:
                    type: string
                type:
                    enum:
                        - STREAM_TYPE_UNSPECIFIED
                        - STDOUT
                        - STDERR
                        - SYSTEM
                    type: string
                    format: enum
                content:
                    type: string
                seqNo:
                    type: integer
                    format: int32
                timestamp:
                    type: string
                    format: date-time
        CompleteReminderRequest:
            required:
                - name
                - result
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        name is the reminder resource name ("reminders/{message_id}"). Only the
                         owning agent may call this, and only when the reminder is DUE.
                result:
                    type: string
                    description: |-
                        result is the agent's completion report, posted as a single system message
                         in the reminder's thread. The backend posts it atomically with the status
                         update so it never appears twice.
        CompleteReminderResponse:
            type: object
            properties:
                reminder:
                    $ref: '#/components/schemas/Reminder'
        ConnectAgentRequest:
            type: object
            properties:
                bootstrapToken:
                    type: string
                info:
                    $ref: '#/components/schemas/AgentInfo'
                fingerprint:
                    type: string
        ConnectAgentResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string
                sessionId:
                    type: string
                nextNonce:
                    type: string
                accessTokenExpiresAt:
                    type: string
                    format: date-time
                initialStatus:
                    $ref: '#/components/schemas/AgentStatus'
                acpConfig:
                    $ref: '#/components/schemas/AgentACPConfig'
        ConnectMachineRequest:
            type: object
            properties:
                registrationToken:
                    type: string
                info:
                    $ref: '#/components/schemas/MachineInfo'
                fingerprint:
                    type: string
        ConnectMachineResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string
                sessionId:
                    type: string
                accessTokenExpiresAt:
                    type: string
                    format: date-time
                initialStatus:
                    $ref: '#/components/schemas/MachineStatus'
                assignedAgents:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentAssignment'
                    description: |-
                        The full set of agents this machine must host. The machine app opens one
                         AgentChannel per entry immediately after connect (and on every reconnect).
        ContextCompactionPayload:
            type: object
            properties:
                reason:
                    type: string
                inferred:
                    type: boolean
            description: |-
                ContextCompactionPayload describes a context-window compaction observed on
                 the agent runtime. inferred is true when the compaction was detected
                 indirectly (e.g. a usage drop) rather than reported by the agent.
        ContextUsagePayload:
            type: object
            properties:
                size:
                    type: string
                used:
                    type: string
                usageRatio:
                    type: number
                    format: double
            description: |-
                ContextUsagePayload is a point-in-time snapshot of the session context
                 window. usage_ratio is used/size.
        Conversation:
            type: object
            properties:
                name:
                    type: string
                title:
                    type: string
                type:
                    type: integer
                    format: int32
                memberCount:
                    type: integer
                    format: int32
                ownerId:
                    type: string
                ownerName:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                unreadCount:
                    type: integer
                    description: |-
                        unread_count is the number of chat_message rows with room_version beyond
                         the requesting user's read cursor for this conversation. Populated by
                         ListChannels; 0 (or unset) when the user is caught up.
                    format: int32
                address:
                    type: string
                    description: |-
                        address is the name-based display address for this conversation, the form
                         agents write and read: "#<title>" for a channel (type 2), "dm:@<peer>" for a
                         direct message (type 1 peer is the user, type 3 peer is the other agent,
                         type 4 peer is the other user).
                         Empty when the address is not applicable. Populated by the single builder
                         convertToV1Conversation so every emit site renders the same form.
                readVersion:
                    type: string
                    description: |-
                        read_version is the requesting user's per-conversation read cursor
                         (user_channel_cursor.read_version) — the room_version of the last message
                         the user has read. Populated by GetChannel for a user viewer so the
                         Activity detail embed can scroll to the first unread message (the user's
                         last-read position) instead of the latest message. 0 when the caller is not
                         a user or has no cursor row (treated as caught-up).
                peer:
                    type: string
                    description: |-
                        peer is the DM peer's resource name from the viewer's perspective
                         ("users/<id>" for a user peer, "agents/<id>" for an agent peer). Empty for
                         channels (type 2) and when no peer can be resolved. Lets list viewers fetch
                         the peer's avatar without an extra member lookup.
                pinned:
                    type: boolean
                    description: |-
                        pinned is the requesting user's per-conversation pin state
                         (conversation_member.pinned). Pinned channels/DMs stay at the top of the
                         left-rail list regardless of last message time. Per-user: each viewer has
                         their own pins. Populated by ListChannels and GetChannel for a user viewer.
        ConvertMessageToReminderRequest:
            required:
                - message
                - taskContent
                - fireAt
            type: object
            properties:
                message:
                    type: string
                    description: |-
                        message is the resource name of the trigger message
                         ("conversations/{c}/messages/{m}"). Must be a root message in the
                         conversation (thread_root empty) and not already a reminder. The calling
                         agent claims the reminder at creation (assignee = caller).
                taskContent:
                    type: string
                    description: task_content is the agent's structured summary of the scheduled work.
                fireAt:
                    type: string
                    description: fire_at is the first fire time. Required.
                    format: date-time
                cronExpr:
                    type: string
                    description: |-
                        cron_expr, when non-empty, makes the reminder recurring (5-field cron in
                         tz). Empty = one-shot.
                tz:
                    type: string
                    description: tz is the IANA timezone for cron_expr. Defaults to "UTC" when empty.
        ConvertMessageToReminderResponse:
            type: object
            properties:
                reminder:
                    $ref: '#/components/schemas/Reminder'
        ConvertMessageToTaskRequest:
            required:
                - message
            type: object
            properties:
                message:
                    type: string
                    description: |-
                        message is the resource name of the top-level message to convert
                         ("conversations/{c}/messages/{m}"). Must be a root message in the
                         conversation (thread_root empty) and not already a task.
        ConvertMessageToTaskResponse:
            type: object
            properties:
                message:
                    allOf:
                        - $ref: '#/components/schemas/ChatMessage'
                    description: |-
                        message is the converted message, with task populated. A separate system
                         notification row is also inserted into the conversation flow.
        CreateAgentResponse:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/Agent'
                bootstrapToken:
                    type: string
        CreateChannelRequest:
            required:
                - title
            type: object
            properties:
                title:
                    type: string
        CreateGroupRequest:
            required:
                - group
            type: object
            properties:
                groupEmail:
                    type: string
                    description: |-
                        The group email, e.g. "eng@example.com". Optional; groups without an email
                         are referenced by their generated id.
                groupId:
                    type: string
                    description: |-
                        Optional stable id (lowercase alnum + dash). When empty, a UUID is
                         generated. The id is immutable after creation.
                group:
                    allOf:
                        - $ref: '#/components/schemas/Group'
                    description: |-
                        The group to create. The name field is ignored (the id/email are taken
                         from group_id/group_email); title and members are required.
        CreateMachineResponse:
            type: object
            properties:
                machine:
                    $ref: '#/components/schemas/Machine'
                registrationToken:
                    type: string
        CreatePushSubscriptionRequest:
            required:
                - endpoint
                - p256dh
                - auth
            type: object
            properties:
                endpoint:
                    type: string
                    description: endpoint is the push service endpoint URL returned by PushSubscription.endpoint.
                p256dh:
                    type: string
                    description: p256dh is the base64url ECDH P-256 public key from the subscription's keys.
                auth:
                    type: string
                    description: auth is the base64url 16-byte auth secret from the subscription's keys.
        CreateTaskRequest:
            required:
                - conversation
                - content
            type: object
            properties:
                conversation:
                    type: string
                content:
                    type: string
                mentions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mention'
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
        CreateTaskResponse:
            type: object
            properties:
                message:
                    allOf:
                        - $ref: '#/components/schemas/ChatMessage'
                    description: |-
                        message is the newly posted task message, with task populated. The task is
                         created unassigned (status TODO); the posting agent does NOT auto-claim it
                         — call ClaimTask afterwards to own it.
        DiffEmittedPayload:
            type: object
            properties:
                path:
                    type: string
                oldText:
                    type: string
                newText:
                    type: string
        ExportAuditLogsResponse:
            type: object
            properties:
                content:
                    type: string
                    description: |-
                        The audit logs as CSV: name, method, actor_type, actor_id, source_ip,
                         status, error, resource, payload, create_time.
        Expr:
            type: object
            properties:
                expression:
                    type: string
                    description: |-
                        Textual representation of an expression in Common Expression Language
                         syntax.
                title:
                    type: string
                    description: |-
                        Optional. Title for the expression, i.e. a short string describing
                         its purpose. This can be used e.g. in UIs which allow to enter the
                         expression.
                description:
                    type: string
                    description: |-
                        Optional. Description of the expression. This is a longer text which
                         describes the expression, e.g. when hovered over it in a UI.
                location:
                    type: string
                    description: |-
                        Optional. String indicating the location of the expression for error
                         reporting, e.g. a file name and a position in the file.
            description: |-
                Represents a textual expression in the Common Expression Language (CEL)
                 syntax. CEL is a C-like expression language. The syntax and semantics of CEL
                 are documented at https://github.com/google/cel-spec.

                 Example (Comparison):

                     title: "Summary size limit"
                     description: "Determines if a summary is less than 100 chars"
                     expression: "document.summary.size() < 100"

                 Example (Equality):

                     title: "Requestor is owner"
                     description: "Determines if requestor is the document owner"
                     expression: "document.owner == request.auth.claims.email"

                 Example (Logic):

                     title: "Public documents"
                     description: "Determine whether the document should be publicly visible"
                     expression: "document.type != 'private' && document.type != 'internal'"

                 Example (Data Manipulation):

                     title: "Notification string"
                     description: "Create a notification string with a timestamp."
                     expression: "'New message received at ' + string(document.create_time)"

                 The exact variables and functions that may be referenced within an expression
                 are determined by the service that evaluates it. See the service
                 documentation for additional information.
        FailReminderRequest:
            required:
                - name
                - error
            type: object
            properties:
                name:
                    type: string
                error:
                    type: string
                    description: error is the failure reason, posted as a system message in the thread.
        FailReminderResponse:
            type: object
            properties:
                reminder:
                    $ref: '#/components/schemas/Reminder'
        FetchConversationActivityResponse:
            type: object
            properties:
                activities:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentActivity'
        FinalSummaryPayload:
            type: object
            properties:
                stopReason:
                    type: string
                sessionId:
                    type: string
        ForceDisconnectAgentRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        ForceDisconnectMachineRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        GetCommandContextResponse:
            type: object
            properties:
                command:
                    $ref: '#/components/schemas/Command'
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/CommandOutput'
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/CommandEvent'
        GetDebugConfigResponse:
            type: object
            properties:
                enabled:
                    type: boolean
        GetLlmAgentConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/LlmAgentConfigSetting'
        GetOrCreateAgentDMRequest:
            required:
                - peerAgent
            type: object
            properties:
                peerAgent:
                    type: string
            description: |-
                GetOrCreateAgentDM opens (or reuses) the type-3 agent-to-agent direct
                 conversation between the calling agent and the named peer agent. Agent-
                 callable. Self-address is rejected. The peer is resolved by agent resource
                 name ("agents/<id>"); the pair is canonicalized by the store.
        GetOrCreateAgentDMResponse:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/Conversation'
        GetOrCreateConversationResponse:
            type: object
            properties:
                name:
                    type: string
        GetOrCreateUserDMRequest:
            required:
                - peerUserName
            type: object
            properties:
                peerUserName:
                    type: string
            description: |-
                GetOrCreateUserDM opens (or reuses) the type-1 direct conversation between the
                 calling agent and the named end user. Agent-callable. The peer is resolved by
                 principal display name; an ambiguous (non-unique) or unknown name fails. This
                 is the agent-callable twin of the user-only GetOrCreateConversation.
        GetOrCreateUserDMResponse:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/Conversation'
        GetOrCreateUserUserDMResponse:
            type: object
            properties:
                name:
                    type: string
        GetPushConfigResponse:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: |-
                        enabled is false when the manager has no VAPID keys configured; the
                         frontend must not offer to subscribe in that case.
                vapidPublicKey:
                    type: string
                    description: |-
                        vapid_public_key is the base64url VAPID public key, only meaningful when
                         enabled is true.
                httpProxy:
                    type: string
                    description: |-
                        http_proxy is the configured outbound HTTP proxy for push delivery, only
                         populated for admins (callers with laelia.pushConfig.update). Empty for
                         non-admins or when no proxy is configured.
        GetReminderResponse:
            type: object
            properties:
                reminder:
                    $ref: '#/components/schemas/Reminder'
        GetS3ConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/S3ConfigSetting'
        GetSetupStatusResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/SetupItem'
        GetUserMcpConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/UserMcpConfigSetting'
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        Group:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the group, in the form `groups/{id}`. The id is the
                         stable primary key; groups with an email also accept `groups/{email}` in
                         IAM bindings and Get requests (resolved by the store).
                email:
                    type: string
                    description: |-
                        The group email, e.g. "eng@example.com". Optional: groups without an email
                         are referenced by their id only.
                title:
                    type: string
                    description: Human-readable title.
                description:
                    type: string
                    description: Longer description of the group.
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/GroupMember'
                    description: |-
                        The group's members. Each member is a user resource name ("users/{uid}")
                         with a role: OWNER (may manage the group) or MEMBER.
                source:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. When non-empty, the group is synced from an external source
                         (e.g. SCIM) and is read-only over this API.
                canManage:
                    readOnly: true
                    type: boolean
                    description: |-
                        Output only. True when the caller may manage this group: the caller is a
                         group OWNER or holds laelia.groups.update. Populated for the caller only.
            description: |-
                Group is a named collection of users that can be bound in IAM policies
                 (workspace, agent, and conversation bindings accept groups/{email} members).
                 The IAM engine expands a group's members at authorization time.
        GroupMember:
            required:
                - member
            type: object
            properties:
                member:
                    type: string
                    description: The member's user resource name, in the form `users/{uid}`.
                role:
                    enum:
                        - GROUP_MEMBER_ROLE_UNSPECIFIED
                        - OWNER
                        - MEMBER
                    type: string
                    description: The member's role in the group.
                    format: enum
        GroupReference:
            type: object
            properties:
                resource:
                    type: string
                    description: |-
                        The resource name of the policy, e.g. "workspaces/-", "agents/{id}", or
                         "conversations/{id}".
                resourceType:
                    type: string
                    description: 'The policy resource type: WORKSPACE, AGENT, or CONVERSATION.'
            description: |-
                GroupReference is one policy (workspace, agent, or conversation) that binds
                 the group as a member.
        GroupReferences:
            type: object
            properties:
                references:
                    type: array
                    items:
                        $ref: '#/components/schemas/GroupReference'
        HelloRequest:
            type: object
            properties: {}
        HelloResponse:
            type: object
            properties:
                currentTime:
                    type: string
                serverVersion:
                    type: string
        IamPolicy:
            type: object
            properties:
                bindings:
                    type: array
                    items:
                        $ref: '#/components/schemas/Binding'
                    description: |-
                        Collection of binding.
                         A binding binds one or more members or groups to a single role.
        IamPolicyView:
            type: object
            properties:
                policy:
                    $ref: '#/components/schemas/IamPolicy'
                etag:
                    type: string
            description: |-
                IamPolicyView is an IAM policy together with its etag. The etag is returned
                 by Get and must be supplied on Set for optimistic concurrency: a Set whose
                 etag does not match the stored policy's etag is rejected with
                 connect.CodeAborted so the caller can re-fetch and retry.
        IdentityProviderContext:
            type: object
            properties:
                oauth2Context:
                    $ref: '#/components/schemas/OAuth2IdentityProviderContext'
        JoinChannelRequest:
            required:
                - conversation
            type: object
            properties:
                conversation:
                    type: string
            description: |-
                JoinChannel makes the calling agent a real member of a channel it can read
                 (via its own membership or owner-follow). Joining seeds the agent's
                 per-channel cursor to the current version, so the channel starts appearing in
                 ListChannelUpdates from that point on and the agent may post to it. Idempotent
                 for members. The gate is laelia.conversations.read (the agent may only join a
                 channel it can already read); a mutation gated by a read permission is
                 deliberate — "join" is exactly "subscribe to a conversation I can see".
        JoinChannelResponse:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/Conversation'
        LeaveChannelRequest:
            required:
                - conversation
            type: object
            properties:
                conversation:
                    type: string
            description: |-
                LeaveChannelRequest names the channel the caller is leaving. The caller is
                 resolved from the auth context; no member_id is carried.
        LifecyclePayload:
            type: object
            properties:
                executorKind:
                    type: string
                profile:
                    type: string
        ListAccessibleChannelsResponse:
            type: object
            properties:
                channels:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccessibleChannel'
                nextPageToken:
                    type: string
        ListActivitiesResponse:
            type: object
            properties:
                activities:
                    type: array
                    items:
                        $ref: '#/components/schemas/Activity'
                nextPageToken:
                    type: string
        ListAgentSessionsResponse:
            type: object
            properties:
                sessions:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentSession'
                nextPageToken:
                    type: string
        ListAgentsResponse:
            type: object
            properties:
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentSummary'
                nextPageToken:
                    type: string
        ListApiProviderModelsRequest:
            required:
                - providerType
            type: object
            properties:
                providerType:
                    type: string
                apiKey:
                    type: string
                baseUrl:
                    type: string
                    description: Optional base URL override; when empty the provider type's default is used.
            description: |-
                ListApiProviderModelsRequest fetches the model list a provider type exposes.
                 The api_key is a bearer credential: it is never logged and never echoed in
                 errors.
        ListApiProviderModelsResponse:
            type: object
            properties:
                models:
                    type: array
                    items:
                        $ref: '#/components/schemas/PiModel'
        ListApiProvidersResponse:
            type: object
            properties:
