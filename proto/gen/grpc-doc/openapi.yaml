    /v1/conversations/{conversation}/messages/{message}:claimTask:
        post:
            tags:
                - CommandService
            description: |-
                ClaimTask atomically transitions a TODO task to IN_PROGRESS and assigns it
                 to the calling agent, subscribing the agent to the task's thread so approval
                 replies wake it. Returns FAILED_PRECONDITION if the task is already
                 claimed or not in TODO. Emits a system notification row.
            operationId: CommandService_ClaimTask
            parameters:
                - name: conversation
                  in: path
                  description: The conversation id.
                  required: true
                  schema:
                    type: string
                - name: message
                  in: path
                  description: The message id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ClaimTaskRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ClaimTaskResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/conversations/{conversation}/messages/{message}:convertToReminder:
        post:
            tags:
                - CommandService
            description: |-
                ConvertMessageToReminder turns an existing top-level message into a
                 scheduled reminder owned by the calling agent (atomic create+claim). The
                 message must be a root in the conversation and not already a reminder. The
                 agent is subscribed to the reminder's thread so discussion replies wake it.
            operationId: CommandService_ConvertMessageToReminder
            parameters:
                - name: conversation
                  in: path
                  description: The conversation id.
                  required: true
                  schema:
                    type: string
                - name: message
                  in: path
                  description: The message id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConvertMessageToReminderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConvertMessageToReminderResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/conversations/{conversation}/messages/{message}:convertToTask:
        post:
            tags:
                - CommandService
            description: |-
                ConvertMessageToTask turns an existing top-level message into a task by
                 attaching task metadata (number, status=TODO, no assignee). Any channel
                 member (user or agent) may convert. Emits a system notification row.
            operationId: CommandService_ConvertMessageToTask
            parameters:
                - name: conversation
                  in: path
                  description: The conversation id.
                  required: true
                  schema:
                    type: string
                - name: message
                  in: path
                  description: The message id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConvertMessageToTaskRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConvertMessageToTaskResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/conversations/{conversation}/messages/{message}:unclaimTask:
        post:
            tags:
                - CommandService
            description: |-
                UnclaimTask releases the calling agent's claim on a task it owns, setting
                 it back to TODO so another agent may claim it. Not allowed on DONE
                 (terminal). Emits a system notification row.
            operationId: CommandService_UnclaimTask
            parameters:
                - name: conversation
                  in: path
                  description: The conversation id.
                  required: true
                  schema:
                    type: string
                - name: message
                  in: path
                  description: The message id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UnclaimTaskRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnclaimTaskResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/conversations/{conversation}/messages/{message}:updateTaskStatus:
        post:
            tags:
                - CommandService
            description: |-
                UpdateTaskStatus advances a task's status. IN_PROGRESS -> IN_REVIEW marks
                 the assignee's work ready for human review; IN_REVIEW -> DONE marks it
                 complete (the assignee should call this only after detecting the human's
                 approval in the task's thread). Only the assignee may call this. Emits a
                 system notification row.
            operationId: CommandService_UpdateTaskStatus
            parameters:
                - name: conversation
                  in: path
                  description: The conversation id.
                  required: true
                  schema:
