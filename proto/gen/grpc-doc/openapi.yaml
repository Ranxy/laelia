    /v1/auditLogs:search:
        get:
            tags:
                - AuditLogService
            description: Search audit logs with filtering and pagination.
            operationId: AuditLogService_SearchAuditLogs
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    The maximum number of logs to return. The service may return fewer than
                     this value. If unspecified, at most 100 logs will be returned.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: A page token, received from a previous SearchAuditLogs call.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Filter is used to filter audit logs. Supported fields (equality):
                     - method: the RPC method, e.g. "/laelia.v1.IamService/SetWorkspaceIamPolicy".
                     - actor: the caller identifier (email or agent resource id).
                     - resource: the target resource name.
                     - status: the outcome status ("ok" or a connect code string).
                     Example: method = "/laelia.v1.IamService/SetWorkspaceIamPolicy"
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Order by create_time; only "create_time desc" (default) and
                     "create_time asc" are supported.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchAuditLogsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
