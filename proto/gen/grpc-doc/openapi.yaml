components:
    schemas:
        AckProcessedVersionRequest:
            required:
                - conversation
                - processedVersion
            type: object
            properties:
                conversation:
                    type: string
                processedVersion:
                    type: string
                commandId:
                    type: string
            description: |-
                AckProcessedVersion advances the agent's durable per-channel cursor to
                 processed_version, marking the channel as processed up to that room_version so
                 that subsequent ListChannelUpdates no longer report it. command_id, when
                 supplied, links the current session's command to this conversation so the
                 frontend can associate execution events with the channel.
        AckProcessedVersionResponse:
            type: object
            properties:
                processedVersion:
                    type: string
        AddChannelMemberRequest:
            required:
                - conversation
                - memberId
            type: object
            properties:
                conversation:
                    type: string
                memberType:
                    type: integer
                    format: int32
                memberId:
                    type: string
        Agent:
            type: object
            properties:
                name:
                    type: string
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                title:
                    type: string
                info:
                    $ref: '#/components/schemas/AgentInfo'
                status:
                    $ref: '#/components/schemas/AgentStatus'
                createdAt:
                    type: string
                    format: date-time
                labels:
                    type: object
                    additionalProperties:
                        type: string
                lastTokenRotatedAt:
                    type: string
                    format: date-time
                tokenVersion:
                    type: integer
                    format: int32
        AgentACPConfig:
            type: object
            properties:
                executable:
                    type: string
                args:
                    type: array
                    items:
                        type: string
                allowEnv:
                    type: array
                    items:
                        type: string
            description: |-
                User-configurable ACP settings. Everything else (working dir, capabilities,
                 permissions) is derived from a built-in template, not set by the admin.
        AgentActivity:
            type: object
            properties:
                agentId:
                    type: string
                displayName:
                    type: string
                status:
                    type: string
                toolName:
                    type: string
        AgentCapability:
            type: object
            properties:
                supportsAcp:
                    type: boolean
                maxTimeoutSeconds:
                    type: integer
                    format: int32
                supportsDiff:
                    type: boolean
                supportsRawEvents:
                    type: boolean
                supportsToolTraces:
                    type: boolean
                maxEventCount:
                    type: integer
                    format: int32
                maxOutputBytes:
                    type: string
                supportsAutonomousDecision:
                    type: boolean
        AgentDisconnectRequest:
            type: object
            properties:
                sessionId:
                    type: string
                reason:
                    type: string
        AgentHeartbeatRequest:
            type: object
            properties:
                sessionId:
                    type: string
                previousNonce:
                    type: string
                metrics:
                    $ref: '#/components/schemas/AgentMetrics'
        AgentHeartbeatResponse:
            type: object
            properties:
                nextNonce:
                    type: string
                nextHeartbeatAt:
                    type: string
                    format: date-time
                accessToken:
                    type: string
                accessTokenExpiresAt:
                    type: string
                    format: date-time
                commandStreamRequired:
                    type: boolean
                    description: 'Fallback channel: when bidi command stream is unavailable'
                pendingCommandHint:
                    $ref: '#/components/schemas/PendingCommandHint'
        AgentInfo:
            type: object
            properties:
                agentType:
                    type: string
                hostname:
                    type: string
                os:
                    type: string
                arch:
                    type: string
                ip:
                    type: string
                version:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                capability:
                    $ref: '#/components/schemas/AgentCapability'
                acpConfig:
                    $ref: '#/components/schemas/AgentACPConfig'
        AgentMetrics:
            type: object
            properties:
                cpuPercent:
                    type: number
                    format: double
                memoryUsedBytes:
                    type: string
                memoryTotalBytes:
                    type: string
                diskUsedBytes:
                    type: string
                diskTotalBytes:
                    type: string
                uptimeSeconds:
                    type: integer
                    format: uint32
                goroutineCount:
                    type: integer
                    format: uint32
        AgentSession:
            type: object
            properties:
                sessionId:
                    type: string
                agentName:
                    type: string
                sourceIp:
                    type: string
                agentVersion:
                    type: string
                fingerprint:
                    type: string
                connectedAt:
                    type: string
                    format: date-time
                lastHeartbeatAt:
                    type: string
                    format: date-time
                disconnectedAt:
                    type: string
                    format: date-time
                disconnectReason:
                    type: string
                state:
                    enum:
                        - CONNECTION_STATE_UNSPECIFIED
                        - ONLINE
                        - OFFLINE
                        - ERROR
                        - KICKED
                    type: string
                    format: enum
        AgentStatus:
            type: object
            properties:
                state:
                    enum:
                        - CONNECTION_STATE_UNSPECIFIED
                        - ONLINE
                        - OFFLINE
                        - ERROR
                        - KICKED
                    type: string
                    format: enum
                lastHeartbeatTime:
                    type: string
                    format: date-time
                connectedTime:
                    type: string
                    format: date-time
                errorMessage:
                    type: string
                activeSessionId:
                    type: string
        Attachment:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                mimeType:
                    type: string
                sizeBytes:
                    type: string
            description: |-
                Attachment references a file stored in S3 that is attached to a chat message.
                 The id is the file row uuid and doubles as the download key (/v1/files/{id}).
        BatchGetUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: The users from the specified request.
        CancelCommandRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        ChannelMember:
            type: object
            properties:
                memberType:
                    type: integer
                    format: int32
                memberId:
                    type: string
                displayName:
                    type: string
                memberRole:
                    type: integer
                    format: int32
                joinedAt:
                    type: string
                    format: date-time
        ChannelThread:
            type: object
            properties:
                rootMessage:
                    type: string
                    description: |-
                        root_message is the id (bare UUID) of the thread's root message; matches
                         ChatMessage.name so the client can map it back to a root row.
                replyCount:
                    type: integer
                    description: reply_count is the total number of replies in the thread (always ≥1).
                    format: int32
                latestReplyVersion:
                    type: string
                    description: |-
                        latest_reply_version is the maximum room_version among the thread's
                         replies.
                latestReplyAt:
                    type: string
                    description: latest_reply_at is the created_at of the most recent reply.
                    format: date-time
            description: |-
                ChannelThread is a summary of one active thread (a root with ≥1 reply) in a
                 conversation.
        ChannelUpdate:
            type: object
            properties:
                conversation:
                    type: string
                currentVersion:
                    type: string
                processedVersion:
                    type: string
                newMessageCount:
                    type: integer
                    format: int32
            description: |-
                ChannelUpdate describes one conversation that has unread messages for the
                 agent. new_message_count is the number of chat_message rows with
                 room_version greater than the agent's processed_version for that channel.
        ChatMessage:
            type: object
            properties:
                name:
                    type: string
                conversation:
                    type: string
                principalName:
                    type: string
                role:
                    type: integer
                    format: int32
                content:
                    type: string
                commandId:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                senderName:
                    type: string
                senderType:
                    enum:
                        - SENDER_TYPE_UNSPECIFIED
                        - SENDER_TYPE_USER
                        - SENDER_TYPE_AGENT
                        - SENDER_TYPE_SYSTEM
                    type: string
                    format: enum
                roomVersion:
                    type: string
                    description: |-
                        room_version is the conversation.version at the time this message was
                         created. Agents use it together with their per-channel cursor (managed via
                         the ListChannelUpdates / AckProcessedVersion RPCs) to track progress into
                         the conversation.
                mentions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mention'
                isOwn:
                    type: boolean
                    description: |-
                        is_own is true when this message was sent by the calling agent itself. It is
                         caller-relative (computed by the manager from the authenticated agent vs the
                         message's sender_agent_id) so an agent can recognize its own past messages as
                         context-only and avoid replying to itself.
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                threadRoot:
                    type: string
                    description: |-
                        thread_root is the resource name of the root message of the thread this
                         message belongs to ("conversations/{c}/messages/{m}"). Empty for a normal
                         channel message (i.e. a root message itself, or a message outside any
                         thread). Replies in a thread carry the root message's name here.
                threadReplyCount:
                    type: integer
                    description: |-
                        thread_reply_count is the number of replies in the thread rooted at this
                         message. Only meaningful for root messages (thread_root empty); the frontend
                         uses it to render the reply-count badge on the root message in the main
                         channel list. Always 0 for thread replies.
                    format: int32
                task:
                    allOf:
                        - $ref: '#/components/schemas/TaskInfo'
                    description: |-
                        task is set when this message is a task (a row exists in the task table for
                         this message id). Populated by ListConversationMessages / ListThreadMessages
                         for root messages; absent for non-task messages and thread replies.
        ClaimTaskRequest:
            required:
                - message
            type: object
            properties:
                message:
                    type: string
                    description: |-
                        message is the resource name of the task's root message
                         ("conversations/{c}/messages/{m}").
        ClaimTaskResponse:
            type: object
            properties:
                message:
                    allOf:
                        - $ref: '#/components/schemas/ChatMessage'
                    description: |-
                        message is the task message after the claim, with task populated (status
                         now IN_PROGRESS, assignee set to the caller). When the claim failed because
                         another agent already owns the task or it is not in TODO, the RPC returns
                         FAILED_PRECONDITION instead and this response is not sent.
        Command:
            type: object
            properties:
