    /v1/users:
        get:
            tags:
                - UserService
            description: |-
                List all users.
                 Any authenticated user can list users.
            operationId: UserService_ListUsers
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    The maximum number of users to return. The service may return fewer than
                     this value.
                     If unspecified, at most 10 users will be returned.
                     The maximum value is 1000; values above 1000 will be coerced to 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    A page token, received from a previous `ListUsers` call.
                     Provide this to retrieve the subsequent page.

                     When paginating, all other parameters provided to `ListUsers` must match
                     the call that provided the page token.
                  schema:
                    type: string
                - name: showDeleted
                  in: query
                  description: Show deleted users if specified.
                  schema:
                    type: boolean
                - name: filter
                  in: query
                  description: |-
                    Filter is used to filter users returned in the list.
                     The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

                     Supported filter:
                     - name: the user name, support "==" and ".matches()" operator.
                     - email: the user email, support "==" and ".matches()" operator.
                     - user_type: the type, check UserType enum for values, support "==", "in [xx]", "!(in [xx])" operator.
                     - state: check State enum for values, support "==" operator.
                     - project: the project full name in "projects/{id}" format, support "==" operator.

                     For example:
                     name == "ed"
                     name.matches("ed")
                     email == "ed@example.com"
                     email.matches("ed")
                     user_type == "SERVICE_ACCOUNT"
                     user_type in ["SERVICE_ACCOUNT", "USER"]
                     !(user_type in ["SERVICE_ACCOUNT", "USER"])
                     state == "DELETED"
                     project == "projects/sample-project"
                     You can combine filter conditions like:
                     name.matches("ed") && project == "projects/sample-project"
                     (name == "ed" || email == "ed@example.com") && project == "projects/sample-project"
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListUsersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
