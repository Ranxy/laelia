                                $ref: '#/components/schemas/UpdatePushConfigResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/pushSubscriptions:
        get:
            tags:
                - NotificationService
            description: |-
                ListPushSubscriptions returns every push subscription registered for the
                 authenticated user, one per device/browser. The frontend uses it to render
                 whether the current browser is subscribed and to reconcile a browser-side
                 subscription that is missing server-side.
            operationId: NotificationService_ListPushSubscriptions
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListPushSubscriptionsResponse'
