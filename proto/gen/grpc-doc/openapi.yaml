                    type: array
                    items:
                        $ref: '#/components/schemas/ApiProvider'
                nextPageToken:
                    type: string
        ListChannelMembersResponse:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChannelMember'
        ListChannelThreadsResponse:
            type: object
            properties:
                threads:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChannelThread'
        ListChannelUpdatesResponse:
            type: object
            properties:
                updates:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChannelUpdate'
        ListChannelsForAgentResponse:
            type: object
            properties:
                channels:
                    type: array
                    items:
                        $ref: '#/components/schemas/Conversation'
                nextPageToken:
                    type: string
        ListChannelsResponse:
            type: object
            properties:
                channels:
                    type: array
                    items:
                        $ref: '#/components/schemas/Conversation'
                nextPageToken:
                    type: string
        ListCommandsResponse:
            type: object
            properties:
                commands:
                    type: array
                    items:
                        $ref: '#/components/schemas/Command'
                nextPageToken:
                    type: string
        ListConversationMessagesResponse:
            type: object
            properties:
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChatMessage'
                nextPageToken:
                    type: string
                currentVersion:
                    type: string
        ListDueRemindersResponse:
            type: object
            properties:
                reminders:
                    type: array
                    items:
                        $ref: '#/components/schemas/Reminder'
                    description: |-
                        reminders are the DUE reminders owned by the calling agent, ordered by
                         fire_at ascending. The agent drain loop calls this each session to pick up
                         fired reminders and process them.
        ListGroupsResponse:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/Group'
                nextPageToken:
                    type: string
        ListMachineAgentsResponse:
            type: object
            properties:
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentSummary'
                nextPageToken:
                    type: string
        ListMachinesResponse:
            type: object
            properties:
                machines:
                    type: array
                    items:
                        $ref: '#/components/schemas/MachineSummary'
                nextPageToken:
                    type: string
        ListMcpServersResponse:
            type: object
            properties:
                mcpServers:
                    type: array
                    items:
                        $ref: '#/components/schemas/McpServer'
                nextPageToken:
                    type: string
        ListPeerAgentsResponse:
            type: object
            properties:
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/PeerAgent'
        ListPiModelsRequest:
            required:
                - apiProvider
            type: object
            properties:
                apiProvider:
                    type: string
                    description: LLM API provider id ("deepseek" | "openrouter"). See AgentACPConfig.api_provider.
                apiKey:
                    type: string
                    description: Plaintext LLM API key. Required for deepseek; ignored (public endpoint) for openrouter.
        ListPiModelsResponse:
            type: object
            properties:
                models:
                    type: array
                    items:
                        $ref: '#/components/schemas/PiModel'
        ListPushSubscriptionsResponse:
            type: object
            properties:
                pushSubscriptions:
                    type: array
                    items:
                        $ref: '#/components/schemas/PushSubscription'
                    description: |-
                        push_subscriptions are the caller's registered browser push endpoints, one
                         per device/browser, ordered by creation time (oldest first).
        ListRemindersResponse:
            type: object
            properties:
                reminders:
                    type: array
                    items:
                        $ref: '#/components/schemas/Reminder'
                nextPageToken:
                    type: string
        ListRolesResponse:
            type: object
            properties:
                roles:
                    type: array
                    items:
                        $ref: '#/components/schemas/Role'
                nextPageToken:
                    type: string
        ListTaskCountsResponse:
            type: object
            properties:
                todoCount:
                    type: integer
                    format: int32
                inProgressCount:
                    type: integer
                    format: int32
                inReviewCount:
                    type: integer
                    format: int32
                doneCount:
                    type: integer
                    format: int32
        ListTasksResponse:
            type: object
            properties:
                tasks:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChatMessage'
                    description: |-
                        tasks are one page of the channel's task root messages, each with task
                         populated, ordered by task_number descending (newest first).
                nextPageToken:
                    type: string
                    description: |-
                        next_page_token is the cursor for the next (older) page; empty when this
                         page is the last.
        ListThreadMessagesResponse:
            type: object
            properties:
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChatMessage'
                    description: messages is [root, ...replies] in room_version order.
                nextPageToken:
                    type: string
                currentVersion:
                    type: string
        ListThreadParticipantsResponse:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChannelMember'
                    description: |-
                        members is the distinct senders in the thread. member_role is not meaningful for
                         thread participation and is left 0.
        ListThreadUpdatesResponse:
            type: object
            properties:
                updates:
                    type: array
                    items:
                        $ref: '#/components/schemas/ThreadUpdate'
        ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: The users from the specified request.
                nextPageToken:
                    type: string
                    description: |-
                        A token, which can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
        LlmAgentConfigSetting:
            type: object
            properties:
                allowUserSelfProvidedKeys:
                    type: boolean
                    description: |-
                        allow_user_self_provided_keys gates the legacy inline api_provider/api_key
                         path on builtin-pi agents. When true, any user who may create/edit the
                         agent can fill in their own LLM API key; when false, only a caller holding
                         agents.edit (workspace admin) may, and everyone else must use a global
                         provider. Default true.
            description: |-
                LlmAgentConfigSetting is the workspace-level LLM agent configuration. The
                 only knob today is whether users may self-provide an inline api_provider /
                 api_key / model when creating or editing a builtin-pi agent, in addition to
                 using the managed global API providers. Defaults to enabled when unset.
        LoginRequest:
            type: object
            properties:
                email:
                    type: string
                password:
                    type: string
                web:
                    type: boolean
                    description: If web is set, we will set access token, refresh token, and user to the cookie.
                idpName:
                    type: string
                    description: |-
                        The name of the identity provider.
                         Format: idps/{idp}
                idpContext:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderContext'
                    description: The idp_context is using to get the user information from identity provider.
        LoginResponse:
            type: object
            properties:
                token:
                    type: string
                requireResetPassword:
                    type: boolean
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user of successful login.
        LogoutRequest:
            type: object
            properties: {}
        Machine:
            type: object
            properties:
                name:
                    type: string
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                title:
                    type: string
                info:
                    $ref: '#/components/schemas/MachineInfo'
                status:
                    $ref: '#/components/schemas/MachineStatus'
                createdAt:
                    type: string
                    format: date-time
                labels:
                    type: object
                    additionalProperties:
                        type: string
                createdBy:
                    readOnly: true
                    type: string
                    description: Creator's user resource name (users/{id}).
                canEdit:
                    readOnly: true
                    type: boolean
                    description: |-
                        can_edit reports whether the current caller may modify this machine
                         (laelia.machines.edit).
                canCreateAgent:
                    readOnly: true
                    type: boolean
                    description: |-
                        can_create_agent reports whether the current caller may create agents on
                         this machine: the machine's creator, a workspace admin, or a principal
                         bound to roles/machineAgentCreator in the machine's IAM policy.
                canManage:
                    readOnly: true
                    type: boolean
                    description: |-
                        can_manage reports whether the current caller may manage this machine's
                         IAM policy (the machine's creator or a workspace admin).
        MachineDisconnectRequest:
            type: object
            properties:
                sessionId:
                    type: string
                reason:
                    type: string
        MachineHeartbeatRequest:
            type: object
            properties:
                sessionId:
                    type: string
                previousNonce:
                    type: string
        MachineHeartbeatResponse:
            type: object
            properties:
                nextNonce:
                    type: string
                nextHeartbeatAt:
                    type: string
                    format: date-time
                accessToken:
                    type: string
                accessTokenExpiresAt:
                    type: string
                    format: date-time
        MachineInfo:
            type: object
            properties:
                hostname:
                    type: string
                os:
                    type: string
                arch:
                    type: string
                ip:
                    type: string
                version:
                    type: string
                labels:
                    type: object
                    additionalProperties:
                        type: string
                capability:
                    $ref: '#/components/schemas/AgentCapability'
                availableProviders:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentProviderInfo'
                    description: |-
                        LLM agent providers auto-discovered by the machine app on its host.
                         Machine-scoped: every agent hosted on this machine selects from this list.
        MachineStatus:
            type: object
            properties:
                state:
                    enum:
                        - CONNECTION_STATE_UNSPECIFIED
                        - ONLINE
                        - OFFLINE
                        - ERROR
                        - KICKED
                    type: string
                    format: enum
                lastHeartbeatTime:
                    type: string
                    format: date-time
                connectedTime:
                    type: string
                    format: date-time
                errorMessage:
                    type: string
                activeSessionId:
                    type: string
        MachineSummary:
            type: object
            properties:
                name:
                    type: string
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                title:
                    type: string
                status:
                    $ref: '#/components/schemas/MachineStatus'
                agentCount:
                    type: integer
                    format: int32
            description: |-
                MachineSummary is the lightweight list-view projection of a Machine returned
                 by ListMachines. It carries identity, lifecycle state, connection status, and
                 the count of agents bound to the machine.
        MarkActivityDoneRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
            description: |-
                MarkActivityDone marks a single activity item DONE for the authenticated user,
                 hiding it from All and Unread. The caller's own id must own the row; the name
                 is "users/{user}/activities/{message}".
        MarkActivityDoneResponse:
            type: object
            properties:
                activity:
                    $ref: '#/components/schemas/Activity'
        MarkConversationReadRequest:
            required:
                - conversation
            type: object
            properties:
                conversation:
                    type: string
            description: |-
                MarkConversationRead advances the requesting user's per-conversation read
                 cursor to the conversation's current room_version, clearing the user-facing
                 unread badge for that conversation. read_version in the response is the
                 resulting cursor value, so the frontend can set its local state to the exact
                 server value.
        MarkConversationReadResponse:
            type: object
            properties:
                readVersion:
                    type: string
        McpHeader:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                value:
                    writeOnly: true
                    type: string
                maskedValue:
                    readOnly: true
                    type: string
            description: |-
                McpHeader is one HTTP header attached to MCP transport requests. On write a
                 masked ("****"-prefixed) or empty value means "keep the stored value".
        McpHttpTransport:
            required:
                - url
            type: object
            properties:
                url:
                    type: string
                    description: The MCP streamable HTTP endpoint URL, e.g. "https://mcp.example.com/mcp".
                headers:
                    type: array
                    items:
                        $ref: '#/components/schemas/McpHeader'
                    description: |-
                        Headers sent with every request to the MCP server (typically
                         Authorization). Values are stored server-side and masked on read.
            description: McpHttpTransport is a streamable-HTTP MCP transport.
        McpServer:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: The resource name of the MCP server, in the form `mcpServers/{id}`.
                title:
                    type: string
                    description: Human-readable title.
                description:
                    type: string
                    description: Longer description of the MCP server.
                http:
                    allOf:
                        - $ref: '#/components/schemas/McpHttpTransport'
                    description: Streamable HTTP transport.
                sse:
                    allOf:
                        - $ref: '#/components/schemas/McpSseTransport'
                    description: SSE transport.
                members:
                    type: array
                    items:
                        type: string
                    description: |-
                        Users or groups allowed to use this MCP server, in IAM member format:
                         `users/{uid}`, `groups/{email}`, `groups/{id}`, or `allUsers`. Access is
                         checked when an agent references the server (and again at call time).
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                createdBy:
                    readOnly: true
                    type: string
                    description: Creator's user resource name (users/{id}). Display-only.
                configVersion:
                    readOnly: true
                    type: string
                    description: |-
                        config_version increments on every update. The agent gateway returns it in
                         the tool catalog and re-checks it at call time so stale catalogs fail
                         closed instead of silently running against changed server configuration.
                scope:
                    enum:
                        - MCP_SERVER_SCOPE_UNSPECIFIED
                        - MCP_SERVER_SCOPE_WORKSPACE
                        - MCP_SERVER_SCOPE_USER
                    type: string
                    description: |-
                        Scope of the server. On Create, WORKSPACE requires the management
                         permission and USER requires the "users may configure MCP servers"
                         workspace setting; the value is fixed for the lifetime of the server.
                    format: enum
            description: |-
                McpServer is a managed MCP service. WORKSPACE servers are admin-managed and
                 shared through the members list; USER servers are private to their creator.
                 The manager holds the full transport configuration (URL and header values)
                 and only exposes a per-agent tool catalog to machines; header values are
                 masked on read.
        McpSseTransport:
            required:
                - url
            type: object
            properties:
                url:
                    type: string
                    description: The MCP SSE endpoint URL, e.g. "https://mcp.example.com/sse".
                headers:
                    type: array
                    items:
                        $ref: '#/components/schemas/McpHeader'
                    description: |-
                        Headers sent with requests to the MCP server. Values are stored
                         server-side and masked on read.
            description: |-
                McpSseTransport is an SSE MCP transport. The messages endpoint is derived
                 from the standard MCP SSE layout (`GET url` for the event stream and
                 `POST /messages?session_id=...` on the same origin).
        Mention:
            type: object
            properties:
                type:
                    type: string
                id:
                    type: string
                name:
                    type: string
        OAuth2IdentityProviderContext:
            type: object
            properties:
                code:
                    type: string
        PeerAgent:
            type: object
            properties:
                name:
                    type: string
                displayName:
                    type: string
                personaPrompt:
                    type: string
                connectionState:
                    enum:
                        - CONNECTION_STATE_UNSPECIFIED
                        - ONLINE
                        - OFFLINE
                        - ERROR
                        - KICKED
                    type: string
                    format: enum
            description: |-
                PeerAgent is a roster entry for the calling agent: the name, display name,
                 persona, and connection state of one peer agent. Returned by ListPeerAgents,
                 which excludes the caller.
        PendingCommandHint:
            type: object
            properties:
                commandId:
                    type: string
                command:
                    type: string
                env:
                    type: object
                    additionalProperties:
                        type: string
                workingDir:
                    type: string
                timeoutSeconds:
                    type: integer
                    format: int32
        PermissionDecidedPayload:
            type: object
            properties:
                toolCallId:
                    type: string
                kind:
                    type: string
                optionId:
                    type: string
                optionKind:
                    type: string
        PermissionOptionPayload:
            type: object
            properties:
                optionId:
                    type: string
                name:
                    type: string
                kind:
                    type: string
        PermissionRequestedPayload:
            type: object
            properties:
                toolCallId:
                    type: string
                kind:
                    type: string
                title:
                    type: string
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/PermissionOptionPayload'
                expiresAt:
                    type: string
        PermissionTimedOutPayload:
            type: object
            properties:
                toolCallId:
                    type: string
                kind:
                    type: string
        PiModel:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
            description: PiModel is one model id returned by the LLM API provider's model-listing API.
        PostMessageRequest:
            required:
                - conversation
                - content
                - baseVersion
            type: object
            properties:
                conversation:
                    type: string
                content:
                    type: string
                baseVersion:
                    type: string
                commandId:
                    type: string
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                threadRoot:
                    type: string
                    description: |-
                        thread_root, when set, makes this agent reply a message in the thread
                         rooted at the given message name. Empty posts a normal channel message.
        PostMessageResponse:
            type: object
            properties:
                committed:
                    type: boolean
                message:
                    $ref: '#/components/schemas/ChatMessage'
                currentVersion:
                    type: string
                newMessages:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChatMessage'
                conflictDescription:
                    type: string
        PushSubscription:
            type: object
            properties:
                name:
                    type: string
                endpoint:
                    type: string
            description: |-
                PushSubscription is a registered browser push endpoint for a user. The
                 resource name is "users/{user}/pushSubscriptions/{endpointKey}".
        RawAcpPayload:
            type: object
            properties:
                data:
                    type: object
        RefreshAgentProvidersRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
        RefreshAgentProvidersResponse:
            type: object
            properties:
                providers:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentProviderInfo'
        RefreshAgentTokenRequest:
            type: object
            properties:
                refreshToken:
                    type: string
                fingerprint:
                    type: string
        RefreshAgentTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string
                accessTokenExpiresAt:
                    type: string
                    format: date-time
        RefreshMachineProvidersRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
        RefreshMachineProvidersResponse:
            type: object
            properties:
                providers:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentProviderInfo'
        RefreshMachineTokenRequest:
            type: object
            properties:
                refreshToken:
                    type: string
                fingerprint:
                    type: string
        RefreshMachineTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string
                accessTokenExpiresAt:
                    type: string
                    format: date-time
        Reminder:
            type: object
            properties:
                name:
                    type: string
                conversation:
                    type: string
                    description: |-
                        conversation is the conversation the trigger message belongs to
                         ("conversations/{id}").
                message:
                    type: string
                    description: |-
                        message is the trigger message ("conversations/{c}/messages/{m}"); it is
                         also the thread root for the reminder's discussion.
                assigneeAgent:
                    type: string
                    description: |-
                        assignee_agent is the owning agent ("agents/{id}"); the agent that claimed
                         the reminder at creation.
                assigneeName:
                    type: string
                taskContent:
                    type: string
                    description: |-
                        task_content is the agent's structured summary of the work to perform on
                         each fire.
                fireAt:
                    type: string
                    description: |-
                        fire_at is the next fire time. For one-shot reminders (cron_expr empty) it
                         is the single trigger time; for recurring reminders it is the next cron
                         fire, recomputed after each completion/miss.
                    format: date-time
                cronExpr:
                    type: string
                    description: |-
                        cron_expr, when non-empty, makes the reminder recurring. A standard
                         5-field cron (min hour dom month dow) interpreted in tz. Empty = one-shot.
                tz:
                    type: string
                    description: |-
                        tz is the IANA timezone name used to interpret cron_expr (e.g.
                         "Asia/Shanghai"). "UTC" by default.
                status:
                    enum:
                        - REMINDER_STATUS_UNSPECIFIED
                        - REMINDER_STATUS_PENDING
                        - REMINDER_STATUS_DUE
                        - REMINDER_STATUS_COMPLETED
                        - REMINDER_STATUS_CANCELLED
                        - REMINDER_STATUS_MISSED
                        - REMINDER_STATUS_FAILED
                    type: string
                    format: enum
                retryCount:
                    type: integer
                    description: |-
                        retry_count is the number of delivery attempts since the last fire for an
                         offline agent (0 when the agent was reached on the first try).
                    format: int32
                nextRetryAt:
                    type: string
                    format: date-time
                lastAttemptAt:
                    type: string
                    format: date-time
                lastFiredAt:
                    type: string
                    format: date-time
                lastCompletedAt:
                    type: string
                    format: date-time
                result:
                    type: string
                    description: result is the agent's completion/failure report from the most recent fire.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                Reminder is the scheduled-task metadata attached to a root chat_message. The
                 chat_message (root) remains the source of truth for the trigger content; this
                 row carries the schedule, assignee, and lifecycle state. The resource name is
                 "reminders/{message_id}" — the reminder's identity is its trigger message.
        ResolveChannelByTitleResponse:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/Conversation'
        RespondPermissionRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                optionId:
                    type: string
        RevokeAgentTokenRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        RevokeAgentTokenResponse:
            type: object
            properties: {}
        RevokeMachineTokenRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        RevokeMachineTokenResponse:
            type: object
            properties: {}
        Role:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: The resource name of the role, in the form `roles/{resource_id}`.
                title:
                    type: string
                    description: Human-readable title.
                description:
                    type: string
                    description: Longer description of what the role grants.
                permissions:
                    type: array
                    items:
                        type: string
                    description: |-
                        Permissions bundled into the role, each a `laelia.<resource>.<verb>`
                         string from the permission catalog.
                predefined:
                    readOnly: true
                    type: boolean
                    description: Output only. Whether the role is predefined (defined in Go, read-only).
            description: |-
                Role is a named bundle of permissions. Predefined roles (workspaceAdmin,
                 workspaceMember, conversationMember/Admin/Owner, agentEditor,
                 agentDMReviewer, oversightReviewer) are defined in Go and never stored in
                 the DB; custom roles live in the role table. Both resolve identically in the
                 IAM engine. Predefined roles are read-only over this API.
        RotateAgentTokenRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        RotateAgentTokenResponse:
            type: object
            properties:
                bootstrapToken:
                    type: string
        RotateMachineTokenRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                reason:
                    type: string
        RotateMachineTokenResponse:
            type: object
            properties:
                registrationToken:
                    type: string
        S3ConfigSetting:
            type: object
            properties:
                endpoint:
                    type: string
                    description: |-
                        S3-compatible endpoint URL, e.g. "https://s3.amazonaws.com" or a MinIO
                         endpoint. Empty for AWS defaults.
                region:
                    type: string
                    description: AWS region, e.g. "us-east-1".
                bucket:
                    type: string
                    description: Bucket name.
                accessKey:
                    type: string
                    description: Static access key id.
                secretKey:
                    type: string
                    description: |-
                        Static secret access key. Stored as plaintext in the setting row (same
                         mechanism as AUTH_SECRET); masked on read.
                forcePathStyle:
                    type: boolean
                    description: |-
                        Use path-style addressing (required for MinIO and many S3-compatible
                         stores; false for AWS virtual-host style).
                useSsl:
                    type: boolean
                    description: Whether the endpoint uses TLS. Only meaningful when endpoint is set.
            description: |-
                S3ConfigSetting holds the connection details for the object storage used to
                 back file upload/download. When endpoint and bucket are both empty, S3 is
                 considered unconfigured and upload/download endpoints reject with
                 "s3 not configured".
        SearchAuditLogsResponse:
            type: object
            properties:
                auditLogs:
                    type: array
                    items:
                        $ref: '#/components/schemas/AuditLog'
                nextPageToken:
                    type: string
        SearchChatHistoryResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChatMessage'
                nextPageToken:
                    type: string
        SendMessageRequest:
            required:
                - conversation
                - content
            type: object
            properties:
                conversation:
                    type: string
                content:
                    type: string
                mentions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mention'
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                threadRoot:
                    type: string
                    description: |-
                        thread_root, when set, makes this message a reply in the thread rooted at
                         the given message name ("conversations/{c}/messages/{m}"). Empty posts a
                         normal channel message.
                asTask:
                    type: boolean
                    description: |-
                        as_task, when true, creates this message as a task: a task row is inserted
                         in the same transaction with a per-conversation task number and status
                         TODO. Only valid for top-level messages (thread_root must be empty).
        SetAgentIamPolicyRequest:
            required:
                - name
                - policy
            type: object
            properties:
                name:
                    type: string
                    description: The agent resource name, in the form `agents/{agent}`.
                policy:
                    $ref: '#/components/schemas/IamPolicy'
                etag:
                    type: string
        SetConversationPinnedRequest:
            required:
                - conversation
            type: object
            properties:
                conversation:
                    type: string
                pinned:
                    type: boolean
            description: |-
                SetConversationPinned sets or clears the requesting user's per-conversation
                 pin. Pinning a channel or DM keeps it at the top of the user's left-rail
                 list independent of last message time. Per-user state
                 (conversation_member.pinned/pinned_at); only the caller's own pin is
                 affected.
        SetConversationPinnedResponse:
            type: object
            properties: {}
        SetMachineIamPolicyRequest:
            required:
                - name
                - policy
            type: object
            properties:
                name:
                    type: string
                    description: The machine resource name, in the form `machines/{machine}`.
                policy:
                    $ref: '#/components/schemas/IamPolicy'
                etag:
                    type: string
        SetWorkspaceIamPolicyRequest:
            required:
                - policy
            type: object
            properties:
                policy:
                    $ref: '#/components/schemas/IamPolicy'
                etag:
                    type: string
        SetupItem:
            type: object
            properties:
                id:
                    type: string
                configured:
                    type: boolean
            description: |-
                SetupItem describes one required-config item the admin onboarding overlay
                 surfaces. The backend is the source of truth for `configured`; the frontend
                 owns presentation (title/description/route) keyed by `id`.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        TaskInfo:
            type: object
            properties:
                taskNumber:
                    type: integer
                    description: 'task_number is the per-conversation sequence number shown as "[task #N]".'
                    format: int32
                status:
                    enum:
                        - TASK_STATUS_UNSPECIFIED
                        - TASK_STATUS_TODO
                        - TASK_STATUS_IN_PROGRESS
                        - TASK_STATUS_IN_REVIEW
                        - TASK_STATUS_DONE
                    type: string
                    format: enum
                assigneeName:
                    type: string
                    description: assignee_name is the assigned agent's display name, empty when unassigned.
                assigneeResourceId:
                    type: string
                    description: |-
                        assignee_resource_id is the assigned agent's resource id ("agents/<id>"),
                         empty when unassigned.
            description: |-
                TaskInfo is the task metadata attached to a ChatMessage that is a task. It is
                 a read-only join output populated by ListConversationMessages /
                 ListThreadMessages for root messages; absent on non-task messages and on
                 thread replies. The chat_message itself remains the source of truth for
                 content/sender/room_version.
        TextDeltaPayload:
            type: object
            properties:
                streamType:
                    type: string
                content:
                    type: string
        ThreadUpdate:
            type: object
            properties:
                conversation:
                    type: string
                threadRoot:
                    type: string
                    description: thread_root is the resource name of the thread's root message.
                latestVersion:
                    type: string
                    description: |-
                        latest_version is the maximum room_version among the thread's replies
                         (the version the agent should read up to before acking).
                newReplyCount:
                    type: integer
                    description: |-
                        new_reply_count is the number of replies with room_version greater than
                         the agent's processed_version for this conversation.
                    format: int32
            description: ThreadUpdate describes one subscribed thread with unread replies.
        ToolCallFinishedPayload:
            type: object
            properties:
                status:
                    type: string
                rawOutput:
                    type: object
        ToolCallStartedPayload:
            type: object
            properties:
                title:
                    type: string
                rawInput:
                    type: object
        TransferAgentOwnershipRequest:
            required:
                - name
                - newOwner
            type: object
            properties:
                name:
                    type: string
                newOwner:
                    type: string
                    description: New owner's user resource name (users/{id}).
                reason:
                    type: string
        TransferAgentOwnershipResponse:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/Agent'
        TransferChannelOwnershipRequest:
            required:
                - conversation
                - memberId
            type: object
            properties:
                conversation:
                    type: string
                memberType:
                    type: integer
                    format: int32
                memberId:
                    type: string
            description: |-
                TransferChannelOwnershipRequest names the channel and the member who will
                 become the new owner. The new owner must already be a member.
        TransferChannelOwnershipResponse:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/Conversation'
        UnclaimTaskRequest:
            required:
                - message
            type: object
            properties:
                message:
                    type: string
        UnclaimTaskResponse:
            type: object
            properties:
                message:
                    $ref: '#/components/schemas/ChatMessage'
        UndeleteUserRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the deleted user.
                         Format: users/{user}
        UpdateAgentACPConfigRequest:
            required:
                - name
                - acpConfig
            type: object
            properties:
                name:
                    type: string
                acpConfig:
                    $ref: '#/components/schemas/AgentACPConfig'
        UpdateAgentMcpConfigRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                mcpServers:
                    type: array
                    items:
                        type: string
                    description: |-
                        mcp_servers is the full replacement set of enabled MCP server resource
                         names (mcpServers/{id}).
        UpdateChannelMemberRoleRequest:
            required:
                - conversation
                - memberId
                - targetRole
            type: object
            properties:
                conversation:
                    type: string
                memberId:
                    type: string
                memberType:
                    type: integer
                    format: int32
                targetRole:
                    type: integer
                    format: int32
            description: |-
                UpdateChannelMemberRoleRequest sets a member's chat role. target_role is the
                 conversation_member role value: 2 = Member, 3 = Admin. Owner (1) is not
                 settable here — ownership only moves via TransferChannelOwnership.
        UpdateDebugConfigRequest:
            required:
                - enabled
            type: object
            properties:
                enabled:
                    type: boolean
        UpdateDebugConfigResponse:
            type: object
            properties:
                enabled:
                    type: boolean
        UpdateLlmAgentConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/LlmAgentConfigSetting'
        UpdatePushConfigRequest:
            type: object
            properties:
                httpProxy:
                    type: string
                    description: |-
                        http_proxy is the outbound HTTP(S) proxy URL, or empty to disable the
                         proxy (direct connection). Only http:// and https:// schemes are accepted.
        UpdatePushConfigResponse:
            type: object
            properties:
                httpProxy:
                    type: string
                    description: http_proxy echoes the stored proxy value (empty when the proxy is off).
        UpdateReminderRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: name is the reminder resource name ("reminders/{message_id}").
                fireAt:
                    type: string
                    description: |-
                        fire_at, cron_expr, tz, task_content are the editable fields. At least one
                         must be set. Editing a DUE or MISSED reminder resets it to PENDING with the
                         new schedule. COMPLETED/CANCELLED/FAILED reminders cannot be edited.
                    format: date-time
                cronExpr:
                    type: string
                tz:
                    type: string
                taskContent:
                    type: string
        UpdateReminderResponse:
            type: object
            properties:
                reminder:
                    $ref: '#/components/schemas/Reminder'
        UpdateS3ConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/S3ConfigSetting'
        UpdateTaskStatusRequest:
            required:
                - message
                - status
            type: object
            properties:
                message:
                    type: string
                status:
                    enum:
                        - TASK_STATUS_UNSPECIFIED
                        - TASK_STATUS_TODO
                        - TASK_STATUS_IN_PROGRESS
                        - TASK_STATUS_IN_REVIEW
                        - TASK_STATUS_DONE
                    type: string
                    description: |-
                        status is the target status. Allowed transitions (enforced server-side):
                         IN_PROGRESS -> IN_REVIEW (the assignee marks the task ready for human
                         review) and IN_REVIEW -> DONE (the assignee marks the task done after
                         detecting the human's approval in the task's thread). TODO -> IN_PROGRESS
                         is performed by ClaimTask, not this RPC.
                    format: enum
        UpdateTaskStatusResponse:
            type: object
            properties:
                message:
                    $ref: '#/components/schemas/ChatMessage'
        UpdateUserMcpConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/UserMcpConfigSetting'
        User:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The name of the user.
                         Format: users/{user}. {user} is a system-generated unique ID.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - ACTIVE
                        - DELETED
                    type: string
                    format: enum
                email:
                    type: string
                title:
                    type: string
                userType:
                    enum:
                        - USER_TYPE_UNSPECIFIED
                        - USER
                        - SERVICE_ACCOUNT
                        - SYSTEM_BOT
                    type: string
                    format: enum
                password:
                    writeOnly: true
                    type: string
                serviceKey:
                    writeOnly: true
                    type: string
                recoveryCodes:
                    type: array
                    items:
                        type: string
                    description: The recovery_codes is the temporary recovery codes using in two phase verification.
                phone:
                    type: string
                    description: |-
                        Should be a valid E.164 compliant phone number.
                         Could be empty.
                profile:
                    $ref: '#/components/schemas/UserProfile'
                groups:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        The groups for the user.
                         Format: groups/{identifier}, where the identifier is the group email when
                         the group has one, otherwise its id.
                workspaceAdmin:
                    readOnly: true
                    type: boolean
                    description: |-
                        workspace_admin is true when the user holds the roles/workspaceAdmin role.
                         Only populated for the current caller (GetCurrentUser). Retained as a
                         computed shim during the IAM transition; prefer `permissions` for gating.
                description:
                    type: string
                    description: |-
                        description is a short, user-authored self-description surfaced to agents and
                         other users so they know who this user is and what they focus on, e.g.
                         "Backend engineer, focused on agent building" or "UI/UX expert, reviews come to
                         me". Editable via UpdateUser with update_mask "description".
                permissions:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: |-
                        permissions is the caller's effective workspace-scope permission set
                         (roles/workspaceMember baseline ∪ the permissions of every workspace role
                         the user holds), populated only by GetCurrentUser. The frontend gates
                         workspace actions on this (e.g. laelia.users.update). Per-resource
                         permissions (conversations.read/send/manage, agents.edit) are resolved per
                         resource and surfaced on the resource, not here.
                debugMode:
                    readOnly: true
                    type: boolean
                    description: |-
                        debug_mode is true when RuntimeDebug is enabled for the workspace.
                         Populated only by GetCurrentUser so the frontend can gate debug-only UI
                         without calling the admin-gated SettingService.GetDebugConfig.
                avatar:
                    readOnly: true
                    type: string
                    description: |-
                        avatar is the resource name of the user's uploaded avatar image, or empty
                         when the user has not uploaded one (in which case the frontend renders a
                         deterministic pixel identicon seeded by the user id). Format: users/{user}/avatar.
                chatPreferences:
                    allOf:
                        - $ref: '#/components/schemas/ChatPreferences'
                    description: |-
                        chat_preferences holds per-user chat composer preferences. Editable via
                         UpdateUser with update_mask "chat_preferences". When unset (the user has
                         never customized it) the server returns the default {enter_to_send = true}
                         so the historic behavior is preserved.
        UserMcpConfigSetting:
            type: object
            properties:
                allowUserMcpServers:
                    type: boolean
                    description: |-
                        allow_user_mcp_servers gates personal MCP servers: when true, any user may
                         create/edit/delete their own servers and enable them on their agents;
                         when false, personal servers are hidden from agent catalogs and creation
                         is rejected (existing rows are retained and restored on re-enable).
            description: |-
                UserMcpConfigSetting is the workspace-level personal MCP configuration. The
                 only knob today is whether users may configure their own personal MCP
                 servers and enable them on their own agents. Defaults to enabled when unset.
        UserProfile:
            type: object
            properties:
                lastLoginTime:
                    type: string
                    format: date-time
                lastChangePasswordTime:
                    type: string
                    format: date-time
                source:
                    type: string
                    description: source means where the user comes from. For now we support Entra ID SCIM sync, so the source could be Entra ID.
        WarningPayload:
            type: object
            properties:
                message:
                    type: string
tags:
    - name: AgentService
    - name: ApiProviderService
      description: |-
        ApiProviderService manages global LLM API providers. Management RPCs
         (create/update/delete) are gated by the IAM interceptor with the
         laelia.apiProviders.* permissions (held by workspaceAdmin or an authorized
         custom role). ListApiProviders is handler-gated instead: it returns only the
         providers the caller may use, so the agent create/edit form can list them
         without a management permission.
    - name: AuditLogService
      description: |-
        AuditLogService exposes the structured audit trail. Search and export are
         admin-tier (laelia.auditLogs.search / laelia.auditLogs.export).
    - name: AuthService
    - name: CommandService
    - name: GroupService
      description: |-
        GroupService manages user groups. Groups are bindable in IAM policies;
         group owners can manage their own groups without workspace-level group
         permissions. Groups synced from an external source (SCIM/IdP) are read-only.
    - name: IamService
      description: |-
        IamService exposes the workspace, per-agent, and per-machine IAM policies for
         management. Get reads the full policy; Set replaces it whole, guarded by an
         etag. The workspace/agent RPCs are gated by the IAM interceptor with
         laelia.iam.getPolicy / setPolicy; the machine RPCs are handler-gated (the
         machine's creator or a workspace admin) because a machine-scoped permission
         cannot express the creator's implicit authority.
    - name: MachineService
      description: |-
        MachineService manages machines (a long-lived agent-application process a
         user runs once on a host) and serves the machine-side authentication RPCs the
         machine app calls to register itself. A machine authenticates once with a
         registration token and then hosts one or more agents, each running its own
         AgentChannel over the machine's access token.
    - name: McpServerService
      description: |-
        McpServerService manages the MCP server registry. Get/Create/Update/Delete
         are handler-gated: workspace servers require the laelia.mcpServers.*
         permissions, while personal servers may be managed by their owner.
         ListMcpServers returns workspace servers only (admin: all; other callers:
         the servers they may use). ListMyMcpServers returns the caller's personal
         servers; ListUserMcpServers is an admin read-only view of every personal
         server.
    - name: NotificationService
      description: |-
        NotificationService manages per-user browser Web Push subscriptions so the
         manager can deliver system notifications for directed messages (mentions,
         thread replies, task/reminder updates, and 1:1 DMs) even when the user's
         browser tab is closed. All RPCs are user-scoped: the caller's own principal
         id is the implicit owner, mirroring ListActivities. The VAPID keypair is
         auto-generated on first boot and stored in the setting table, so no env
         config is required; GetPushConfig reports enabled=false if the keypair is
         somehow absent. An optional outbound HTTP proxy (for networks that cannot
         reach browser push services directly) is admin-configurable via
         UpdatePushConfig.
    - name: RoleService
      description: |-
        RoleService manages custom roles. Predefined roles are read-only over this
         API: create/update/delete refuse a resource id that collides with a
         predefined role. Each RPC is gated by the IAM interceptor with the
         laelia.roles.* permissions.
    - name: SettingService
      description: |-
        SettingService exposes workspace-level configuration. It is admin-only; the
         handlers enforce workspace admin membership and return
         connect.CodePermissionDenied otherwise. The S3 secret_key is masked on read;
         an update carrying a masked secret preserves the stored value.
    - name: UserService
