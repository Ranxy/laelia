    /v1/reminders:
        get:
            tags:
                - CommandService
            description: |-
                ListReminders returns reminders, optionally filtered by owning agent,
                 conversation, and status. Used by the agent-page Reminders tab (user) and
                 the agent CLI (self-list).
            operationId: CommandService_ListReminders
            parameters:
                - name: agent
                  in: query
                  description: |-
                    agent, when set, restricts the result to reminders owned by the given agent
                     ("agents/{id}"). The agent-page Reminders tab filters by the viewed agent.
                  schema:
                    type: string
                - name: conversation
                  in: query
                  description: |-
                    conversation, when set, restricts the result to reminders in that
                     conversation.
                  schema:
                    type: string
                - name: statusFilter
                  in: query
                  description: status_filter, when non-empty, restricts the result to the given statuses.
                  schema:
                    type: array
                    items:
                        enum:
                            - REMINDER_STATUS_UNSPECIFIED
                            - REMINDER_STATUS_PENDING
                            - REMINDER_STATUS_DUE
                            - REMINDER_STATUS_COMPLETED
                            - REMINDER_STATUS_CANCELLED
                            - REMINDER_STATUS_MISSED
                            - REMINDER_STATUS_FAILED
                        type: string
                        format: enum
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListRemindersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/reminders/{reminder}:
        get:
            tags:
                - CommandService
            description: GetReminder returns a single reminder by its resource name.
            operationId: CommandService_GetReminder
            parameters:
                - name: reminder
                  in: path
                  description: The reminder id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetReminderResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - CommandService
            description: |-
                UpdateReminder edits the schedule (fire_at/cron_expr/tz) or task_content of
                 a reminder. The caller is the owning agent or a workspace admin. Editing a
                 DUE or MISSED reminder resets it to PENDING with the new schedule.
            operationId: CommandService_UpdateReminder
            parameters:
                - name: reminder
                  in: path
                  description: The reminder id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateReminderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateReminderResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/reminders/{reminder}:cancel:
        post:
            tags:
                - CommandService
            description: |-
                CancelReminder cancels a reminder. The caller is the owning agent or a
                 workspace admin. A cancelled reminder is terminal.
            operationId: CommandService_CancelReminder
            parameters:
                - name: reminder
                  in: path
                  description: The reminder id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelReminderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CancelReminderResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/reminders/{reminder}:complete:
        post:
            tags:
                - CommandService
            description: |-
                CompleteReminder marks a DUE reminder completed and atomically posts the
                 result as a single system message in the reminder's thread. Only the owning
                 agent may call this. Recurring reminders reschedule to the next cron fire.
            operationId: CommandService_CompleteReminder
            parameters:
                - name: reminder
                  in: path
                  description: The reminder id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CompleteReminderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CompleteReminderResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/reminders/{reminder}:fail:
        post:
            tags:
                - CommandService
            description: |-
                FailReminder marks a DUE reminder failed with the given error and posts it
                 as a system thread message. Recurring reminders reschedule. Only the owning
                 agent may call this.
            operationId: CommandService_FailReminder
            parameters:
                - name: reminder
                  in: path
                  description: The reminder id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FailReminderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FailReminderResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
