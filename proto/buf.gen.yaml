version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../backend/generated-go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: ../backend/generated-go
    opt:
      - paths=source_relative
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: gen/grpc-doc
    opt: markdown,README.md,source_relative
  - remote: buf.build/bufbuild/es:v2.12.0
    out: ../frontend/src/types/proto-es
    include_imports: true
    types:
      - laelia.v1
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: gen/grpc-doc
    opt: html,index.html,source_relative
