# Example ACP config for laelia-agent.
#
# Usage:
# 1. Adjust the executable / args / paths to match your environment.
# 2. Save to ~/.laelia/acp.yaml, or start the agent with:
#    laelia-agent run --acp-config /absolute/path/to/acp_example.yaml
# 3. Or use --acp-config-server to receive config from the manager (no local file needed).
#
# Notes:
# - All directories in working_dir and additional_directories should be absolute paths.
# - allow_env is a whitelist of host environment variables that may be inherited.
# - env entries here override both inherited env and manager-supplied env.
# - auto_approve_tool_kinds only affects ACP permission prompts.

max_timeout_seconds: 1800
max_event_count: 10000
max_output_bytes: 1048576

# -- ACP agent executable --
executable: npx
args:
  - -y
  - "@agentclientprotocol/claude-agent-acp@latest"

# -- Workspace roots --
working_dir: /home/ran/gocode/laelia
additional_directories:
  - /home/ran/gocode/laelia/docs
  - /home/ran/gocode/laelia/proto

# -- Environment --
allow_env:
  - PATH
  - HOME
  - LANG
  - TERM
  - HTTP_PROXY
  - HTTPS_PROXY
  - NO_PROXY
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - GOOGLE_API_KEY

env:
  ACP_LOG: info

# -- Filesystem permissions --
read_text_files: true
write_text_files: false

# -- Auto-approve tool kinds (low-risk only) --
auto_approve_tool_kinds:
  - read
  - search
  - think
  - fetch

# -- Capability flags --
supports_diff: false
supports_raw_events: true
supports_tool_traces: true
